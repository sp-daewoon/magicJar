name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/magicjar

jobs:
  jvm:
    name: JVM (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [domain, api, batch, consumer]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}

      - name: Run :${{ matrix.module }}:check
        run: ./gradlew :${{ matrix.module }}:check --no-daemon --stacktrace

      - name: Build :${{ matrix.module }}:bootJar
        if: matrix.module != 'domain'
        run: ./gradlew :${{ matrix.module }}:bootJar --no-daemon

      - name: Upload bootJar artifact
        if: matrix.module != 'domain'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-jar
          path: ${{ matrix.module }}/build/libs/${{ matrix.module }}-*.jar
          retention-days: 7
          if-no-files-found: error

  pyworker:
    name: pyworker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyworker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyworker/uv.lock"

      - name: uv sync (frozen)
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install (frozen)
        run: pnpm install --frozen-lockfile

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  docker-build:
    name: Docker (${{ matrix.service }})
    needs: [jvm, pyworker, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, batch, consumer, pyworker, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JVM 3 서비스는 Dockerfile이 build/libs/<svc>-*.jar 를 COPY하므로 사전 빌드 필요.
      - name: Set up JDK 21
        if: contains(fromJSON('["api","batch","consumer"]'), matrix.service)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: contains(fromJSON('["api","batch","consumer"]'), matrix.service)
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar for ${{ matrix.service }}
        if: contains(fromJSON('["api","batch","consumer"]'), matrix.service)
        run: ./gradlew :${{ matrix.service }}:bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
