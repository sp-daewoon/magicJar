name: Release

# ADR 0049 — GitHub Actions = release 트리거 한정.
# 일상 PR/main push 검증은 .husky/pre-push 단독 책임.
# 본 workflow는 다음 2 트리거에만 발동:
#   1) v*.*.* 태그 push      → semver 이미지 + GitHub Release draft
#   2) release/v* 브랜치 push → 신규 베이스라인 컷 자동화 (ADR 0031)

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/magicjar

jobs:
  jvm-check:
    name: JVM check (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [domain, api, batch, consumer]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run :${{ matrix.module }}:check
        run: ./gradlew :${{ matrix.module }}:check --no-daemon --stacktrace

      - name: Build :${{ matrix.module }}:bootJar
        if: matrix.module != 'domain'
        run: ./gradlew :${{ matrix.module }}:bootJar --no-daemon

      - name: Upload bootJar artifact
        if: matrix.module != 'domain'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-jar
          path: ${{ matrix.module }}/build/libs/${{ matrix.module }}-*.jar
          retention-days: 7
          if-no-files-found: error

  frontend-check:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install (frozen)
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  docker-release:
    name: Docker (${{ matrix.service }})
    needs: [jvm-check, frontend-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, batch, consumer, pyworker, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JVM 3 서비스는 Dockerfile이 build/libs/<svc>-*.jar 를 COPY하므로 사전 빌드 필요.
      - name: Set up JDK 21
        if: contains(fromJSON('["api","batch","consumer"]'), matrix.service)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: contains(fromJSON('["api","batch","consumer"]'), matrix.service)
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar for ${{ matrix.service }}
        if: contains(fromJSON('["api","batch","consumer"]'), matrix.service)
        run: ./gradlew :${{ matrix.service }}:bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (semver / branch)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=ref,event=branch

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  github-release:
    name: GitHub Release draft
    needs: [docker-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
