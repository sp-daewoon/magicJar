<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title/text()}, ~{::section})}">
<head><title>매매일지 상세</title></head>
<body>
<section>
    <!-- 인쇄 친화 스타일 -->
    <style media="print">
        @page { size: A4; margin: 18mm; }
        header, footer, nav, .no-print { display: none !important; }
        section { color: #000; }
        .bg-white { box-shadow: none !important; border: 1px solid #ccc !important; }
    </style>

    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2 text-sm text-slate-500">
            <a th:href="@{/journal}" class="hover:text-teal-700">← 매매일지 목록</a>
        </div>
        <button type="button" onclick="window.print()"
                class="no-print px-3 py-1.5 rounded border border-slate-300 hover:bg-slate-100 text-xs">인쇄</button>
    </div>

    <!-- 헤더 -->
    <div class="bg-white rounded-lg shadow-sm p-5 border border-slate-200 mb-4">
        <div class="flex items-start justify-between flex-wrap gap-3">
            <div>
                <div class="text-2xl font-bold" th:text="${entry.name}">삼성전자</div>
                <div class="text-xs text-slate-500 mt-1">
                    <span th:text="${entry.code}">005930</span>
                    · 모드 <span class="font-medium" th:text="${entry.mode}">BACKTEST</span>
                    · 전략 <span class="font-medium" th:text="${entry.strategyId}">-</span>
                </div>
                <div class="mt-2">
                    <span th:each="t : ${entry.tags}"
                          class="inline-block text-xs bg-slate-100 text-slate-600 rounded px-2 py-0.5 mr-1"
                          th:text="${t}">tag</span>
                </div>
            </div>
            <div class="text-right">
                <div th:classappend="${entry.side.name() == 'BUY'} ? 'mj-up' : 'mj-down'"
                     class="text-xl font-bold"
                     th:text="${entry.side}">BUY</div>
                <div th:if="${entry.pnl != null}" class="mt-2">
                    <div th:classappend="${entry.pnl.signum() >= 0} ? 'mj-up' : 'mj-down'"
                         class="text-2xl font-bold tabular-nums"
                         th:text="${#numbers.formatInteger(entry.pnl, 0, 'COMMA')} + ' 원'">+0 원</div>
                    <div th:if="${entry.pnlRate != null}"
                         th:classappend="${entry.pnlRate.signum() >= 0} ? 'mj-up' : 'mj-down'"
                         class="text-sm tabular-nums"
                         th:text="${#numbers.formatDecimal(entry.pnlRate, 1, 2)} + '%'">0%</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 진입/청산 카드 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <h2 class="text-sm font-semibold text-slate-500 mb-3">진입</h2>
            <dl class="text-sm space-y-1.5">
                <div class="flex justify-between"><dt class="text-slate-500">시각</dt>
                    <dd th:text="${#temporals.format(entry.entryAt, 'yyyy-MM-dd HH:mm:ss')} + ' KST'">-</dd></div>
                <div class="flex justify-between"><dt class="text-slate-500">진입가</dt>
                    <dd class="tabular-nums" th:text="${#numbers.formatInteger(entry.entryPrice, 0, 'COMMA')} + ' 원'">0</dd></div>
                <div class="flex justify-between"><dt class="text-slate-500">수량</dt>
                    <dd class="tabular-nums" th:text="${#numbers.formatInteger(entry.entryQty, 0, 'COMMA')} + ' 주'">0</dd></div>
            </dl>
            <div class="mt-3">
                <div class="text-xs text-slate-500 mb-1">진입 사유</div>
                <p class="text-sm text-slate-700 whitespace-pre-line"
                   th:text="${entry.entryReason}">-</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <h2 class="text-sm font-semibold text-slate-500 mb-3">청산</h2>
            <div th:if="${entry.exitAt == null}" class="text-sm text-slate-400 py-6 text-center">
                보유 중
            </div>
            <div th:if="${entry.exitAt != null}">
                <dl class="text-sm space-y-1.5">
                    <div class="flex justify-between"><dt class="text-slate-500">시각</dt>
                        <dd th:text="${#temporals.format(entry.exitAt, 'yyyy-MM-dd HH:mm:ss')} + ' KST'">-</dd></div>
                    <div class="flex justify-between"><dt class="text-slate-500">청산가</dt>
                        <dd class="tabular-nums"
                            th:text="${entry.exitPrice != null} ? ${#numbers.formatInteger(entry.exitPrice, 0, 'COMMA')} + ' 원' : '-'">0</dd></div>
                    <div class="flex justify-between"><dt class="text-slate-500">수량</dt>
                        <dd class="tabular-nums"
                            th:text="${entry.exitQty != null} ? ${#numbers.formatInteger(entry.exitQty, 0, 'COMMA')} + ' 주' : '-'">0</dd></div>
                </dl>
                <div class="mt-3">
                    <div class="text-xs text-slate-500 mb-1">청산 사유</div>
                    <p class="text-sm text-slate-700 whitespace-pre-line"
                       th:text="${entry.exitReason} ?: '-'">-</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 지표 스냅샷 -->
    <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200 mb-4">
        <h2 class="text-sm font-semibold text-slate-500 mb-3">지표 스냅샷</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <div class="text-xs text-slate-500 mb-1">진입 시점</div>
                <table class="w-full text-xs">
                    <tbody class="divide-y divide-slate-100">
                    <tr th:each="kv : ${entry.entrySnapshot}">
                        <td class="py-1 text-slate-500" th:text="${kv.key}">key</td>
                        <td class="py-1 text-right tabular-nums"
                            th:text="${#numbers.formatDecimal(kv.value, 1, 4)}">0</td>
                    </tr>
                    <tr th:if="${entry.entrySnapshot.isEmpty()}">
                        <td class="py-2 text-slate-400 text-center" colspan="2">스냅샷 없음</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <div class="text-xs text-slate-500 mb-1">청산 시점</div>
                <table class="w-full text-xs">
                    <tbody class="divide-y divide-slate-100">
                    <tr th:each="kv : ${entry.exitSnapshot}">
                        <td class="py-1 text-slate-500" th:text="${kv.key}">key</td>
                        <td class="py-1 text-right tabular-nums"
                            th:text="${#numbers.formatDecimal(kv.value, 1, 4)}">0</td>
                    </tr>
                    <tr th:if="${entry.exitSnapshot.isEmpty()}">
                        <td class="py-2 text-slate-400 text-center" colspan="2">스냅샷 없음</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- AI 복기 -->
    <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200 mb-4">
        <h2 class="text-sm font-semibold text-slate-500 mb-3">AI 복기</h2>
        <div th:if="${entry.aiExplanation == null && entry.aiReview == null}"
             class="text-xs text-slate-400 py-3">
            AI 복기 미생성. 비활성 상태일 수 있습니다 (<span class="font-mono">ANTHROPIC_API_KEY</span> 미설정 또는 ai 모듈 미조립).
        </div>
        <div th:if="${entry.aiExplanation != null}" class="mb-3">
            <div class="text-xs text-slate-500 mb-1">설명</div>
            <p class="text-sm text-slate-700 whitespace-pre-line" th:text="${entry.aiExplanation}">-</p>
        </div>
        <div th:if="${entry.aiReview != null}">
            <div class="text-xs text-slate-500 mb-1">복기·조언</div>
            <p class="text-sm text-slate-700 whitespace-pre-line" th:text="${entry.aiReview}">-</p>
        </div>
    </div>

    <!-- 사용자 노트 (HTMX inline edit) -->
    <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200 no-print">
        <h2 class="text-sm font-semibold text-slate-500 mb-3">내 메모</h2>
        <form th:hx-patch="@{'/journal/' + ${entry.id} + '/note'}"
              hx-target="this" hx-swap="outerHTML"
              class="flex flex-col gap-2">
            <textarea name="userNote" rows="3"
                      class="border border-slate-300 rounded px-2 py-1.5 text-sm"
                      placeholder="이 매매에 대한 메모를 남겨 보세요"
                      th:text="${entry.userNote}"></textarea>
            <div class="flex justify-end">
                <button type="submit" class="px-3 py-1.5 rounded bg-teal-700 text-white hover:bg-teal-800 text-xs">저장</button>
            </div>
        </form>
        <div class="mt-2 text-xs text-slate-400">
            마지막 수정 <span th:text="${#temporals.format(entry.updatedAt, 'yyyy-MM-dd HH:mm')} + ' KST'">-</span>
        </div>
    </div>
</section>
</body>
</html>
