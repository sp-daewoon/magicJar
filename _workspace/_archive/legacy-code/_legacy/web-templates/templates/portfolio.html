<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title/text()}, ~{::section})}">
<head><title>포트폴리오</title></head>
<body>
<section>
    <h1 class="text-2xl font-bold mb-4">포트폴리오</h1>
    <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4">
        <div th:if="${positions.isEmpty()}" class="text-sm text-slate-500">
            보유 포지션이 없습니다. 모의/실전 모드 조립 후 표시됩니다.
        </div>
        <table th:unless="${positions.isEmpty()}" class="w-full text-sm">
            <thead class="text-xs text-slate-500 uppercase">
            <tr>
                <th class="text-left py-2">종목</th>
                <th class="text-right py-2">수량</th>
                <th class="text-right py-2">평단</th>
                <th class="text-right py-2">보유 시각</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${positions}" class="border-t border-slate-100">
                <td class="py-2" th:text="${p.code}">-</td>
                <td class="py-2 text-right" th:text="${p.qty}">0</td>
                <td class="py-2 text-right" th:text="${#numbers.formatInteger(p.avgPrice, 0, 'COMMA')}">0</td>
                <td class="py-2 text-right text-slate-500" th:text="${#temporals.format(p.openedAt, 'yyyy-MM-dd')}">-</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
