<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title/text()}, ~{::section})}">
<head><title>매매일지</title></head>
<body>
<section>
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold">매매일지</h1>
        <div class="flex items-center gap-2 text-xs">
            <a th:href="@{/journal/reports/monthly}" class="px-3 py-1.5 rounded border border-slate-300 hover:bg-slate-100">월간 리포트</a>
        </div>
    </div>

    <!-- 필터 폼: HTMX 변경 시 결과만 갱신 (현재는 form GET 으로 페이지 리로드도 OK) -->
    <form id="journal-filter"
          th:action="@{/journal}" method="get"
          hx-get="/journal" hx-trigger="change delay:200ms" hx-target="#journal-result" hx-select="#journal-result" hx-swap="outerHTML"
          class="bg-white rounded-lg shadow-sm p-4 border border-slate-200 mb-4 grid grid-cols-2 md:grid-cols-7 gap-3 text-sm">
        <label class="flex flex-col gap-1">
            <span class="text-xs text-slate-500">모드</span>
            <select name="mode" class="border border-slate-300 rounded px-2 py-1">
                <option value="" th:selected="${filter.mode == null}">전체</option>
                <option th:each="m : ${modes}" th:value="${m.name()}" th:text="${m.name()}"
                        th:selected="${filter.mode != null && filter.mode.name() == m.name()}">BACKTEST</option>
            </select>
        </label>
        <label class="flex flex-col gap-1">
            <span class="text-xs text-slate-500">사이드</span>
            <select name="side" class="border border-slate-300 rounded px-2 py-1">
                <option value="" th:selected="${filter.side == null}">전체</option>
                <option th:each="s : ${sides}" th:value="${s.name()}" th:text="${s.name()}"
                        th:selected="${filter.side != null && filter.side.name() == s.name()}">BUY</option>
            </select>
        </label>
        <label class="flex flex-col gap-1">
            <span class="text-xs text-slate-500">시작일</span>
            <input type="date" name="from" class="border border-slate-300 rounded px-2 py-1"
                   th:value="${param.from}"/>
        </label>
        <label class="flex flex-col gap-1">
            <span class="text-xs text-slate-500">종료일</span>
            <input type="date" name="to" class="border border-slate-300 rounded px-2 py-1"
                   th:value="${param.to}"/>
        </label>
        <label class="flex flex-col gap-1">
            <span class="text-xs text-slate-500">전략 ID</span>
            <input type="text" name="strategyId" placeholder="ema-cross"
                   class="border border-slate-300 rounded px-2 py-1"
                   th:value="${filter.strategyId}"/>
        </label>
        <label class="flex flex-col gap-1">
            <span class="text-xs text-slate-500">태그</span>
            <input type="text" name="tag" placeholder="swing"
                   class="border border-slate-300 rounded px-2 py-1"
                   th:value="${filter.tag}"/>
        </label>
        <label class="flex flex-col gap-1">
            <span class="text-xs text-slate-500">종목코드</span>
            <input type="text" name="code" placeholder="005930"
                   class="border border-slate-300 rounded px-2 py-1"
                   th:value="${filter.code}"/>
        </label>
        <div class="col-span-2 md:col-span-7 flex items-center gap-2 justify-end">
            <button type="submit" class="px-3 py-1.5 rounded bg-teal-700 text-white hover:bg-teal-800">조회</button>
            <a th:href="@{/journal}" class="px-3 py-1.5 rounded border border-slate-300 hover:bg-slate-100">초기화</a>
        </div>
    </form>

    <!-- 결과 영역 (HTMX swap 대상) -->
    <div id="journal-result">
        <div th:if="${entries.isEmpty()}"
             class="bg-white rounded-lg shadow-sm p-8 border border-slate-200 text-center text-sm text-slate-500">
            <div class="text-base font-semibold text-slate-700 mb-2">필터에 해당하는 매매 기록이 없습니다</div>
            <div class="text-xs text-slate-500">
                백테스트 또는 모의투자를 실행해 첫 매매 기록을 만들어 보세요.
                <a th:href="@{/strategies}" class="text-teal-700 hover:underline">전략 페이지로 이동</a>
            </div>
        </div>

        <div th:unless="${entries.isEmpty()}"
             class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-500 text-xs">
                <tr>
                    <th class="px-3 py-2 text-left">진입 일자(KST)</th>
                    <th class="px-3 py-2 text-left">종목</th>
                    <th class="px-3 py-2 text-center">사이드</th>
                    <th class="px-3 py-2 text-right">진입가</th>
                    <th class="px-3 py-2 text-right">수량</th>
                    <th class="px-3 py-2 text-right">청산가</th>
                    <th class="px-3 py-2 text-right">PnL</th>
                    <th class="px-3 py-2 text-right">PnL %</th>
                    <th class="px-3 py-2 text-left">전략</th>
                    <th class="px-3 py-2 text-left">태그</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="e : ${entries}" class="hover:bg-slate-50">
                    <td class="px-3 py-2 text-xs text-slate-600"
                        th:text="${#temporals.format(e.entryAt, 'yyyy-MM-dd HH:mm')}">2026-04-25 09:30</td>
                    <td class="px-3 py-2">
                        <a th:href="@{'/journal/' + ${e.id}}" class="text-teal-700 hover:underline">
                            <span class="font-medium" th:text="${e.name}">삼성전자</span>
                            <span class="text-slate-400 text-xs ml-1" th:text="${e.code}">005930</span>
                        </a>
                    </td>
                    <td class="px-3 py-2 text-center">
                        <span th:classappend="${e.side.name() == 'BUY'} ? 'mj-up' : 'mj-down'"
                              th:text="${e.side}">BUY</span>
                    </td>
                    <td class="px-3 py-2 text-right tabular-nums"
                        th:text="${#numbers.formatInteger(e.entryPrice, 0, 'COMMA')}">0</td>
                    <td class="px-3 py-2 text-right tabular-nums"
                        th:text="${#numbers.formatInteger(e.entryQty, 0, 'COMMA')}">0</td>
                    <td class="px-3 py-2 text-right tabular-nums text-slate-600"
                        th:text="${e.exitPrice != null} ? ${#numbers.formatInteger(e.exitPrice, 0, 'COMMA')} : '-'">-</td>
                    <td class="px-3 py-2 text-right tabular-nums"
                        th:classappend="${e.pnl != null && e.pnl.signum() >= 0} ? 'mj-up' : (${e.pnl != null} ? 'mj-down' : '')"
                        th:text="${e.pnl != null} ? ${#numbers.formatInteger(e.pnl, 0, 'COMMA')} : '-'">-</td>
                    <td class="px-3 py-2 text-right tabular-nums"
                        th:classappend="${e.pnlRate != null && e.pnlRate.signum() >= 0} ? 'mj-up' : (${e.pnlRate != null} ? 'mj-down' : '')"
                        th:text="${e.pnlRate != null} ? ${#numbers.formatDecimal(e.pnlRate, 1, 2) + '%'} : '-'">-</td>
                    <td class="px-3 py-2 text-xs text-slate-600" th:text="${e.strategyId}">-</td>
                    <td class="px-3 py-2">
                        <span th:each="t : ${e.tags}"
                              class="inline-block text-xs bg-slate-100 text-slate-600 rounded px-1.5 py-0.5 mr-1"
                              th:text="${t}">tag</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 페이지네이션 (offset/limit 기반 단순 prev/next) -->
        <div th:unless="${entries.isEmpty()}" class="flex items-center justify-between mt-3 text-xs text-slate-500">
            <div>
                <span th:text="|총 ${entries.size()}건 표시|">-</span>
                · offset <span th:text="${filter.offset}">0</span>
                / limit <span th:text="${filter.limit}">50</span>
            </div>
            <div class="flex items-center gap-2">
                <a th:if="${filter.offset > 0}"
                   th:href="@{/journal(mode=${param.mode},side=${param.side},from=${param.from},to=${param.to},strategyId=${param.strategyId},tag=${param.tag},code=${param.code},limit=${filter.limit},offset=${filter.offset - filter.limit})}"
                   class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-100">← 이전</a>
                <a th:if="${entries.size() == filter.limit}"
                   th:href="@{/journal(mode=${param.mode},side=${param.side},from=${param.from},to=${param.to},strategyId=${param.strategyId},tag=${param.tag},code=${param.code},limit=${filter.limit},offset=${filter.offset + filter.limit})}"
                   class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-100">다음 →</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
