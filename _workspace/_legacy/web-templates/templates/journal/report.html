<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title/text()}, ~{::section})}">
<head><title>매매일지 월간 리포트</title></head>
<body>
<section>
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold">월간 리포트</h1>
        <a th:href="@{/journal}" class="text-xs text-teal-700 hover:underline">← 매매일지 목록</a>
    </div>

    <!-- 월 네비게이션 -->
    <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200 mb-4 flex items-center justify-between">
        <div class="text-sm">
            대상 월: <span class="font-bold" th:text="${target}">2026-04</span>
            <span class="text-slate-400 text-xs ml-2">(KST)</span>
        </div>
        <form th:action="@{/journal/reports/monthly}" method="get" class="flex items-center gap-2 text-xs">
            <input type="month" name="ym" th:value="${target}"
                   class="border border-slate-300 rounded px-2 py-1"/>
            <button type="submit" class="px-3 py-1 rounded bg-teal-700 text-white hover:bg-teal-800">조회</button>
        </form>
    </div>

    <!-- 핵심 지표 카드 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <div class="text-xs text-slate-500">총 매매 수</div>
            <div class="text-2xl font-bold mt-1 tabular-nums" th:text="${totalTrades}">0</div>
        </div>
        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <div class="text-xs text-slate-500">승 / 패</div>
            <div class="text-2xl font-bold mt-1 tabular-nums">
                <span class="mj-up" th:text="${wins}">0</span>
                <span class="text-slate-400">/</span>
                <span class="mj-down" th:text="${losses}">0</span>
            </div>
            <div class="text-xs text-slate-500 mt-1">
                승률
                <span th:if="${totalTrades > 0}"
                      th:text="${#numbers.formatDecimal(wins * 100.0 / totalTrades, 1, 1) + '%'}">0%</span>
                <span th:if="${totalTrades == 0}">-</span>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <div class="text-xs text-slate-500">총 PnL</div>
            <div class="text-2xl font-bold mt-1 tabular-nums"
                 th:classappend="${pnl.signum() >= 0} ? 'mj-up' : 'mj-down'"
                 th:text="${#numbers.formatInteger(pnl, 0, 'COMMA')} + ' 원'">0</div>
        </div>
        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <div class="text-xs text-slate-500">전략 종류</div>
            <div class="text-2xl font-bold mt-1 tabular-nums" th:text="${strategies.size()}">0</div>
            <div class="text-xs text-slate-500 mt-1">월간 사용 전략 수</div>
        </div>
    </div>

    <!-- 차트 영역 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <h2 class="text-sm font-semibold text-slate-500 mb-2">전략별 거래 분포</h2>
            <div th:if="${strategies.isEmpty()}" class="text-xs text-slate-400 py-8 text-center">
                이 달의 기록이 없습니다
            </div>
            <canvas th:if="${!strategies.isEmpty()}" id="strategyBarChart" height="180"></canvas>
        </div>
        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <h2 class="text-sm font-semibold text-slate-500 mb-2">누적 PnL (Equity Curve)</h2>
            <div th:if="${totalTrades == 0}" class="text-xs text-slate-400 py-8 text-center">
                이 달의 기록이 없습니다
            </div>
            <canvas th:if="${totalTrades > 0}" id="equityLineChart" height="180"></canvas>
        </div>
    </div>

    <!-- 차트 데이터 직렬화 -->
    <script th:if="${!strategies.isEmpty()}" th:inline="javascript">
        /*<![CDATA[*/
        const strategyData = /*[[${strategies}]]*/ {};
        document.addEventListener('DOMContentLoaded', () => {
            const labels = Object.keys(strategyData);
            const values = labels.map(k => strategyData[k]);
            const ctx = document.getElementById('strategyBarChart');
            if (ctx && window.Chart) {
                new Chart(ctx, {
                    type: 'bar',
                    data: { labels: labels, datasets: [{ label: '거래 수', data: values, backgroundColor: '#0d9488' }] },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            }
        });
        /*]]>*/
    </script>

    <script th:if="${totalTrades > 0}" th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', () => {
            // 일자별 누적 pnl 계산은 컨트롤러가 raw entries를 노출하지 않으므로,
            // MVP 단계에서는 총 PnL 단일 포인트만 시각화한다 (백엔드 확장 후 일자별 데이터 연결).
            const totalPnl = /*[[${pnl}]]*/ 0;
            const ctx = document.getElementById('equityLineChart');
            if (ctx && window.Chart) {
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['월초', '월말'],
                        datasets: [{
                            label: '누적 PnL',
                            data: [0, totalPnl],
                            borderColor: '#0d9488',
                            backgroundColor: 'rgba(13,148,136,0.1)',
                            fill: true, tension: 0.2
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            }
        });
        /*]]>*/
    </script>
</section>
</body>
</html>
