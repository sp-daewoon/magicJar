<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="|magicJar · ${title}|">magicJar</title>

    <!-- Tailwind CDN (MVP — 프로덕션 전 CLI 빌드 전환 예정) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <!-- HTMX 1.9 -->
    <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
    <!-- Alpine.js 3 -->
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" crossorigin="anonymous"></script>
    <!-- Chart.js 4 + financial 플러그인 (종목 페이지에서 사용) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" th:href="@{/css/magicjar.css}"/>
    <script defer th:src="@{/js/magicjar.js}"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<!-- AI 비활성 배너 (ai 모듈 미조립/키 없음) -->
<div th:if="${!aiEnabled}" class="bg-amber-100 text-amber-900 text-sm px-4 py-2 border-b border-amber-200">
    AI 기능이 비활성 상태입니다. <span class="font-semibold">ANTHROPIC_API_KEY</span> 설정 또는 ai 모듈 조립 후 이용하세요.
</div>

<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
        <a th:href="@{/}" class="flex items-center gap-2 text-lg font-bold text-teal-700">
            <span>마법의항아리</span>
            <span class="text-xs text-slate-400 font-normal">magicJar · 부자될꼬야</span>
        </a>
        <nav class="flex-1 flex items-center gap-4 text-sm">
            <a th:href="@{/}" class="hover:text-teal-700">홈</a>
            <a th:href="@{/instruments/005930}" class="hover:text-teal-700">종목</a>
            <a th:href="@{/strategies}" class="hover:text-teal-700">전략</a>
            <a th:href="@{/portfolio}" class="hover:text-teal-700">포트폴리오</a>
            <a th:href="@{/journal}" class="hover:text-teal-700">매매일지</a>
            <a th:href="@{/harness}" class="hover:text-teal-700 text-slate-500">하네스</a>
        </nav>
        <div class="text-xs text-slate-500 flex items-center gap-3">
            <span data-ws-status="true" class="mj-ws-status" data-state="disconnected">WS 대기</span>
            <span th:text="${#temporals.format(serverTimeKst, 'yyyy-MM-dd HH:mm z')}">-</span>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
    <div th:replace="${content}">본문</div>
</main>

<footer class="max-w-7xl mx-auto px-4 py-8 text-xs text-slate-400">
    magicJar MVP · Kotlin 2.0 / Spring Boot 3.3 · 모든 시각은 KST 기준
</footer>

</body>
</html>
