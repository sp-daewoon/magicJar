## §1 시나리오 0 — 첫 부팅 셋업 (T-ONBOARD)

### 개요

사용자가 magicJar 처음 진입 시 ⚙️ SetupWizard를 통해 KIS 앱키/시크릿을 입력하고, AES-256-GCM으로 암호화해 DB에 저장한다. 이후 토큰 발급 검증까지 완료되면 온보딩이 완료된다.

> raw 출처: `https://github.com/koreainvestment/open-trading-api/blob/main/oauth2/oauth2.py` — `/oauth2/tokenP` 토큰 발급 엔드포인트 정합
>
> 구현 위치: `consumer/src/main/kotlin/kr/spdaewoon/magicjar/consumer/infrastructure/kis/KisAuthAdapter.kt:129` — `issueToken()` KIS `/oauth2/tokenP` POST

```mermaid
sequenceDiagram
    actor User as 사용자
    participant FE as Frontend (React)
    participant API as api (Spring Boot)
    participant KIS as KIS OpenAPI
    participant PG as PostgreSQL

    User->>FE: /setup 진입 → SetupWizard 렌더
    Note over FE: OnboardingGuardFilter 401 응답 시 자동 redirect
    User->>FE: KIS 앱키 / 시크릿 입력 (KisRealStep)
    FE->>API: POST /api/onboarding/kis/validate {appKey, appSecret, accountType}
    API->>API: AesGcmCipher.encrypt(appKey) + AesGcmCipher.encrypt(appSecret)
    Note over API: api/src/.../adapter/kis/KisAuthValidator.kt

    API->>KIS: POST /oauth2/tokenP {grant_type, appkey, appsecret}
    Note over KIS: TR: 없음 (OAuth2 토큰 발급)<br/>실전: https://openapi.koreainvestment.com:9443<br/>모의: https://openapivts.koreainvestment.com:29443
    KIS-->>API: {access_token, token_type, expires_in}

    API->>PG: user_kis_credential UPSERT (app_key_enc, secret_key_enc, account_type)
    Note over PG: Flyway V2 테이블 — masked_account GENERATED

    API-->>FE: 200 OK {validated: true}
    User->>FE: SystemConfigStep 완료 → /api/onboarding/complete
    FE->>API: POST /api/onboarding/complete
    API->>PG: system_config.onboarding_completed = true
    API-->>FE: 200 OK
    FE->>User: /watchlist 리다이렉트 (ADR 0040 §2-2 — 셋업 완료 진입점)
```

**에러 핸들링**:
- KIS 401 / 403 응답 → 즉시 실패, 재시도 금지 (잘못된 앱키 신호)
- 메모리 zero-fill: `issueToken()` 완료 후 `appKey.fill(0)` + `secretKey.fill(0)` (`KisAuthAdapter.kt:154`)

## §2 시나리오 1 — Watchlist 등록 (T-W1)

### 개요

사용자가 InstrumentSearchInput에서 한글로 종목명을 검색한 후, 관심종목에 등록한다. 등록 즉시 Kafka 이벤트가 발행되어 T-W2 Ingestion Worker가 해당 종목의 실시간 구독을 시작한다.

> 구현 위치: `api/src/main/kotlin/kr/spdaewoon/magicjar/api/controller/WatchlistController.kt:81` — `POST /api/watchlists`
> 구현 위치: `api/src/main/kotlin/kr/spdaewoon/magicjar/api/service/WatchlistService.kt` — Kafka `watchlist.changed.v1` publish

```mermaid
sequenceDiagram
    actor User as 사용자
    participant FE as Frontend (React)
    participant API as api (Spring Boot)
    participant Redis as Redis
    participant PG as PostgreSQL
    participant Kafka as Kafka
    participant Consumer as consumer (KIS WS Worker)

    User->>FE: WatchlistPage → 종목 검색창 클릭
    User->>FE: "삼성" 입력 (IME composition 처리)
    FE->>API: GET /api/instruments?query=삼성
    Note over API: InstrumentSearchService.search()<br/>api/src/.../service/InstrumentSearchService.kt

    API->>Redis: ZRANGEBYLEX instrument:search:* [삼\xff (prefix bucket)
    alt Redis hit (자동완성 인덱스 존재)
        Redis-->>API: [{code:"005930", name:"삼성전자"}, ...]
    else Redis miss
        API->>PG: JPQL searchByNameOrCode — pg_trgm + name_norm LIKE
        PG-->>API: [{code, name, market, type}, ...]
        API->>Redis: ZADD instrument:search:삼 + 1d TTL (lazy 재구성)
    end

    API-->>FE: [{code:"005930", name:"삼성전자", market:"KOSPI"}, ...]
    FE->>User: 자동완성 드롭다운 표시

    User->>FE: "삼성전자" 선택 → WatchlistAddForm submit
    FE->>API: POST /api/watchlists {code:"005930"}
    API->>PG: watchlist INSERT (user_id, code, priority=100)
    Note over PG: UQ(user_id, code) — 중복 시 409 반환
    API->>PG: instrument stub row UPSERT (code="005930" 미존재 시)
    API->>Kafka: watchlist.changed.v1 {action:"ADDED", code:"005930", userId}
    API-->>FE: 201 Created {code:"005930", name:"삼성전자", ...}

    Kafka->>Consumer: WatchlistChangedKafkaListener.onMessage()
    Note over Consumer: consumer/src/.../WatchlistIngestionWorker.kt
    Consumer->>Consumer: SubscriptionRouter.addSubscription("005930")
    Consumer->>Consumer: KisWebSocketBridge.subscribe(["005930"])
    Note over Consumer: H0STCNT0 체결가 구독 (ADR 0048 §2-1 slot 예산)
```

**에러 핸들링**:
- 409 WATCHLIST_DUPLICATE → FE 사용자 친화 메시지 표시
- Kafka publish 실패 시 WARN 로그 + watchlist row는 이미 INSERT 완료 (비치명)

## §3 시나리오 2 — Symbol Detail 진입 + 시세 fallback (T-S1·T-MS1)

### 개요

사용자가 관심종목 row를 클릭하면 SymbolDetailPage로 진입한다. 장중 정상 시 KIS WS H0STCNT0 체결가 스트림이 Redis → STOMP를 통해 실시간 전달된다. WS 끊김 시 5초 polling fallback, 비영업일 시 마지막 거래일 종가 표시로 3단계 fallback이 동작한다.

> raw 출처 (FHKST01010100): `https://github.com/koreainvestment/open-trading-api/blob/main/examples_llm/domestic_stock/inquire_price/inquire_price.py`
>
> raw 출처 (FHKST01010200): `https://github.com/koreainvestment/open-trading-api/blob/main/examples_llm/domestic_stock/inquire_asking_price/inquire_asking_price.py`
>
> raw 출처 (CTCA0903R): `https://github.com/koreainvestment/open-trading-api/blob/main/examples_llm/domestic_stock/chk_holiday/chk_holiday.py`
>
> 구현 위치: `consumer/src/main/kotlin/kr/spdaewoon/magicjar/consumer/ws/KisWebSocketBridge.kt:246` — `handleTickData()` H0STCNT0 파이프 파싱
>
> 구현 위치: `consumer/src/main/kotlin/kr/spdaewoon/magicjar/consumer/infrastructure/kis/KisRestPriceAdapter.kt:61` — `fetchPrice()` FHKST01010100 polling

```mermaid
sequenceDiagram
    actor User as 사용자
    participant FE as Frontend (React)
    participant API as api (Spring Boot)
    participant Consumer as consumer
    participant KIS as KIS OpenAPI
    participant Redis as Redis
    participant STOMP as STOMP /topic/

    User->>FE: WatchlistRow 클릭 → navigate("/symbol/005930")
    FE->>API: GET /api/symbols/005930/price (1회 초기 로드)
    Note over API: SymbolController.getSymbol()<br/>api/src/.../controller/SymbolController.kt

    API->>Redis: GET quote:last:005930
    alt Redis hit
        Redis-->>API: {price, volume, ts, source}
    else Redis miss
        API->>KIS: GET /uapi/domestic-stock/v1/quotations/inquire-price?fid_input_iscd=005930
        Note over KIS: TR_ID: FHKST01010100<br/>Header: authorization Bearer, appkey, appsecret, custtype=P
        KIS-->>API: {output:{stck_prpr, acml_vol, per, pbr, ...}}
        API->>Redis: SET quote:last:005930 TTL 7d
    end
    API-->>FE: {code:"005930", price, volume, per, pbr, ...}

    FE->>API: GET /api/symbols/005930/candles?interval=1d&count=60
    Note over API: CandleQueryService.getCandles()
    API->>Redis: HGETALL candle:today:005930:1d (당일 진행 중 캔들)
    API-->>FE: [Candle, ...] — LWC 차트 렌더

    FE->>STOMP: SUBSCRIBE /topic/symbol/005930/tick (useStompTopic hook)
    FE->>API: POST /api/symbols/005930/orderbook/subscribe
    Note over API: Kafka market.orderbook.subscribe.v1 publish

    rect rgb(200, 255, 200)
        Note over Consumer,KIS: 장중 정상 경로 (H0STCNT0 WS stream)
        KIS->>Consumer: H0STCNT0 파이프 메시지 (체결가|거래량|...)
        Consumer->>Consumer: KisWsMessageParser.parseH0Stcnt0() — 45필드 파싱
        Consumer->>Redis: SET quote:last:005930 + HMSET candle:today:005930:1d
        Consumer->>STOMP: Kafka market.tick.v1 → api STOMP relay /topic/symbol/005930/tick
        STOMP-->>FE: {price, volume, ts}
        FE->>FE: SymbolPriceCard 실시간 갱신 + LWC 차트 tick 반영
    end

    rect rgb(255, 240, 200)
        Note over Consumer,KIS: WS 끊김 fallback (polling 5초)
        Consumer->>Consumer: heartbeat watchdog 10초 무신호 감지
        Consumer->>Consumer: scheduleReconnect() — 지수 백오프 0/2/5/10/30s
        Consumer->>Consumer: 30s 초과 → pollingFallbackActive=true
        Note over Consumer: KisWebSocketBridge.kt:415
        Consumer->>KIS: GET /uapi/domestic-stock/v1/quotations/inquire-price (FHKST01010100)
        KIS-->>Consumer: {output.stck_prpr}
        Consumer->>Redis: SET quote:last:005930 {source:"polling", stale:false}
        Consumer->>STOMP: market.tick.v1 relay
        FE->>FE: stale 배지 표시 (소스="polling")
    end

    rect rgb(255, 220, 220)
        Note over API,PG: 비영업일 경로 (MarketSession HOLIDAY)
        FE->>API: GET /api/symbols/005930/price
        API->>API: KrxMarketSessionResolver.currentSession()
        Note over API: market_calendar 테이블 조회 + 시간 기반 FSM<br/>api/src/.../adapter/KrxMarketSessionResolver.kt
        API->>API: session = HOLIDAY → previousBusinessDay() 계산
        API->>Redis: GET quote:last:005930 (마지막 거래일 종가)
        API-->>FE: {price, stale:true, sessionStatus:"HOLIDAY"}
        FE->>FE: "휴장일 - 마지막 거래가" 표시
    end
```

**에러 핸들링**:
- WS 재연결 3회 이상 실패 → polling fallback 자동 활성화 (`KisWebSocketBridge.kt:415`)
- KIS REST 인증 실패(401/403) → 즉시 에러 throw, 재시도 금지 (`KisAuthAdapter.kt` 분산락 패턴)

## §4 시나리오 3 — Corporate Action 적용 (T-CA1)

### 개요

매일 18:30 KST에 CorpActionSyncJob이 DART OPENDART와 KIS ksdinfo 6 endpoint를 순차 호출하여 기업행위(배당·증자·분할 등)를 수집한다. 수집된 corp_action은 Kafka를 통해 CandleAdjustmentJob에 전달되어 과거 캔들의 수정주가가 소급 보정된다.

> raw 출처 (HHKDB669100C0 paidin-capin): `https://github.com/koreainvestment/open-trading-api/blob/main/examples_llm/domestic_stock/ksdinfo_paidin_capin/ksdinfo_paidin_capin.py`
>
> raw 출처 (HHKDB669101C0 bonus-issue): `https://github.com/koreainvestment/open-trading-api/blob/main/examples_llm/domestic_stock/ksdinfo_bonus_issue/ksdinfo_bonus_issue.py`
>
> raw 출처 (HHKDB669102C0 dividend): `https://github.com/koreainvestment/open-trading-api/blob/main/examples_llm/domestic_stock/ksdinfo_dividend/ksdinfo_dividend.py`
>
> raw 출처 (HHKDB669104C0 merger-split): `https://github.com/koreainvestment/open-trading-api/blob/main/examples_llm/domestic_stock/ksdinfo_merger_split/ksdinfo_merger_split.py`
>
> raw 출처 (HHKDB669105C0 rev-split): `https://github.com/koreainvestment/open-trading-api/blob/main/examples_llm/domestic_stock/ksdinfo_rev_split/ksdinfo_rev_split.py`
>
> raw 출처 (HHKDB669106C0 cap-dcrs): `https://github.com/koreainvestment/open-trading-api/blob/main/examples_llm/domestic_stock/ksdinfo_cap_dcrs/ksdinfo_cap_dcrs.py`
>
> raw 출처 (DART OPENDART list.json): `https://opendart.fss.or.kr/guide/detail.do?apiGrpCd=DS001&apiId=2019001`
>
> 구현 위치: `batch/src/main/kotlin/kr/spdaewoon/magicjar/batch/job/corp_action/CorpActionSyncJob.kt:55` — `run()` cron 18:30 KST
>
> 구현 위치: `batch/src/main/kotlin/kr/spdaewoon/magicjar/batch/infrastructure/kis/KisKsdInfoAdapter.kt:70` — 6 endpoint 어댑터
>
> 구현 위치: `batch/src/main/kotlin/kr/spdaewoon/magicjar/batch/infrastructure/dart/DartDisclosureAdapter.kt:43` — DART list.json 어댑터
>
> 구현 위치: `batch/src/main/kotlin/kr/spdaewoon/magicjar/batch/job/corp_action/CandleAdjustmentJob.kt:49` — Kafka 리스너 + 소급 보정

```mermaid
sequenceDiagram
    participant Cron as Cron 18:30 KST
    participant SyncJob as CorpActionSyncJob (batch)
    participant KsdInfo as KisKsdInfoAdapter (batch)
    participant KIS as KIS OpenAPI
    participant DART as DART OPENDART
    participant DartAdap as DartDisclosureAdapter (batch)
    participant PG as PostgreSQL (corp_action)
    participant Kafka as Kafka
    participant AdjJob as CandleAdjustmentJob (consumer)
    participant Redis as Redis

    Cron->>SyncJob: run() — @Scheduled cron=0 30 9 * * * (UTC = KST 18:30)
    Note over SyncJob: CorpActionSyncJob.kt:54

    SyncJob->>KsdInfo: fetchPaidinCapin(null, today-30d, today)
    KsdInfo->>KIS: GET /uapi/domestic-stock/v1/ksdinfo/paidin-capin?cts=&gb1=0&f_dt=...&t_dt=...
    Note over KIS: TR_ID: HHKDB669100C0<br/>Header: authorization Bearer, appkey, appsecret<br/>응답 output: sht_cd, paidin_capin_dt, new_stck_cnt
    KIS-->>KsdInfo: {rt_cd:"0", output:[...], ctx_area_nk:""}

    SyncJob->>KsdInfo: fetchBonusIssue(null, today-30d, today)
    KsdInfo->>KIS: GET /uapi/domestic-stock/v1/ksdinfo/bonus-issue
    Note over KIS: TR_ID: HHKDB669101C0<br/>응답 output: sht_cd, grts_stck_dt, grts_rt
    KIS-->>KsdInfo: {rt_cd:"0", output:[...]}

    SyncJob->>KsdInfo: fetchDividend(null, today-30d, today)
    KsdInfo->>KIS: GET /uapi/domestic-stock/v1/ksdinfo/dividend
    Note over KIS: TR_ID: HHKDB669102C0<br/>응답 output: sht_cd, stck_dvdn_dt, cas_dvdn_amt, stk_dvdn_rt
    KIS-->>KsdInfo: {rt_cd:"0", output:[...]}

## §5 시나리오 4 — 일봉 마감 + 캘린더 sync (T-MS1)

### 개요

매일 16:00 KST DailyCloseFinalizer가 당일 1d 캔들을 Redis에서 PostgreSQL로 flush한다. MarketCalendarSyncJob은 매일 03:00 KST에 KIS chk-holiday(CTCA0903R)를 호출해 market_calendar 테이블을 갱신한다.

> raw 출처 (CTCA0903R): `https://github.com/koreainvestment/open-trading-api/blob/main/examples_llm/domestic_stock/chk_holiday/chk_holiday.py`
>
> 구현 위치: `batch/src/main/kotlin/kr/spdaewoon/magicjar/batch/infrastructure/kis/KisChkHolidayAdapter.kt:66` — `fetchHolidays()` CTCA0903R
>
> 구현 위치: `batch/src/main/kotlin/kr/spdaewoon/magicjar/batch/job/marketcalendar/MarketCalendarSyncJob.kt:46` — cron 03:00 KST
>
> 구현 위치: `consumer/src/main/kotlin/kr/spdaewoon/magicjar/consumer/` — `DailyCloseFinalizer` @Scheduled 16:00 KST

```mermaid
sequenceDiagram
    participant Cron03 as Cron 03:00 KST (batch)
    participant CalSync as MarketCalendarSyncJob (batch)
    participant KIS as KIS OpenAPI
    participant PG as PostgreSQL (market_calendar)
    participant Redis as Redis
    participant Cron16 as Cron 16:00 KST (consumer)
    participant DailyFin as DailyCloseFinalizer (consumer)

    rect rgb(220, 235, 255)
        Note over Cron03,PG: 캘린더 sync (03:00 KST daily)
        Cron03->>CalSync: syncDaily() — @Scheduled cron="0 0 3 * * *" zone="Asia/Seoul"
        Note over CalSync: MarketCalendarSyncJob.kt:46

        CalSync->>KIS: GET /uapi/domestic-stock/v1/quotations/chk-holiday?BASS_DT=20260101
        Note over KIS: TR_ID: CTCA0903R<br/>Header: authorization Bearer, appkey, appsecret, custtype=P<br/>응답 output: bass_dt, bzdy_yn, tr_day_yn, opnd_yn, sttl_day_yn<br/>연속조회: CTX_AREA_FK/NK (최대 30 페이지 ≈ 1년치)
        KIS-->>CalSync: {output:[{bass_dt:"20260101", bzdy_yn:"N"}, ...], tr_cont:"M"}
        CalSync->>KIS: GET chk-holiday?CTX_AREA_FK=... (다음 페이지)
        KIS-->>CalSync: {output:[...], tr_cont:" "} (마지막 페이지)

        CalSync->>PG: market_calendar UPSERT (date, is_business_day, is_holiday)
        Note over PG: Flyway V6 market_calendar 테이블<br/>source="KIS_CHK_HOLIDAY"
        PG-->>CalSync: affected rows count
        CalSync->>CalSync: log.info("market_calendar upsertAll: total=365 affected=...")
    end

    rect rgb(255, 240, 220)
        Note over Cron16,PG: 일봉 마감 flush (16:00 KST daily)
        Cron16->>DailyFin: @Scheduled("0 0 7 * * *" UTC = 16:00 KST)
        DailyFin->>DailyFin: MarketSessionResolver.isBusinessDay(today)
        Note over DailyFin: KrxMarketSessionResolver → market_calendar DB 조회

        alt 영업일
            DailyFin->>Redis: SCAN candle:today:*:1d (전체 관심종목)
            Redis-->>DailyFin: {open, high, low, close, volume} per code
            DailyFin->>PG: candle INSERT (1d 캔들 영속)
            Note over PG: interval=1d, ts=당일 16:00 KST
            DailyFin->>Redis: DEL candle:today:*:1d (정리)
            DailyFin->>DailyFin: log.info("DailyCloseFinalizer 완료 — N종목 flush")
        else 비영업일 (휴장일·주말)
            DailyFin->>DailyFin: skip + log.info("비영업일 skip")
        end
    end
```

**KIS chk-holiday 파라미터** (raw 1:1 정합, `KisChkHolidayAdapter.kt:50`):
- `BASS_DT`: 조회 기준일 `YYYYMMDD`
- `CTX_AREA_FK` / `CTX_AREA_NK`: 연속조회 컨텍스트
- 응답 `bzdy_yn`: 영업일여부 Y/N

**호출 정책** (ADR 0013 §3-7):
- 1일 1회 권장 (KIS 명시: "당사 원장서비스와 연관")
- 부팅 1회(MarketCalendarSeedRunner) + cron 03:00 1회 = 최대 2회/일

## §6 시나리오 5 — Instrument Master sync (T-IM1)

### 개요

InstrumentMasterSyncScheduler가 ADR 0039 §2-1에 정의된 13 cron 시각마다 KIS 종목마스터 zip 파일을 다운로드해 파싱한다. KOSPI 70 widths(227byte) + KOSDAQ 64 widths(221byte) 고정폭 EUC-KR 파일을 파싱 후 instrument 테이블 upsert, Redis 자동완성 인덱스를 갱신한다.

> raw 출처 (KOSPI widths): `https://github.com/koreainvestment/open-trading-api/blob/main/stocks_info/kis_kospi_code_mst.py` L54~L68 — `widths` 70필드
>
> raw 출처 (KOSDAQ widths): `https://github.com/koreainvestment/open-trading-api/blob/main/stocks_info/kis_kosdaq_code_mst.py` L54~L67 — `widths` 64필드
>
> raw 출처 (KOSPI 헤더): `https://github.com/koreainvestment/open-trading-api/blob/main/stocks_info/종목마스터정보(코스피).h` L9~L98
>
> raw 출처 (KOSDAQ 헤더): `https://github.com/koreainvestment/open-trading-api/blob/main/stocks_info/종목마스터정보(코스닥).h` L9~L88
>
> 다운로드 URL (kis_kospi_code_mst.py L17 직접 인용): `https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip`
>
> 다운로드 URL (kis_kosdaq_code_mst.py L17 직접 인용): `https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip`
>
> 구현 위치: `batch/src/main/kotlin/kr/spdaewoon/magicjar/batch/infrastructure/kis/KisInstrumentMasterAdapter.kt:391` — `parseLineRaw()` 고정폭 파싱
>
> 구현 위치: `batch/src/main/kotlin/kr/spdaewoon/magicjar/batch/job/instrument/InstrumentSyncJob.kt:66` — `run()` diff + upsert
>
> 구현 위치: `batch/src/main/kotlin/kr/spdaewoon/magicjar/batch/scheduler/InstrumentMasterSyncScheduler.kt:49` — 13 cron 시각

```mermaid
sequenceDiagram
    participant Cron13 as 13 cron 시각 (ADR 0039 §2-1)
    participant Scheduler as InstrumentMasterSyncScheduler (batch)
    participant SyncJob as InstrumentSyncJob (batch)
    participant KisAdap as KisInstrumentMasterAdapter (batch)
    participant DWS as KIS DWS 파일 서버
    participant PG as PostgreSQL (instrument)
    participant Redis as Redis
    participant Kafka as Kafka

    Cron13->>Scheduler: syncAt0605() / syncAt0700() / ... (MON-FRI)
    Note over Scheduler: InstrumentMasterSyncScheduler.kt:49<br/>cron 06:05·07:00·07:40·08:00·08:50·09:51·11:00<br/>17:15·17:35·18:00·18:15·18:35·19:00 (KST)
    Scheduler->>Scheduler: isBusinessDay(today) — 영업일 게이트

    alt 영업일
        Scheduler->>SyncJob: run("06:05")
        SyncJob->>Redis: SETNX instrument:sync:running TTL 600s (동시 실행 락)
        SyncJob->>KisAdap: fetchAllRaw()

        KisAdap->>DWS: GET https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip
        DWS-->>KisAdap: zip bytes (timeout 30s, backoff 3회)
        KisAdap->>KisAdap: ZipInputStream → BufferedReader EUC-KR
        Note over KisAdap: parseLineRaw() — byte 단위 고정폭 파싱<br/>Part1: code(9) + ISIN(12) + 한글명(가변)<br/>Part2: KOSPI_PART2_WIDTHS[70] sum=227byte
        KisAdap->>KisAdap: sanitizeRoe() — sentinel "-36100000" → null (WARN)
        Note over KisAdap: KisInstrumentMasterAdapter.kt:722<br/>securities_group="ST" 필터 (보통주+우선주만)
        KisAdap->>KisAdap: mapType(scrt_grp_cls_code) — scrt_grp_cls_code 권위 매핑
        Note over KisAdap: ST→STOCK/PREFERRED, EF/FE→ETF, RT→REIT, EW/SW→WARRANT...

        KisAdap->>DWS: GET kosdaq_code.mst.zip
        DWS-->>KisAdap: zip bytes
        Note over KisAdap: KOSDAQ_PART2_WIDTHS[64] sum=221byte<br/>KOSPI와 차이: vntr_issu(+) invt_alrm(+) ksq150_nmix(+)

        KisAdap-->>SyncJob: List<KisInstrumentRaw> (KOSPI + KOSDAQ ~3577건)
        SyncJob->>PG: findAllByActiveTrue() — 기존 DB 목록
        SyncJob->>SyncJob: diff (newCodes·delistedCodes·existingCodes)
        SyncJob->>PG: upsertFull() — INSERT NEW (70+ 필드 전체)
        SyncJob->>PG: upsertFull() — UPDATE CHANGED (name·market·tradingHalt·managementStock 변동 시)
        SyncJob->>PG: markDelisted() — active=false + delisted_at (DELETE 금지 ADR 0017 §2-2)
        SyncJob->>PG: instrument_alias UPSERT (code, alias=name, source="KRX")
        SyncJob->>Kafka: instrument.updated.v1 {syncedAt, changes:[{code,action,market,name}]}
        SyncJob->>Redis: DEL instrument:list:* + instrument:search:* + instrument:by-code:{code}
        SyncJob->>Redis: SET instrument:sync:lastAt
        SyncJob->>Redis: DEL instrument:sync:running (락 해제)
    else 비영업일
        Scheduler->>Scheduler: skip + log.info("휴장일 skip")
    end
```

**파싱 전략** (`KisInstrumentMasterAdapter.kt:382`):
1. line → EUC-KR byte 배열 (한글 2byte/char 정합)
2. Part1: byte[0~8]=단축코드, byte[9~20]=ISIN, byte[21~(size-part2Len-1)]=한글명 가변
3. Part2: KOSPI/KOSDAQ widths 배열로 substring
4. ROE sentinel(-36100000) → null (NUMERIC overflow 방지)
5. scrt_grp_cls_code 권위 타입 매핑 (detectType 자체 추론 폐기)
