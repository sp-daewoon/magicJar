<script id="md-source" type="text/markdown"># 05 — UI Inventory (frontend SPA · 화면·메뉴·버튼·상태 매트릭스)

> **시점**: v3.12.0 baseline (2026-06-08 cut)
> **권위 소스**: `frontend/src/App.tsx` (route 정의) · `frontend/src/components/layout/AppHeader.tsx` (메뉴) · `frontend/src/pages/Strategy/**` · `frontend/src/features/market/**` · `frontend/src/features/ai/**` · `frontend/src/features/settings/**` · `frontend/src/components/**` · `frontend/src/api/**` · `frontend/src/hooks/useModalBehavior.ts`
> **작성자**: frontend (전략 리서치 AI 종목발굴 · 전략 빌더 AI 전략 생성 · 잔익절 경고·minHoldBars · useModalBehavior 공통 모달 · 종목상세 AI 차트해석 Claude CLI 실해석)
> **이전 판**: `_workspace/baseline/v3.9.0/05-ui-inventory.md`

본 문서는 **v3.12.0 시점에 화면이 무엇을 보여주고, 어떤 메뉴·버튼·상태를 가지며, 어떤 데이터 토픽을 구독하는지**를 SPA 구조 그대로 인벤토리화한다. 화면 추측·미구현 화면 묘사 금지 — `App.tsx` route 정의 + `AppHeader.tsx` nav를 raw 출처로 한다. 본 판은 **v3.9.0 인벤토리를 베이스로 증분**(신규 화면·신규 컴포넌트·신규 동작 패턴만 상세 기술, 무변경 영역은 5-9 안정 영역으로 압축)한다.

### 5-2-B. Strategy Research 영역 ⭐ v3.12.0 신설 (AI 종목발굴 · ADR 0112)

| route | 페이지 컴포넌트 | 주요 child 컴포넌트 | 주요 hook | REST endpoint | 사용자 액션 |
|-------|-----------------|---------------------|-----------|---------------|------------|
| **`/strategy/research`** ⭐ | **`pages/Strategy/StrategyResearchPage.tsx`** (2066 LOC) | `AiDiscoveryCard` (후보 1건/카드) · `ResearchCandidateLibraryCard` (후보 라이브러리 팝업) · `StrategyResearchChart` (LWC v4 가상 진입/청산) · `InstrumentSearchInput` | `useQuery`/`useMutation` (strategyResearchApi) · `useCandleRecollectJob` (캔들 재수집) · `useModalBehavior` × 3 (프롬프트 미리보기·프리셋 설정·AI 추천) · `useOnboardingStore` | `POST /strategy-research/proposals` · `POST /strategy-research/ai-discovery` · `GET /strategy-research/ai-discovery/latest` · `PATCH /strategy-research/ai-discovery/item-status` · `DELETE /strategy-research/ai-discovery/latest` · `GET·POST·PUT·DELETE /strategy-research/ai-discovery/presets[/{id}]` · `GET·PUT·POST /strategy-research/ai-discovery/core-prompt[/reset]` · `POST /strategy-research/ai-discovery/presets/recommend` · `POST /strategy-research/ai-discovery/prompt-preview` · `GET·POST·DELETE /strategy-research/candidates[/...]` | 리서치 폼(interval·기간·익절·손절·maxHoldBars) → 후보 평가 · AI 발굴 실행 · 후보 캔들 가져오기 · 후보 → 빌더 draft 로드 |

#### 5-2-B-1. AI 종목발굴 패널 UI 구성 (권위: `StrategyResearchPage.tsx` L1060~L1340)

- **헤더** — "Claude CLI 후보 · 종목 마스터 매핑" (`L1062`), 우측 [프리셋 설정] · [AI 프리셋 추천] 버튼 2 (`L1084·L1091`)
- **프리셋 선택 행** — **최근 사용 상위 3개를 버튼으로 노출**(`DISCOVERY_PRESET_BUTTON_COUNT = 3`, `DISCOVERY_PRESET_RECENT_KEY = 'magicjar.discovery.presetRecentIds'` localStorage 최신순 최대 5), **나머지는 "다른 프리셋…" 콤보**(`L1162`), **[직접 입력] 토글은 행 최우측 끝으로 배치**(`L1173~L1185`). 선택된 프리셋이 콤보 쪽에 있어도 항상 버튼에 포함(시각 식별 보장 — `L600~L610`).
  - **버튼 3개 표시 정렬**: 선정은 최근 사용 순이되 **표시는 라벨 `localeCompare(ko)` 고정 정렬** — 클릭마다 버튼 재배열 방지(같은 3개 구성이면 위치 불변, 새 프리셋 진입 시만 재배열). 권위: CHANGELOG 2026-06-08 "AI 발굴 프리셋 버튼 3개 표시 글자순 고정".
- **프롬프트 입력** — 직접 입력 모드(presetId 없음)에서는 프롬프트 필수(`L729·L776`), 프리셋 선택 시 추가 요청은 선택(`L1207` placeholder "프리셋에 더할 추가 요청 — 비워두면 프리셋 지시문만 사용").
- **마켓 콤보** — `AI_DISCOVERY_MARKETS = ['', 'KOSPI', 'KOSDAQ', 'KONEX']`(`'' = 전체`).
- **로딩 표시** — "Claude CLI가 후보를 찾는 중입니다" (`L1260`).
- **후보 카드 그리드** — `AiDiscoveryCard` (267 LOC). 후보별 status 토글(신규/유지/제외 = NEW/KEPT/DISMISSED), 매칭 + 캔들 0건 후보엔 **[캔들 가져오기]** 개별 버튼(`useCandleRecollectJob` 발굴 interval 재수집), 후보 자체 STOMP 구독(다중 카드 독립).
- **전체 가져오기** — **[부족 후보 전체 가져오기]** 버튼(`L1296`, 순차 큐 — page가 `activeFetchCode` 하나만 지정 → 카드 자동 시작 → terminal 시 다음 후보 진행). 진행 상태 "캔들 수집 중"·"전체 성공"(`L1318`).

#### 5-2-B-2. Core Wrapper 편집 (권위: `StrategyResearchPage.tsx` L308~L312·L865~L877·L483~L516)

- 프리셋 설정 팝업 내 **Core Wrapper 프롬프트 편집** — `corePromptDraft` textarea + [저장] (`updateAiDiscoveryCorePrompt` → `PUT /strategy-research/ai-discovery/core-prompt`) + [기본값 복원] (`resetAiDiscoveryCorePrompt` → `POST .../core-prompt/reset`, `window.confirm` 가드).
- 빈 값 클라이언트 검증("Core Wrapper 프롬프트를 입력해주세요" `L867`).

#### 5-2-B-3. AI 프리셋 추천 모달 (권위: `StrategyResearchPage.tsx` L376~L383·L1931~)

- [AI 프리셋 추천] → `recommendOpen` 모달(`useModalBehavior` 적용) → `POST /strategy-research/ai-discovery/presets/recommend` (hint·count). 추천 카드별 [프리셋으로 추가] (`createAiDiscoveryPreset`), 추가됨 인덱스는 비활성 처리(`L283`). **닫아도 mutation은 백그라운드 지속**(`L324` 주석).

#### 5-2-B-4. 후보 라이브러리 팝업 (권위: `ResearchCandidateLibraryCard.tsx` 361 LOC)

- **인라인은 컴팩트 진입 버튼 + 요약 한 줄만** ("후보 전략 라이브러리 · 내 전략 N개 · 기본 M개" + [후보 라이브러리 관리]) — 18종 builtin + 내 후보를 전부 인라인 노출하면 화면 전체를 가리던 dogfooding 결함(2026-06-08) 정정.
- **전체 목록·관리(추가/삭제)는 모달로 이동** — `useModalBehavior` 의무 + overlay 클릭 닫기 + max-height 88vh + 내부 스크롤.
- **정렬**: 내 전략(`builtIn=false`) 최상단(최신 `updatedAt` 순) → builtin(`sortOrder` 오름차순) + 섹션 헤더("내 후보"·"기본 제공") + 카운트 뱃지.
- "내 전략을 후보로 추가" — 전략 선택 드롭다운 + [추가] (`addCandidateFromStrategy` → `POST /strategy-research/candidates/from-strategy`), 후보 삭제(builtin 포함, `deleteCandidate`). 리서치 실행 동작 자체는 무변경.

#### 5-2-B-5. 리서치 폼 / 가드 (권위: `StrategyResearchPage.tsx` L40~L93·L890~L990)

- 폼 설정 — `interval`(`INTERVALS = ['1m','3m','5m','15m','30m','1h','1d']`) · `fromKst`·`toKst`(KST datetime-local) · `targetProfitPct`·`stopLossPct`·`maxHoldBars`. `RESEARCH_FORM_STORAGE_KEY = 'magicjar.strategyResearch.form.v1'` localStorage 보존. default: interval `1d` · 7일 · 익절3%·손절3%·maxHoldBars 12.
- 가드: candle 부족(`MIN_RESEARCH_CANDLES = 40`) 시 "캔들 가져오기 후 다시 선택"(`L897`), 예상 candle 수 cap(`MAX_RESEARCH_CANDLES_PER_RUN = 20_000`, `L984`).
