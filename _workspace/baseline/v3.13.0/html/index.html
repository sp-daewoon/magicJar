## 한 장 요약

magicJar v3.13.0은 **첫 실전(REAL canary) 주문을 라이브로 완주한 마일스톤 baseline**이다. v3.12.0(실매매 직전 자본 path 완성)에서 코드로 보장했던 자본 안전선을 **2026-06-11 실계좌에서 처음 가동**(첫 REAL 매수 체결까지 1.7초)하고, 2일차(2026-06-12)까지 dwell하며 라이브에서만 드러나는 결함 11건(F1~F11)을 발굴·해소한 사이클이다. 코드의 무게중심이 "설계 → 코드"에서 "코드 → 실전 검증"으로 처음 넘어갔다.

이 사이클의 본질은 **실전 첫 가동이 노출한 자본 보호 역전(역방향 위험)의 정밀 교정**이다. v3.12.0 자본 path는 정상 흐름에선 옳았으나, 실계좌에선 ① 매수용 cap이 매도(청산)까지 막아 손실을 키우는 방향 무구분 결함, ② 체결→원장→리스크 키 사슬이 mode/source 차원·0-sentinel로 끊겨 "매도했는데 포지션 남음·매수했는데 안 보임" 귀속 모호, ③ KIS WS 슬롯이 두 독립 라우터에서 부분 관리돼 총 점유 초과 인지 0, ④ 잔고 0원 fabricate가 BUY를 헛 차단하는 한계가 드러났다. v3.13.0은 이를 **롱 온리 정책 명문화 + 체결-원장-리스크 무결성 + WS 슬롯 단일 회계 + 관리자 실시간 가시화**로 add-only 교정했다.

**v3.13.0 시점 동작하는 핵심 흐름** (v3.12.0 baseline + canary 실전 가동 + F1~F11 교정):

1. **REAL canary 자본 path 실전 완주 + 정밀화** — v3.12.0 chain(boundary → 시그널 → RiskGateway verdict → EntryPricePolicy marketable limit → canary hard cap → OrderRouter → KIS REST → ACK → H0STCNI0/H0STCNI9 체결 → STOMP toast)이 **실계좌에서 처음 완주**(첫 매수 체결 1.7초). 3중 게이트(env × env × `user_account.real_trading_consent_at`) + canary hard cap 자본 보호 LOCK 유지. consumer `RealTradingConsentPort` 배선 결함(F2) 해소로 동의 게이트 정상 가동.

2. **롱 온리(Long-Only) 매매 원칙 명문화 (정책 `long-only-trading.md` 신설 + 헌법 §13 + ADR 0109 §7 amend)** — 최고 관리자 직접 결재("우리 시스템에는 숏이 없어. 매도는 신호 나오면 팔면 끝"). **magicJar는 롱 온리** — 공매도·대주·파생 숏 부재. 매도(SELL)는 항상 보유분 청산이므로 **방향별 비대칭 원칙**(BUY=가격 보호 우선 / SELL=체결 보장 우선)을 정책화: canary cap은 BUY에만 적용(QTY·NOTIONAL cap SELL 면제·`MAX_ORDERS_PER_DAY` 매수만·왕복 1=1카운트 — PR #927·#928), 매도 가격 미가용 시 MARKET fallback(진입 MARKET fallback 금지 ADR 0114 §3-1-5와 방향 구분), `SELL_WITHOUT_POSITION` 차단은 정상 가드(Slack mute — PR #926).

3. **체결-원장-리스크 키 사슬 무결성 (ADR 0115 §2-P2 정식 신설 — 대안 B-on-A)** — 2026-06-10 005930·전략8 incident(G1~G7)와 canary 라이브 D1·D2 결함이 노출한 사슬 단절을 무결성 불변식으로 차단. **R1**(체결-원장 정합 배선 — backfill CANCELLED 대조 G5·rebuild G4·단일전략 evidence 자동보정 G7·index refresh G3·drain 가드 G1) + **R2**(`OrderTrigger` enum 신설 + Flyway V80 — 0-sentinel 폐지로 발사 출처 키 차원 복원). `strategy_position`을 `order_execution`(immutable 진실원) 파생 재계산 뷰로 점진 전환(누락 영구화 불가). 헌법 §11(모듈 경계 빈 합류 + silent fallback 금지) 동반 신설.

4. **KIS WS 구독 슬롯 단일 회계 (ADR 0123 신설 + ADR 0048 amend — 41→40 KIS-first 정정)** — 2026-06-11 후성(093370) 분봉 35/92 결손 incident(OPSP0008 MAX SUBSCRIBE OVER) root cause = 체결가·호가 두 독립 라우터 부분 한도 각각 관리 + NXT 이중 발사 미회계. 현재 baseline은 **R1 단일 회계기 `WsSlotBudgetLedger`**(채널=(code,trId) 단위 추적·거부 감지·회계 보정·fallback wiring·slot metrics)까지 반영한다. **R2 owner eviction**과 **R3 채널 다이어트/H0UNCNT0**는 운영 테스트에서 슬롯 포화·거부가 반복될 때 재개하는 backlog로 둔다.

5. **DETAIL 호가 "표시 중에만" 정책 재결정 (CLAUDE.md anchor `detail-orderbook-live-only` + PR #943·#944)** — 호가(H0STASP0)를 ① 전략 ACTIVE 매매 경로(STRATEGY owner) ② 종목 상세 화면 표시 중(DETAIL owner — 진입 시 구독·이탈 즉시 해제) 두 경로에서만 구독. 합집합/LRU 잔류로 슬롯 누적 잠식하지 않고 현재 보는 종목만 점유 + 15분 idle 안전망. 수동매매(지정가 진입) 시 호가 없이 주문하는 risk 차단이 복원의 핵심 목적.

6. **관리자 실시간 상태 가시화 + 운영 보고 체계** — `/admin/realtime` 화면(KIS WS 연결·슬롯·구독·캔들 신선도 5초 auto-refresh) + `GET /api/admin/realtime-status`(consumer Redis 스냅샷 발행·api 가공) + `/magicjar-ops-monitor` 커맨드 + 일일 운영 보고 체계. 최고 관리자 결재("내가 그 상태를 확인 못 하니깐 장애 처리가 어렵다").

7. **발굴 → MOCK 페이퍼 트레이딩 dispatch (ADR 0122 Accepted) + 지정가 진입 ON** — 백테스트→모의→실전 3단 중 빠진 모의 고리를 채움(`Strategy.origin=PAPER_DISCOVERY` + 가상 자본 격리 + `TradingModeGate` paper origin 인지 GAP-0 hotfix). 자동 진입 절대 금지(opt-in 명시 액션만). 지정가 진입 ON.

**v3.13.0 누적 ADR 123건** (v3.12.0 baseline 114건 + 0115·0116·0117·0118·0119·0120·0121·0122·0123 — 자세한 인덱스는 `_workspace/arch/adr/README.md`).

**v3.13.0 시점 자동매매 본체 정합 핵심 충족**:

1. **REAL canary 실전 첫 완주 + 자본 보호 역전 교정** — v3.12.0 자본 path를 실계좌에서 처음 가동(첫 매수 1.7초). 라이브가 노출한 cap 방향 무구분·키 사슬 단절·잔고 0 fabricate·청산 마비를 F1~F11 + ADR 0109 §7 amend로 교정. 자본 path 변경은 전부 add-only/하위호환·롱 온리 비대칭 원칙(BUY 보호/SELL 보장).
2. **AI 호출 0 LOCK(자본 path) 보존** — 자동매매 본체 AI 호출 0. AI는 종목발굴·차트해석·전략 빌더 옵션 보조(Claude CLI bridge·ADR 0112)로 후보 출발점만 제공·매매 결정권 0.
3. **모듈 매트릭스 보존** — domain · pattern-engine · indicator-impl · persistence-shared · strategy-engine · market-trend-engine · api · batch · consumer. 신규 모듈 0(OrderTrigger·WsSlotBudgetLedger·페이퍼는 기존 모듈 add-only).
4. **운영 헌법 진화** — §11(모듈 경계 빈 합류 + silent fallback 금지·ADR 0115) + §12(주문 액션 승인 매트릭스) + §13(롱 온리 ref) 신설. §9·§10 운영 단계 룰 LOCK 유지.
5. **회귀 0** — F1~F11·ADR 0115~0123 변경 모두 add-only/하위호환(OrderTrigger null=legacy·origin null=USER_DSL·entry_policy null=현행·페이퍼 미배선=현행 회귀). 자본 path 변경은 fail-closed/fail-open·롱 온리 방향 원칙 유지.
6. **첫 실전 검증 evidence 의무 충족** — PR 머지·gradle check GREEN만으로 종결하지 않고, 라이브 incident 시각·signalId·order_request 행·KIS 응답 코드(OPSP0008·EGW00201·CONSENT_PORT_UNAVAILABLE)를 인용해 결함을 추적·교정(사용자 메모리 `feedback_verification_strict` 정합).

(async function() {

  html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, function(_, code) {

      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'");
    return '<pre class="mermaid">' + decoded + '</pre>';
  });

  document.getElementById('content').innerHTML = html;

  // mermaid 렌더링
  try {
    await mermaid.run({ querySelector: '.mermaid' });

    console.error('mermaid render error:', e);
