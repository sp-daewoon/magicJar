<script id="md-source" type="text/markdown"># 01 — magicJar v3.14.0 아키텍처 (시각화)

> **작성자**: architect (baseline v3.14.0)
> **시점**: 2026-06-21 v3.14.0 release commit 준비 (main `cbd5db8e`)
> **권위**: `docs/architecture/master-architecture.md` v2 §3-5·§5·§6·§10·§13 + ADR 0002·0004·0005·0023·0030·0043·0048·0067·0068·0080·0094·0109·0110·0111·0112·0114·0115·0116·0118·0119·0120·0121·0122·0123 + **0124·0125·0126·0127·0128(+§6 amend)** + 정책 `long-only-trading.md` + 헌법 §11·§12·§13 + v3.14.0 시점 코드 inspection

본 문서는 v3.14.0 시점 magicJar 시스템의 **시각화 가능 수준 그림**이다. SoT는 `docs/architecture/master-architecture.md`이며, 본 문서는 그 하위 구체화 — v3.14.0 시점 실체(발행된 컨테이너·테이블·KIS endpoint·Kafka topic·STOMP 토픽·9 JVM 모듈·7 sub-agent hierarchy·운영 헌법 §1~§13·**REAL canary 8일차 dwell + 분할매수 자본 재설계 + floor 운영화 + 전략 UX 고도화 — ADR 0124~0128**)만 인용한다. v1/v2 잔재 0건.

**v3.13.0 → v3.14.0 핵심 변경 (분할매수 자본 재설계 + 운영 고도화 마일스톤)**:

- **분할매수(scale-in) 자본 로직 재설계 (ADR 0128 R1~R3 + §6 amend)** — base = 1차 진입 시점 가용액 **박제**(회차마다 재계산 폐기) + 부분 매수 잔여 추적 + totalSlices 초과 진입 0 + weight 0% 회차 skip. floor(평단 -손절% catastrophic 알람선)는 **자동 청산 → 알람 강등**(`FloorBreachAlert`·SELL 미발행)이 default. `StrategyPosition.scaleInBaseBudget`·`scaleInRemainderQty`(V90) + `ScaleInPlanProjector`(분할계획 투영기). 라이브 1·2·3회차 drift 0 검증(후성 093370).
- **floor 운영 default 외부화 + 자동청산 토글 (ADR 0128 §6 amend — 2026-06-21)** — 도메인 상수 `DEFAULT_STOP_LOSS_FLOOR_PCT=15`의 운영 default 지위 박탈 → `application.yml` property(`magicjar.strategy.scale-in.floor-default-pct`)로 외부화(재컴파일 없이 튜닝 + 가시성). 전략별 `ScaleInPlan.floorAutoLiquidate: Boolean`(default false=알람만) 신설 — true=floor 도달 시 자동 전량 청산(`StopLoss` 슬롯). 전략 단위 opt-in(계정 전체 영향 0).
- **전략 빌더 고도화 + 전략 목록 UX (frontend PR #1069~#1073)** — 빌더: 분할계획 프리뷰·검증 인라인·RiskPlan 접기 UX·모바일 대응 + floor 필드 항상 노출(yml default prefill)·자동청산 토글. 목록: 검색·정렬(`q`·`sort` 파라미터·api)·카드 밀도·빠른 액션·상태 요약. 복제(`?duplicate=1`) 시 strategyId 비워 신규 저장 분기 fix.
- **KIS WS 구독 수요 재편 (ADR 0124 — v3.13.x patch 적재, baseline 통합)** — **H0UNCNT0 단일 체결가 채널**(KRX+NXT 통합·종목당 1채널·`NEW_MKOP_CLS_CODE` 세션 구분 — 기존 H0STCNT0+H0NXCNT0 이중 발사 폐기) + watchlist KIS WS 구독 폐지(5초 REST polling 강등) + owner 우선순위 재정렬(HOLDING 0 > PENDING_BUY 5 > STRATEGY 10 > DETAIL 20). 호가 **H0UNASP0 통합 호가** 전환.
- **실시간 토픽 명명규칙 + 전략 성과 원장 + TP tick failsafe (ADR 0125·0126·0127 — v3.13.x patch)** — Kafka/STOMP/KIS alias 명명 + wire clean-cut(0125), 전략×일자 성과 누적 원장 + 시장 레짐/α + 메모(0126·V85~V87), 익절 tick 안전망(`PositionTakeProfitTickWatcher`·SL/TP 비대칭 해소·0127).
- **전략 시작화면 + 프리셋/즐겨찾기 DB화 (V88·V89)** — `strategy.owner` + `strategy_favorite` + SYSTEM 전략 템플릿 시드 10건(스마트머니 6 + 미너비니 4).
- **Flyway 누적**: V82 → V90 (+8 — V83 VI action policy·V84 realtime fallback buy·V85~V87 전략 성과 원장·V88 owner/favorite·V89 템플릿 시드·V90 scale-in base/remainder).

본 그림 명시 사실:

- **9 JVM 모듈 보존** — domain · pattern-engine · indicator-impl · persistence-shared · strategy-engine · market-trend-engine · api · batch · consumer (신규 모듈 0)
- **분할매수 자본 path 재설계** — RealtimeSignalGenerator → RiskGatewayEvaluator(박제 base × 회차 비중 + 잔여 clamp + sliceAt null 진입 0) → OrderRouter(base 박제/잔여 갱신/전량청산 reset wiring) → KIS REST 체결 → AutoExit(분할 미완 손절 보류·분할 완료 손절·floor 알람 default/청산 toggle)
- **KIS WS 통합 채널** — H0UNCNT0 단일 체결가(KRX+NXT·종목당 1채널) + H0UNASP0 통합 호가 + owner priority 재정렬(HOLDING>PENDING_BUY>STRATEGY>DETAIL) + watchlist polling 강등
- **전략 UX 고도화** — 빌더(분할계획 프리뷰·검증 인라인·RiskPlan 접기·모바일·floor 필드·자동청산 토글) + 목록(검색·정렬·카드 배지·빠른 액션·상태 요약)
- **AI 호출 0 LOCK(자본 path)** — 자동매매 본체 AI 호출 0. AI는 옵션 보조(Claude CLI bridge) 매매 결정권 0

**분할매수 재설계 핵심 (ADR 0128 — 2026-06-19 canary 후성 093370 라이브 9개 설계 결재)**:

- **base 1차 고정(①)** — `resolveBuyQuantity`가 회차마다 `buyable = min(남은한도, 예수금)`을 재계산하면 1차 매수가 전체노출을 늘려 2·3차 예산이 의도보다 쪼그라든다. `StrategyPosition.scaleInBaseBudget`(V90)에 1차 시점 buyable을 박제 → `회차예산 = floor(박제 base × weight%/100)`. base 외부주입 추상화로 미래 "지정 가격 + 목표 금액" 매집 트랙과 회차 산식 변경 0 호환.
- **잔여 추적(②)** — 회차 예산이 살 수 있는 수량보다 자금 부족 시 "살 수 있는 만큼만" 사고 못 산 잔여(`scaleInRemainderQty` V90)를 다음 회차 수량에 더함(buyable clamp).
- **floor 알람강등(⑦) + 자동청산 토글(amend ②)** — #1058이 분할 미완 catastrophic floor에서 자동 청산하던 것을 **`FloorBreachAlert`(알람만·SELL 미발행)**로 강등(스윙 변동성 반등 보호). amend로 `floorAutoLiquidate`(default false) 토글 신설 — 기계적 손실 bound를 원하는 전략만 ON(자동 전량 청산). 전략 단위 opt-in(계정 전체 영향 0).
- **totalSlices 초과 진입 0(⑧) + weight 0 skip(⑨)** — `weights.getOrElse(filledLots){weights.last()}`가 `filledLots >= totalSlices`에도 마지막 가중으로 계속 매수하던 결함(전략47 4회차 sliceIndex=3 초과 실증)을 `sliceAt(filledLots)` null → 진입 0으로 차단. `[50,50,0]`=`[50,50]`(effectiveSliceCount=양수 비중 회차 수).
- **floor 운영 default 외부화(amend ①)** — 도메인 상수 `DEFAULT_STOP_LOSS_FLOOR_PCT=15`의 운영 default 지위 박탈 → `application.yml` `magicjar.strategy.scale-in.floor-default-pct`(default 15)로 외부화. api 저장 경로에서 floor null → yml default 주입 후 영속(저장 전략은 항상 명시 floor 보유). 도메인 상수는 last-resort 안전망으로만 잔존.
- **R 경계** — R1(strategy-engine 도메인 필드·순수 함수·consumer 사이징 #1060) · R2(backend-core base 박제 wiring·scale-in-plan API #1061) · R3(frontend 예상 매수 계획 패널 #1062) · amend R1~R3(floor 자동청산 #1066·yml wiring #1068·UI 토글 #1067).

## §3. 체결-원장-리스크 키 사슬 무결성 (ADR 0115 §2-P2 — 대안 B-on-A, v3.13.0 baseline 계승)

```mermaid
graph LR
    INTENT["OrderIntent (orderTrigger·triggerRefId)"]
    TRIGGER["OrderTrigger enum (V80)<br/>STRATEGY_SIGNAL·AUTO_EXIT·STOP_LOSS·PARTIAL_TAKE_PROFIT·MANUAL·EXTERNAL"]
    ROUTER["OrderRouterKafkaListener<br/>resolveOrderTrigger/resolveTriggerRefId<br/>+ scale-in base 박제/잔여 갱신/전량청산 reset (ADR 0128 R2)"]
    OE["order_execution (immutable append-only 진실원)"]
    REBUILD["StrategyPositionRebuild.rebuild() (strategy-engine 순수)<br/>+ stale 양수 잔고 깎기 방지 (#1057)"]
    SP["strategy_position (2차 ledger·전략 귀속)<br/>+ scaleInBaseBudget/scaleInRemainderQty (V90)"]
    POS["position (1차 권위·KIS 잔고 투영·UNIQUE user+code+source)"]

    INTENT --> TRIGGER
    TRIGGER --> ROUTER
    ROUTER --> OE
    OE --> REBUILD
    REBUILD -->|교차검산 일치+clamp 0일 때만 upsert| SP
    POS -->|drift 시 KIS 권위 우선| SP
```

**무결성 불변식 (ADR 0115 §2-P2 계승 + ADR 0128 정합)**:

- **파생 상태 재계산 가능성** — 보유 수량 등 파생 ledger는 immutable 진실원(`order_execution`)에서 결정론적 재계산 가능해야 한다. `StrategyPositionRebuild`가 `Σ전략 귀속 == KIS authority(position)` 검산 → 누락 발생해도 다음 reconcile가 흡수.
- **분할 N회차 정합(#1057)** — drift reconcile이 분할 N회차 체결 직후 **stale 양수 잔고를 깎지 않도록** 가드 — 분할 라이브가 drift 0으로 완주한 토대(ADR 0128 라이브 검증 전제).
- **scale-in 상태 영속(ADR 0128 R2)** — OrderRouter 체결 listener가 1차 체결 시 base 박제·부분 체결 시 잔여 갱신·전량 청산(quantity=0) 시 base·remainder reset. R2 전 `scaleInBaseBudget`=null → 라이브 buyable fallback(zero-regression).

**3중 상태 권위·시차 매트릭스 (master §3-5-1 계승)**:

| 상태 | 위치 | 역할 | 동기화 |
|---|---|---|---|
| `position` | DB (user+code+source) | **1차 권위** (KIS 잔고 투영) | 5분 worker 자기치유 |
| `strategy_position` | DB (user+strategy+code) | **2차 ledger** (전략 귀속·scale-in base/remainder) | 체결 즉시~5분 + replay + drift rebuild |
| `HoldingPositionIndex` | in-memory | **derived cache** | onFillRefresh 동반 |

## §4. KIS WS 구독 수요 재편 — H0UNCNT0 단일 채널 + owner 우선순위 재정렬 (ADR 0124)

```mermaid
graph TD
    OWNER["체결가 owner 4종 (priority)"]
    HOLD["HOLDING(0) — 보유 (evict 절대금지 ADR 0114 LOCK)"]
    PEND["PENDING_BUY(5) — 미체결 매수 (evict 절대금지)"]
    STRAT["STRATEGY(10) — 자동매매 평가·진입"]
    DETAIL["DETAIL(20) — 종목 상세 화면"]
    UNCNT["H0UNCNT0 통합 체결가<br/>KRX+NXT 통합·종목당 1채널·NEW_MKOP_CLS_CODE 세션 구분<br/>(기존 H0STCNT0+H0NXCNT0 이중 발사 폐기)"]
    UNASP["H0UNASP0 통합 호가<br/>STRATEGY(marketable limit) + DETAIL(표시 중에만)"]
    WATCH["watchlist — KIS WS 구독 폐지<br/>5초 REST polling 전용 강등 (ADR 0124)"]
    LEDGER["WsSlotBudgetLedger 40 슬롯 단일 회계<br/>slot 경합 시 DETAIL evict · STRATEGY 보호"]

    OWNER --> HOLD
    OWNER --> PEND
    OWNER --> STRAT
    OWNER --> DETAIL
    HOLD --> UNCNT
    PEND --> UNCNT
    STRAT --> UNCNT
    DETAIL --> UNCNT
    STRAT --> UNASP
    DETAIL --> UNASP
    WATCH -.->|WS 구독 0 (slot 비움)| UNCNT
    UNCNT --> LEDGER
    UNASP --> LEDGER
```

**WS 구독 수요 재편 핵심 (ADR 0124 — 2026-06-13 최고 관리자 직접 결재)**:

- **H0UNCNT0 단일 체결가 채널** — KRX+NXT 통합·종목당 1채널·`NEW_MKOP_CLS_CODE`(세션 구분 코드). 기존 H0STCNT0(KRX)+H0NXCNT0(NXT) 이중 발사 폐기 → 종목당 슬롯 1로 회계.
- **watchlist polling 강등** — watchlist의 KIS WS 구독 폐지 → 5초 REST polling 전용. WS 40 slot은 매매 수요(HOLDING/PENDING_BUY/STRATEGY) 전용으로 비움. watchlist 기능(등록/삭제/priority/화면)은 유지.
- **owner priority 재정렬** — HOLDING(0) > PENDING_BUY(5) > STRATEGY(10) > DETAIL(20). **매매 경로(STRATEGY)가 관찰 경로(DETAIL)보다 우선** — slot 경합 시 DETAIL evict·STRATEGY 보호. HOLDING·PENDING_BUY는 evict 절대 금지(ADR 0114 LOCK).
- **호가 H0UNASP0 통합 호가 전환** — ① 전략 ACTIVE 매매 경로(STRATEGY owner·marketable limit 진입가 산정) ② 종목 상세 화면 표시 중(DETAIL owner — 진입 시 구독·이탈 즉시 해제, 15분 idle 안전망) 두 경로만 구독.
