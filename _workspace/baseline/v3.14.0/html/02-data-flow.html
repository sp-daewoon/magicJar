## 🔄 v3.13.0 → v3.14.0 진화 요약 (리팩토링맨 lens)

| 영역 | v3.13.0 | v3.14.0 | 진화 사유 |
|------|---------|---------|----------|
| 분할매수 회차 예산 base | 회차마다 `buyable` **재계산** — 1차 노출로 남은 한도가 줄어 2·3차 비중 왜곡 (라이브 실증 전략47) | **1차 진입 시점 `buyable`를 `scale_in_base_budget`에 박제**(V90 ①) → `회차예산 = 고정 base × 회차비중%` | ADR 0128 ① — "회차마다 줄어드는 한도"가 분할의 의미(균등 물타기)를 깨뜨림. base 고정으로 외부주입 추상화(미래 "목표금액 매집"은 base만 교체) |
| 부분매수 잔여 | 자금 부족으로 회차 일부만 체결돼도 못 산 잔여를 **망각** | **`scale_in_remainder_qty` 추적**(V90 ②) — 자금 생기면 다음 boundary 에서 마저 채움(buyable clamp) | ADR 0128 ② — 분할 회차 예산 무결성 |
| catastrophic floor 동작 | floor 도달 시 **무조건 자동 청산**(StopLoss) (#1058) | **default 알람만**(`FloorBreachAlert` — SystemEvent WARN Slack) + 전략별 **opt-in 자동청산 토글**(`floorAutoLiquidate` · 갭②) | ADR 0128 ⑦ + amend 갭② — 스윙 변동성서 기계적 청산이 반등을 놓침. 청산은 사용자 수동 default, 원하는 전략만 명시 opt-in |
| floor default 출처 | 컴파일 상수 `DEFAULT_STOP_LOSS_FLOOR_PCT=15`가 **운영 default 겸직** | **yml `magicjar.strategy.scale-in.floor-default-pct`로 외부화**(갭①) — 저장 시 floor null → yml default 주입(항상 명시 floor persist). 컴파일 상수는 last-resort 안전망으로만 잔존 | ADR 0128 amend 갭① — 재컴파일 없이 floor 기본값 튜닝 + 사용자 가시성(`/scale-in-defaults` prefill) |
| 분할 미완 손절 | scaleIn 설정 전략도 1회차에서 평단×0.95 도달 시 즉시 청산 → **물타기 기회 박탈**(라이브 실증) | **분할 미완(`filledLots < effectiveSliceCount`) 동안 평단 손절 DEFER** + 분할 완료 후 평단 -손절% 정상(⑤⑥) · 무한 물타기는 floor 로 bound | 2026-06-19 결재 — 분할매수 본질(하락 시 물타기 평단↓)과 손절 충돌 해소 |
| totalSlices 초과 진입 | `weights.getOrElse{last()}`가 4회차에도 마지막 가중으로 **계속 매수**(전략47 실증) | **`ScaleInPlan.sliceAt(filledLots)` null → 진입 0**(⑧) | 라이브 자본경로 버그 — 분할 완료 후 무한 진입 차단 |
| weight 0% 회차 | `[50,50,0]` 처리 미정의 | **0% 회차 skip**(⑨ — `effectiveSliceCount`/`sliceAt` 정합) `[50,50,0]`=`[50,50]` | 사용자 결재 — 회차 비활성 표현 허용(음수만 금지) |
| 익절 tick 안전망 | `PositionTakeProfitTickWatcher` (v3.13.0 라이브 반영) | **ADR 0127로 SoT 정식 승격**(SL/TP 비대칭 해소 — tick ≥ 익절가 시 MARKET SELL, `auto-tpt:` KST 멱등키) | ADR 0127 — day-order LIMIT 만료 + DSL exit 불성립 시 급등에도 미청산 결함 |
| 만료 day-order 동기화 | `ExpiredDayOrderSyncWorker` 도입 | **RT_CD_7(조회일자 거부) 근본 fix**(조회 시작일=발주일 anchor) + **EXPIRE fallback SELL 전용 가드**(BUY 체결 누락 오삭제 차단) | canary D5·D6 — 좀비 ACK 청소 마비로 익절 deadlock |
| 오프라인 체결 정합 | (부재) | **`KisExecutionBackfill` 부팅 정합** — 다운 중 KIS 지정가 체결을 부팅 시 포지션·PnL·알림 자동 정합 | canary D5 — consumer 다운 중 체결 누락 |
| 전략 목록 조회 | `findAllByUserIdActiveFirst`(가동도+최신) 단일 | **`q`(name·nameKo·codes 부분일치) + `sort`(recent·name·status) 파라미터**(`searchByUserId` native) — q 없음+recent/status 는 현행 경로 보존(zero-regression) | 전략 수 증가 대비 탐색성 |
| 전략 시작화면·템플릿 | (부재) | **`StrategyOwner{SYSTEM,USER}` + `GET /api/strategies/start`**(검증 템플릿 10건 시드 V89 + 내 전략 + 즐겨찾기) + `strategy_favorite`(V88) — 자동매매 평가 경로는 owner='USER' 가드 | 빌더 시작점 + 프리셋 DB 데이터화(코드 배포 없이 성장) |
| 전략 성과 히스토리 | (부재) | **`strategy_daily_performance`(V85)·`market_index_daily`(V86)·`strategy_daily_note`(V87)** — 매일 00:30 집계(왕복성과+지수레짐+α+메모) | ADR 0126 |
| Flyway | V82까지 | **V90까지** (V83~V90 8건 — VI policy·realtime fallback·전략 성과 3종·owner/favorite·시드·scale_in base/remainder) | — |

✨ **핵심 통찰**: v3.13.0이 REAL canary 첫 실전 incident(F7~F11)를 sealed 타입·BUY-only 면제·tick 대칭으로 견고화한 baseline이었다면, v3.14.0은 **canary 장기 dwell(D5~D8) 중 후성·전략47 라이브에서 도출된 "분할매수 자본 로직의 구조적 결함"을 재설계로 닫은 baseline**이다. 핵심은 분할매수(scale-in)의 자본 흐름 4축 재정의 — ① base 1차 박제(회차마다 줄어드는 한도 왜곡 제거), ② 부분매수 잔여 추적(회차 예산 무결성), ⑤⑥ 분할 미완 손절 보류(물타기 의미 보존)·완료 후 정상 손절, ⑦+갭② floor 알람-only default + opt-in 자동청산(스윙 반등 보호). 동시에 floor 운영 default 를 yml로 외부화(갭①)해 재컴파일 없는 튜닝 + 빌더 prefill 가시성을 확보했다. 모든 변경이 scaleIn 미설정 전략에 **byte-동일 zero-regression**(LOCK) + add-only 하위호환 + AI 결정권 0.

### 3-2. ✨ 분할매수 base 박제 + 회차 예산 흐름 (v3.14.0 신규 — ADR 0128 ①②)

```
[1차 진입 — filledLots=0]
BUY 시그널(signal.generated.v1) → SignalGeneratedKafkaListener.resolveOrderQuantity
    ↓ scaleIn 설정 + filledLots=0 → RiskGatewayEvaluator.resolveBuyQuantity(signal, ctx, scaleIn)
    │     회차예산 = floor(buyable × sliceWeights[0]% / 100)   [계좌 전체 공유 풀 buyable 위에 회차 비중]
    │     수량 = floor(회차예산 / price)                       (RoundingMode.DOWN)
    ↓ BUY intent(order.intent.v1) 발행 성공 →
    captureScaleInBaseIfFirstSlice (filledLots=0·미박제 가드):
        그 시점 resolveScaleInBaseBudget(= resolveBuyQuantity 와 동일 budget 단일 진실원)을
        StrategyPosition.scale_in_base_budget(V90)에 박제 (graceful — 실패 시 라이브 buyable fallback)
    핵심: 1차 buyable 은 그 시점에만 정확(체결은 Kafka 비동기 분리·사후 재계산 시 보유·예수금 변동)

[2·3차 회차 — filledLots>0]
    ↓ 회차예산 = floor(고정 base × sliceWeights[filledLots]% / 100)   [재계산 폐기 — base 고정]
    ↓ 부분체결 시 ConsumerExecutionStrategyPositionAdapter.applyBuy:
        scale_in_remainder_qty = max(0, 주문수량 − 체결수량)   (다음 회차 보충 · buyable clamp)

[전량 청산 — quantity=0]
    ↓ applySell / drift willBeClosed 가 quantity=0 도달 → scale_in_base_budget·scale_in_remainder_qty 모두 reset (새 사이클 새 base)
```

✨ **base 고정 LOCK (ADR 0128 ①)**: 회차마다 `buyable`를 재계산하면 1차 노출로 남은 한도가 줄어 2·3차 비중이 왜곡된다(전략47 라이브 실증). 1차 시점 `buyable`를 박제해 모든 회차가 동일 base 기준 비중을 받는다. 외부주입 추상화 — 미래 "지정가+목표금액 매집"은 이 컬럼에 목표금액을 채우면 호환(`StrategyPositionJpaEntity`·`StrategyPositionReadJpaEntity` 양방향 매핑 — #1052 drift 교훈으로 consumer/api 양쪽 정합).

### 3-3. ✨ catastrophic floor 알람/자동청산 토글 흐름 (v3.14.0 신규 — ADR 0128 ⑦·갭②)

```
market.tick.v1 / 1m boundary → RealtimeSignalGenerator.evaluateScaleInExit
    ↓ ScaleInExitInput(
        scaleInStopLossFloorPct = scaleIn?.stopLossFloorPct,         [⑦ — null 이면 엔진 default = domain 상수]
        floorAutoLiquidate      = scaleIn?.floorAutoLiquidate ?: false ) [갭② — 전략 명시 opt-in]
    ↓ ScaleInExitCalculator.evaluate → StopLossVerdict 판정:
    │   scaleIn 미설정          → FIRE (현행 손절 — zero-regression)
    │   filledLots ≥ effectiveSliceCount (분할 완료) → FIRE (평단 -손절% 정상 ⑥)
    │   floorPct ≤ 0 (floor 비활성)               → DEFER (순수 보류 — 알람도 없음)
    │   분할 미완 & currentPrice ≤ floorPrice      → FLOOR_ALERT
    │   분할 미완 & floor 미도달                    → DEFER (손절 보류 ⑤)
    ↓ when(decision):
    ├── StopLoss              → sellSignal(MARKET, OrderTrigger 손절 경로 재사용)
    │       (FLOOR_ALERT + floorAutoLiquidate=true 면 엔진이 StopLoss 반환 — 갭②)
    ├── FloorBreachAlert      → emitFloorBreachAlert(strategy, code, decision) → SELL 미발행·null 반환
    │       (FLOOR_ALERT + floorAutoLiquidate=false default — ⑦)
    │       → SystemEventLogger WARN(SYSTEM_EVENT → Slack) {strategyId·code·qty·avgPrice·currentPrice·floorPct·lossPct}
    │       → runCatching wrap (emit 실패해도 매매 평가 thread 무손상) · bean 부재 시 graceful 로그만
    ├── PartialTakeProfit / TakeProfit → sellSignal(LIMIT, 평단×(1+pct))
    ├── EnterSlice            → BUY 시그널(SCALE_IN_SLICE#N) — sliceAt(filledLots) null 이면 진입 0 (⑧)
    └── Hold                  → null
```

✨ **floor opt-out default + opt-in 청산 (ADR 0128 ⑦ + amend 갭②)**: ⑦이 "floor=알람만"을 default 로 둔 건 스윙 매매 변동성서 기계적 청산이 반등을 놓치기 때문 — 청산은 사용자 수동 판단. 갭②는 그 default 를 유지(zero-regression)하면서 `floorAutoLiquidate=true`인 전략만 floor 도달 시 자동 전량 청산(기존 손절 경로 재사용)을 켠다. 자본 경로 변경이므로 전략 단위 명시 opt-in. floor 비활성(`stopLossFloorPct ≤ 0`)이면 토글 무관 청산·알람 모두 없음(순수 보류).

### 3-4. ✨ 분할 미완 손절 보류 흐름 (v3.14.0 신규 — 2026-06-19 결재 ⑤⑥)

```
분할매수 전략 보유 → 평단 대비 손실
    ① 1m 시그널 경로 (단일 진실원)  ScaleInExitCalculator.stopLossVerdict:
        scaleIn 설정 + filledLots < effectiveSliceCount (분할 미완) → 평단 손절 DEFER (물타기 기회 보존 ⑤)
        분할 완료 (filledLots ≥ effectiveSliceCount)             → FIRE (최종 평단 -stopLossPct% ⑥)
    ② tick 안전망  PositionStopLossTickWatcher:
        HoldingPositionIndex.HeldPosition 에 filledLots·scaleInTotalSlices(scale_in_config.totalSlices 파싱) 스냅샷
        분할 미완이면 동일 의미로 보류 — 1m·tick 동일 floor 값 정합
    무한 물타기 교착 방지: 손절 보류가 무한이 되면 "분할도 안 되고 손절도 안 되는" 교착 →
        보류 자체에 catastrophic floor(평단 -floorPct, default yml 15%)를 둬 floor 도달 시 분할 미완이라도 알람/청산
```

✨ **물타기 의미 보존 (⑤)**: 분할매수는 하락 시 물타기로 평단을 낮추는 전략인데, 1회차(filledLots=1/3 미완)에서 평단×0.95 손절선에 닿았다고 즉시 청산하면 2·3회차 물타기 기회가 사라져 분할 의미가 무력화된다(라이브 실증 2026-06-19 전략47). scaleIn 미설정(일반) 전략은 현행 손절 byte 동일(zero-regression).

#### V90 `strategy_position.scale_in_base_budget`·`scale_in_remainder_qty` 핵심 (ADR 0128 ①②)

```sql
ALTER TABLE strategy_position
    ADD COLUMN IF NOT EXISTS scale_in_base_budget  NUMERIC(19,4) NULL CHECK (scale_in_base_budget IS NULL OR scale_in_base_budget >= 0),
    ADD COLUMN IF NOT EXISTS scale_in_remainder_qty INTEGER NOT NULL DEFAULT 0 CHECK (scale_in_remainder_qty >= 0);
-- ① base = 1차 진입 시점 buyable 박제(회차마다 재계산 폐기 — 2·3차 = 고정 base × 회차비중%). 외부주입 추상화.
-- ② 잔여 = 회차 일부만 체결 시 못 산 수량 기억(다음 회차 보충 · buyable clamp).
-- floor(stopLossFloorPct)·floorAutoLiquidate 는 scale_in_config JSONB 가 자동 흡수 — DDL 불필요(add-only).
-- 하위호환: nullable/default 0 — 기존 행 영향 0. quantity=0 청산 시 reset 은 R2 체결 listener 책임.

## 11. 💡 v3.14.0 리팩토링맨 lens 진보 평가

| 영역 | 진보도 | 평가 |
|------|-------|------|
| 분할 base 1차 박제 | ★★★★★ | "회차마다 줄어드는 한도"가 분할 비중을 왜곡하던 라이브 결함을 base 고정으로 제거 — 외부주입 추상화(미래 목표금액 매집은 base 교체만)까지 설계에 담은 OCP |
| floor 알람/청산 sealed 분기 | ★★★★★ | `ScaleInExitDecision.FloorBreachAlert` vs `StopLoss` 를 `when` exhaustive 로 분리 — "알람만"과 "자동청산"을 컴파일 타임 구분. opt-in 토글로 자본 경로 변경을 전략 단위 명시화 |
| floor 운영 default yml 외부화 | ★★★★★ | 컴파일 상수 운영 default 겸직(경직성)을 박탈 → yml 튜닝(재컴파일 0) + `/scale-in-defaults` prefill 가시성. 상수는 last-resort 안전망 단일 출처로만 잔존(중복 상수 제거) |
| 분할 미완 손절 보류 | ★★★★★ | 분할매수 본질(물타기 평단↓)과 손절 충돌을 `StopLossVerdict`(FIRE/FLOOR_ALERT/DEFER) 3분기로 해소. 무한 물타기는 floor 로 bound(결정론적 환원) |
| ⑧⑨ slice 해석 | ★★★★ | `sliceAt(filledLots)` null → totalSlices 초과 진입 0(전략47 무한 진입 fix) + `effectiveSliceCount` 0% skip(`[50,50,0]`=`[50,50]`) — 회차 카운터 정합 |
| JSONB floor 라운드트립 fix | ★★★★ | write 전 필드 직렬화 vs read 일부 누락 비대칭(critical) — api·consumer 양쪽 deserialize 정합(#1052 교훈). 누락 시 갭② wiring 영구 dead 였을 silent 버그 차단 |
| wire 불변 add-only | ★★★★★ | 자본 로직 재설계인데 Kafka·STOMP·Redis 신설 0(전부 기존 토픽 + DB 컬럼 add-only) — 운영 canary 메시지 계약 무손상 |
| 전략 목록 검색·정렬 | ★★★★ | q 없음+recent/status 는 현행 JPQL 경로 보존(zero-regression), q/name 만 native 위임 — 점진 확장 |
| 전략 템플릿 데이터화 | ★★★★ | 하드코딩 프리셋 → SYSTEM owner 시드(V89) + favorite(V88), 자동매매 평가 경로는 owner='USER' 가드 — 코드 배포 없이 성장 |
| zero-regression LOCK | ★★★★★ | scaleIn 미설정 전략은 모든 분할 변경에 byte-동일. floor null → yml default 주입으로 저장 전략은 항상 명시 floor(legacy 안전) |

✨ **v3.14.0 cut 종합 평가**:
- v3.13.0이 REAL canary 첫 실전 incident(F7~F11)를 sealed 타입으로 견고화한 baseline이었다면, v3.14.0은 **canary 장기 dwell(D5~D8) 라이브에서 도출된 분할매수 자본 로직의 구조적 결함을 재설계로 닫은 baseline**이다.
