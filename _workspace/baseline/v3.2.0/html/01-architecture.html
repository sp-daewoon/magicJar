<script id="md-source" type="text/markdown"># 01 — magicJar v3.2.0 아키텍처 (시각화)

> **작성자**: architect (PR-46)
> **시점**: 2026-05-10 v3.2.0 태그 컷 직후
> **권위**: `docs/architecture/master-architecture.md` v2 §5·§6 + ADR 0002·0004(갱신, 4→5 모듈)·0005·0006·0007·0008·0009·0054·0055 정합 + v3.2.0 시점 코드 inspection 결과

본 문서는 v3.2.0 시점 magicJar 시스템의 **시각화 가능 수준 그림**이다. SoT는 `docs/architecture/master-architecture.md`이며, 본 문서는 그 하위 구체화 — v3.2.0 시점 실체(현재 발행된 컨테이너·테이블·KIS endpoint·Kafka topic·Anthropic helper)만 인용한다. v1/v2 잔재 0건. 미발행 트랙(W3~W5)은 명시적으로 제외.

**v3.1.0 → v3.2.0 핵심 변경**:
- 모듈 4 → 5 (`pattern-engine` 라이브러리 jar 신설 — ADR 0054)
- Flyway V8 → V11 (V9 strategy 기본 + V10 disabled_reason + V11 strategy_eval_metric)
- 외부 통합 +1 (Anthropic — T-DSL 자연어→DSL helper, ADR 0023·0026 사용자 트리거 한정)
- frontend 라우트 +1 (`/strategy/builder`)
- `domain/indicator/*` 7 port + `domain/strategy/*` 23+ sealed class + `domain/pattern/*` 5 도메인 + 7 port

---

**범례**:
- 실선 화살표 — DB·Redis·Kafka inbound/outbound
- 점선 화살표 — 외부 HTTP/WS 호출 + pattern-engine library 의존(implementation)
- `domain`은 모든 JVM 모듈의 의존이지만 시각화 단순화를 위해 별도 박스 + port implements 점선만 표시
- `pattern-engine`은 라이브러리 jar(컨테이너 추가 0) — Spring Context는 있지만 Spring Boot main 0. api·consumer 컨테이너가 build 시 흡수.

**원칙**: 외부 6개(KIS REST·KIS WS·KIS 종목마스터 ZIP·DART·Yahoo·Anthropic) 중 어느 하나가 끊겨도 본체는 동작 — 영속 candle·Redis 캐시·정적 시드·last-day-close fallback (`master-architecture.md` §3-2). Anthropic은 사용자 트리거 helper만이라 부재 시 MockDslHeuristic 9 패턴 fallback 또는 503 AI_DISABLED 응답(ADR 0023·0026·룰 5).

        int priority
    }
    candle {
        bigint id PK
        varchar code FK

    }
    corp_action {

```

> Mermaid ERD는 v3.2.0 활성 테이블 핵심 관계만 표시. 전체 테이블 풀 명세는 V1~V11 SQL 파일을 SoT로 본다. v3.1.0 보존 테이블(system_config·user_kis_credential·orders·order_reject_audit·market_calendar·position·notification_outbox·audit_trail·instrument_alias·kill_switch_state)은 시각화 단순화를 위해 생략.
