## T-W1 — 온보딩 + 관심종목 CRUD

### 1. REST endpoint

| 메서드 | path | 설명 |
|--------|------|------|
| GET | `/api/onboarding/status` | 온보딩 완료 여부 조회 |
| POST | `/api/onboarding/kis/validate` | KIS 실계좌 key/secret 검증 |
| POST | `/api/onboarding/kis/mock` | KIS 모의계좌 설정 저장 |
| PUT | `/api/onboarding/system-config` | DART API 키·알림 webhook 저장 |
| POST | `/api/onboarding/complete` | 온보딩 완료 마킹 |
| GET | `/api/watchlists` | 관심종목 목록 조회 |
| POST | `/api/watchlists` | 관심종목 등록 (Kafka ADDED 발행) |
| DELETE | `/api/watchlists/{code}` | 관심종목 삭제 (Kafka REMOVED 발행) |

Swagger 4단 어노테이션: `@Tag(name="Onboarding"·"Watchlist")` / `@Operation` / `@Parameter` / `@Schema`. OnboardingGuardFilter — 셋업 미완 시 `/api/*` 401 차단.

### 2. 도메인 모델

- `domain/user/UserAccount.kt` — userId, displayName, maskedAccount
- `domain/user/UserKisCredential.kt` — accountType(REAL/MOCK), appKeyEnc, secretKeyEnc
- `domain/user/SystemConfig.kt` — dartApiKey(BYTEA), notificationSlackWebhook(BYTEA)
- `domain/user/UserOnboardedEvent.kt` — 온보딩 완료 이벤트 (도메인 이벤트)
- `domain/watchlist/WatchlistEntry.kt` — id, userId, code, priority, createdAt
- `domain/position/Position.kt` — userId, code, quantity, avgPrice

### 3. 영속

| Flyway | 테이블 | 주요 내용 |
|--------|--------|---------|
| V1 | `user_account` | PK userId, display_name, masked_account |
| V1 | `user_kis_credential` | PK(userId, accountType), AES-GCM BYTEA |
| V1 | `system_config` | singleton row id=1 |
| V1 | `watchlist` | UQ(userId, code), FK user ON DELETE CASCADE |
| V1 | `position` | UQ(userId, code) |
| V2 | `user_account` | masked_account GENERATED + 인덱스 보강 |
| V3 | `instrument` | CHECK constraint 완화 + 인덱스 추가 |

### 4. 외부 통합

- **KIS REST** `/oauth2/tokenP` — access token 발급 (AesGcmCipher 복호화 후 호출)
- **KIS REST** `TTTC8434R` / `VTTC8434R` — 잔고 조회 (실전/모의, PositionBootstrapRunner)
- KIS key 검증: `KisAuthValidator` — prod host (`openapi.koreainvestment.com`) + mock host (`openapivts.koreainvestment.com`)

### 5. Kafka

| 토픽 | 방향 | payload |
|------|------|---------|
| `watchlist.changed.v1` | api → consumer | `WatchlistChangedEvent(userId, code, action=ADDED/REMOVED, occurredAt)` |

### 6. UI 화면

- `frontend/src/pages/Setup/SetupWizard.tsx` — 7-step 온보딩 마법사
- `frontend/src/pages/Watchlist/WatchlistPage.tsx` — 관심종목 목록·등록·삭제
- `frontend/src/components/watchlist/WatchlistRow.tsx` — 거래정지·관리종목 배지 표시

### 7. PR 인용

- PR-5a (2026-05-07) — 4 JVM 모듈 골격 + Flyway V1
- PR-6a/6b (2026-05-07) — T-ONBOARD 백엔드 + 프론트엔드
- PR-7a/7b (2026-05-07) — T-W1 WatchlistController + Watchlist CRUD UI
- PR-29a (2026-05-08) — T-MS1 포함 WatchlistService 등 보강

### 8. ADR 인용

- ADR 0028 — Watchlist 기반 Ingestion 정책
- ADR 0040 — Watchlist-first UI 흐름 (magicJar 1순위 진입점)
- ADR 0042 — Position Bootstrap Recovery (부팅 시 잔고 동기화)
- ADR 0046 — Onboarding & Credential Registration

### 9. 한계·todo

- `masked_account` 자동 생성 — 완전한 계좌 번호 관리는 T-O 트랙 예정
- 멀티 사용자(multi-tenant) 지원 — 현재 단일 사용자(첫 row 자동 resolve)
- position.quantity < 0 (공매도) 처리 미지원

## T-W2 — KIS WebSocket + 실시간 시세

### 1. REST endpoint

- 직접 REST 없음 (KIS WS 연결은 consumer 내부 자동 시작)
- 관련: `GET /api/watchlists` 목록 기반 자동 구독

### 2. 도메인 모델

- `domain/market/tick/TickEvent.kt` — code, price, volume, changeRate, ts
- `domain/market/port/KisWsPort.kt` — subscribe(code)/unsubscribe(code)/connect/disconnect
- `domain/market/port/QuoteCachePort.kt` — get(code)/put(code, TickEvent)

### 3. 영속

- Candle DB (V1 `candle`) — `TickToMinuteAggregator` → 1분봉 closing 시 INSERT/UPDATE
- Redis `quote:{code}` (TTL 30s) — 최신 tick 스냅샷 (RedisQuoteCacheAdapter)

### 4. 외부 통합

- **KIS WebSocket** `wss://openapi.koreainvestment.com:9443/websocket/auth`
  - 체결가: `H0STCNT0` (45 필드, PIPE `|` 구분)
  - 구독 상한: 41종목 (ADR 0048)
  - reconnect: 지수 백오프 1·2·5·10·30s
  - polling fallback: 10초 주기 `FHKST01010100` 자동 전환 (KisRestPriceAdapter)

### 5. Kafka

| 토픽 | 방향 | payload | retention |
|------|------|---------|-----------|
| `market.tick.v1` | consumer → api | `TickEvent(code, price, volume, ts)` | 1h |
| `market.candle.minute.closed.v1` | consumer → api | `Candle(code, interval=1m, ts, OHLCV)` | 1d |

### 6. UI 화면

- `frontend/src/pages/Dashboard/DashboardPage.tsx` — STOMP 구독 (`/topic/market.tick.{code}`) 실시간 시세 표시
- LWC v4 TradingView Lightweight Charts — 1분봉 실시간 갱신

### 7. PR 인용

- PR-9b (2026-05-07) — KisWebSocketBridge + TickToMinuteAggregator + SimpleMarketSessionResolver

### 8. ADR 인용

- ADR 0048 — KIS WebSocket 41건 구독 한도 + 우선순위 정책

### 9. 한계·todo

- 구독 한도 41종목 초과 시 우선순위 자동 교체 정책 미완성 (ADR 0048 §3 post-MVP)
- H0STCNI9 체결통보 (주문 체결 실시간 알림) — T-O 트랙 예정

## T-S1 — 종목 상세 + 캔들 차트 + 호가

### 1. REST endpoint

| 메서드 | path | 설명 |
|--------|------|------|
| GET | `/api/symbols/{code}` | 종목 상세 (현재가·등락률·재무 요약) |
| GET | `/api/symbols/{code}/candles` | 캔들 시계열 (interval·from·to 파라미터) |
| POST | `/api/symbols/{code}/orderbook/subscribe` | 호가 실시간 구독 시작 |
| POST | `/api/symbols/{code}/orderbook/unsubscribe` | 호가 구독 해제 |

### 2. 도메인 모델

- `domain/market/PriceMetrics.kt` — inquire-financial-ratio·volume 등 KIS 지표
- `domain/market/OrderbookSnapshot.kt` — bids/asks 각 10호가
- `domain/market/port/KisRestPriceMetricsPort.kt` — fetchPriceMetrics(code)
- `domain/market/candle/Candle.kt` — code, interval(CandleInterval sealed), ts, OHLCV_raw, OHLCV_adj

### 3. 영속

- `candle` 테이블 (V1) — `CandleJpaRepository`: findByCodeAndIntervalLatest / findByCodeAndIntervalAndTsBefore
- `CandleRepositoryAdapter` — 도메인 port 구현

### 4. 외부 통합

- **KIS REST** `FHKST01010100` inquire-price — 현재가·등락률 조회
- **KIS REST** `FHKST03010100` inquire-daily-price — 일봉 캔들 (CandleQueryService)
- **KIS WebSocket** `H0STASP0` — 호가 실시간 스냅샷 (10호가 bid/ask)
- **Yahoo Finance** `v8/finance/chart/{code}.KS` — adj close fallback (ADR 0014)

### 5. Kafka

| 토픽 | 방향 | payload | retention |
|------|------|---------|-----------|
| `market.orderbook.v1` | consumer → api | `OrderbookSnapshot(code, bids, asks, ts)` | 1h |
| `symbol.detail.command.v1` | api → consumer | `SymbolDetailCommand(code, action=SUB/UNSUB)` | 1h |

### 6. UI 화면

- `frontend/src/pages/Symbol/SymbolDetailPage.tsx` — 종목 상세 (현재가·등락률·재무 요약 + LWC 차트)
- `frontend/src/components/chart/CandleChart.tsx` — TradingView Lightweight Charts (interval 토글 1m/5m/30m/1h/1d)
- `frontend/src/components/symbol/OrderbookTable.tsx` — 호가창 실시간 (STOMP `/topic/market.orderbook.{code}`)

### 7. PR 인용

- PR-10a (2026-05-07) — SymbolDetailPage + CandleChart frontend
- PR-10b (2026-05-07) — SymbolController + KisRestPriceMetricsAdapter + STOMP forwarder
- PR-29c (2026-05-08) — sendBeacon Blob 정정 + WatchlistEntryDto 6 필드

### 8. ADR 인용

- ADR 0019 — Candle Storage + Watchlist + Yahoo fallback
- ADR 0014 — Data Fallback 3단계 (KIS WS → KIS REST → Yahoo)

### 9. 한계·todo

- 호가 LRU 10종목 한도 (ADR 0048 §2 상한) — 초과 시 가장 오래된 종목 자동 해제
- 분봉 캔들 backfill — 현재 일봉만 (T-BT W3 트랙 예정)
- `inquire-financial-ratio` 라이선스 제약 — 상업용 사용 주의 필요

## T-CA1 — 기업 행위(Corporate Action) + 캔들 수정주가

### 1. REST endpoint

직접 REST 없음. `CandleQueryService.getCandles(adjusted=true)` 파라미터로 수정주가 반환.

### 2. 도메인 모델

- `domain/instrument/corp_action/CorpAction.kt` — instrumentCode, type(CorpActionType), exDate, ratio, cashDividend, source
