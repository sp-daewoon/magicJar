- baseline: v3.2.2
- 작성일: 2026-05-11
- 작성자: backend-core (bot+backend-core@magicjar.local)
- SoT: `docs/architecture/master-architecture.md` §2 + `settings.gradle.kts` + ADR 0004

## 1. 모듈 의존성 매트릭스

### 1-1. JVM 5 모듈 구성

```
settings.gradle.kts include:
  domain
  pattern-engine
  api
  batch
  consumer
```

| 모듈 | Spring 의존 | JPA 의존 | 역할 |
|------|------------|---------|------|
| `domain` | 0 | 0 | 순수 도메인 + 포트 인터페이스 (Spring·JPA 0 — 헥사고날 내부 링) |
| `pattern-engine` | 0 | 0 | 캔들스틱 패턴 57종 인식 (Pure Kotlin — ADR 0054) |
| `api` | Spring Boot 3.3 | JPA (Hibernate 6) | REST/STOMP + KIS REST 어댑터 + Kafka producer |
| `batch` | Spring Boot 3.3 + Spring Batch | JPA | 종목 마스터 sync + 기업 행위 처리 잡 |
| `consumer` | Spring Boot 3.3 | JPA | Kafka 소비 + KIS WS 브릿지 + 시그널·주문 dispatch |

### 1-2. 모듈 간 의존 방향

```
domain ←── api
domain ←── consumer
domain ←── batch
pattern-engine ←── api
(domain ← pattern-engine : PatternRecognizer port 참조)
```

- `domain`은 어떤 모듈에도 의존하지 않음 (Spring·JPA import 0건 강제)
- `api`/`consumer`/`batch`는 `domain` 포트 인터페이스를 구현하는 어댑터 배치
- `pattern-engine`은 `domain`의 `PatternRecognizer` 포트 구현체 (`JvmPatternRecognizer`)

## 2. api 모듈 데이터 흐름

### 2-1. REST 엔드포인트 매트릭스

| 경로 | 컨트롤러 | 역할 | Kafka 발행 |
|------|---------|------|-----------|
| `GET /api/watchlists` | `WatchlistController` | 관심종목 목록 (priority ASC) | — |
| `POST /api/watchlists` | `WatchlistController` | 관심종목 등록 | `watchlist.changed.v1` ADDED |
| `DELETE /api/watchlists/{code}` | `WatchlistController` | 관심종목 삭제 | `watchlist.changed.v1` REMOVED |
| `GET /api/symbols/{code}` | `SymbolController` | 현재가·PER·PBR·시총·업종 | — |
| `GET /api/symbols/{code}/candles` | `SymbolController` | 캔들 시계열 (DB + Redis merge) | — |
| `POST /api/symbols/{code}/orderbook/subscribe` | `SymbolController` | 호가 구독 시작 | `symbol.detail.command.v1` ENTER |
| `POST /api/symbols/{code}/orderbook/unsubscribe` | `SymbolController` | 호가 구독 해제 | `symbol.detail.command.v1` EXIT |
| `GET /api/patterns` | `PatternController` | 57종 패턴 인식 | — |
| `GET /api/indicators` | `IndicatorController` | 80종 기술적 지표 | — |
| `GET /api/instruments` | `InstrumentController` | 종목 검색 (Redis 인덱스) | — |
| `POST /api/backtest/run` | `BacktestController` | DSL 전략 백테스트 | — |
| `GET /api/strategies` | `StrategyController` | 전략 CRUD | — |
| `POST /api/onboarding` | `OnboardingController` | KIS 키 등록 + AES 암호화 | — |
| `POST /api/ai/dsl/translate` | `DslTranslateController` | 자연어 → DSL 변환 (AI 보조) | — |

### 2-2. STOMP 구독 토픽 (api Kafka Consumer → 브라우저 fanout)

| Kafka 토픽 (소비) | STOMP 토픽 (발행) | 포워더 클래스 | 설명 |
|-----------------|----------------|-------------|------|
| `market.tick.v1` | `/topic/market.tick.{code}` | `MarketTickStompForwarder` | 실시간 체결가 (1초 throttle) |
| `market.candle.minute.closed.v1` | `/topic/market.candle.minute.{code}` | `MarketCandleStompForwarder` | 1분봉 closing (throttle 없음) |
| `market.orderbook.v1` | `/topic/market.orderbook.{code}` | `MarketOrderbookStompForwarder` | 호가 스냅샷 |

### 2-3. api 모듈 내부 서비스 레이어

```
Controller → Service → JPA Repository (persistence 패키지)
                     → Redis (InstrumentSearchIndexAdapter 등)
                     → KIS REST 어댑터 (KisRestPriceMetricsAdapter)
```

## 3. consumer 모듈 데이터 흐름

### 3-1. Kafka 토픽 소비 매트릭스

| 토픽 | 리스너 클래스 | groupId | 처리 내용 |
|------|------------|---------|----------|
| `watchlist.changed.v1` | `WatchlistChangedKafkaListener` | `magicjar-consumer-watchlist-ingestion` | ADDED: cold-start 트리거 + WS/polling 구독 / REMOVED: 구독 해제 + Redis evict |
| `symbol.detail.command.v1` | `SymbolDetailCommandKafkaListener` | `magicjar-consumer-orderbook-cmd` | ENTER: H0STASP0 구독 slot 할당 / EXIT: slot 회수 |

### 3-2. KIS WS 브릿지 흐름

```
KIS WebSocket (wss://ops.koreainvestment.com:21000)
    ↓  H0STCNT0 (체결가 tick)
KisWebSocketBridge
    ├── writeToRedis(quote:last:{code}, 등락 필드 포함)   ← ADR 0029
    └── publishTickEvent → Kafka market.tick.v1
           ↓  (price·volume·priceChange·changeRate·changeSign)
    KIS WebSocket
    ↓  H0STASP0 (호가 스냅샷)
KisWebSocketBridge
    └── publishOrderbook → Kafka market.orderbook.v1

    KIS WebSocket
    ↓  PINGPONG JSON {"header":{"tr_id":"PINGPONG",...}}
KisWebSocketBridge
    └── echo (원본 raw 그대로 — KIS raw 정합)
```

### 3-3. TickToMinuteAggregator 흐름

```
Kafka market.tick.v1
    ↓
TickToMinuteAggregator
    ├── 1분 boundary 마감 시 → CandleRepository.saveAll (interval=1m)
    ├── Kafka market.candle.minute.closed.v1 발행
    └── (ADR 0062 §4-3) boundary 마감 → 5m·15m·30m·90m·1h 경계 검사
              → Redis candle:current:{code}:{interval} 갱신
```

### 3-4. cold-start 흐름 (ColdStartExecutor)

```
WatchlistChangedKafkaListener (ADDED)
    ↓  DB count 0이면 cold-start submit
ColdStartExecutor (thread pool=2, cold-start-N)
    ├── KIS REST FHKST03010230 → 1m (30 거래일, prod credential)
    ├── KIS REST FHKST03010100 → 1d (200건)
    ├── KIS REST FHKST03010100 → 1wk (200건)
    ├── KIS REST FHKST03010100 → 1mo (120건)
    └── KIS REST FHKST03010100 → 1y (10건)
         ↓  1m 적재 완료 직후
    AggregateBackfillRunner.backfill(code)
         ├── CandleRepository.findByCodeAndInterval(1m) → 전체 1m 조회
         ├── CandleAggregator.aggregate(5m·15m·30m·90m·1h)
         └── CandleRepository.saveAll (ON CONFLICT DO NOTHING)
    audit: KIS_COLD_START_DONE / KIS_COLD_START_PARTIAL_FAIL / KIS_COLD_START_FAILED
```

### 3-5. consumer 부팅 시 bootstrap 흐름

```
CandleBootstrapRunner (@ApplicationReadyEvent)
    ↓  watchlist 전 종목 순회
    ├── count(1m) < 700 (MIN_1M_CANDLE_THRESHOLD — ADR 0063 NXT 720건/일 기준)
    │       → ColdStartExecutor.submit(code) (1m + 합산 backfill)
    └── count(5m) == 0 && count(1m) >= 700
            → AggregateBackfillRunner.backfill(code) (합산만)

PositionBootstrapRunner (@ApplicationReadyEvent)
    └── KIS REST balance → Position DB 동기화
```

### 3-6. DailyCloseFinalizer (스케줄)

```
20:00 KST (NXT after-hour 마감 — ADR 0063 정합, 구 16:00 KST에서 변경)
    ↓
DailyCloseFinalizer
    ├── watchlist 전 종목 순회
    ├── AggregateBackfillRunner.backfill(code) — 당일 합산 갱신
    └── Redis 5m·15m·30m·90m·1h candle:current:{code}:{interval} evict
```

## 5. Redis 키 매트릭스 (ADR 0029 정합)

| Redis 키 패턴 | 데이터 | 갱신 | TTL |
|--------------|-------|------|-----|
| `quote:last:{code}` | `{price, volume, ts, source, priceChange, changeRate, changeSign}` JSON | KIS WS tick (H0STCNT0) | 7일 |
| `candle:current:{code}:1m` | 당일 진행 중 1분봉 | KIS WS tick / 1분 closing 시 evict | 1분 closing 시 evict |
| `candle:current:{code}:5m` | 당일 진행 중 5분봉 | 5분 boundary 마감 합산 (ADR 0062) | 5분 closing 시 evict |
| `candle:current:{code}:15m` | 당일 진행 중 15분봉 | 15분 boundary 마감 합산 | 15분 closing 시 evict |
| `candle:current:{code}:30m` | 당일 진행 중 30분봉 | 30분 boundary 마감 합산 | 30분 closing 시 evict |
| `candle:current:{code}:90m` | 당일 진행 중 90분봉 | 90분 boundary 마감 합산 | 90분 closing 시 evict |
| `candle:current:{code}:1h` | 당일 진행 중 60분봉 | 60분 boundary 마감 합산 | 1시간 closing 시 evict |
| `candle:today:{code}:1d` | 당일 일봉 진행 중 | DailyCloseFinalizer | 당일 마감 evict |
| `indicator:cache:{code}:{interval}:{name}:{paramsHash}` | 기술적 지표 결과 JSON | IndicatorService 계산 후 | 분봉: 300s / 일봉+: 86400s |
| `pattern:cache:{code}:{interval}:{...}` | 패턴 인식 결과 JSON | PatternController 조회 후 | 분봉: 300s / 일봉+: 86400s |
| `watchlist:source:{userId}` | 종목별 data source (WS·polling) 매트릭스 | SubscriptionRouter | — |
| `instrument:search:idx` | 종목 검색 인덱스 (Sorted Set) | InstrumentSyncJob | — |

```mermaid

    T2M["TickToMinuteAggregator\n(consumer)"]

    API_CANDLE["MarketCandleStompForwarder\n(api)"]
    STOMP_TICK["STOMP\n/topic/market.tick.{code}"]
    STOMP_CANDLE["STOMP\n/topic/market.candle.minute.{code}"]
    AGG["AggregateBackfillRunner\n(consumer)"]

    KIS_WS -->|H0STCNT0 체결 tick| BRIDGE
    BRIDGE -->|put| REDIS_QUOTE
    BRIDGE -->|publish| KAFKA_TICK
    KAFKA_TICK --> T2M
    KAFKA_TICK --> API_TICK
    T2M -->|1m closing| KAFKA_CANDLE
    T2M -->|5m·15m·30m·90m·1h boundary| REDIS_NM
    KAFKA_CANDLE --> API_CANDLE
    API_TICK --> STOMP_TICK
    API_CANDLE --> STOMP_CANDLE
    T2M -->|INSERT 1m| DB_CANDLE
    AGG -->|INSERT 5m~1h| DB_CANDLE
```

## 8. ADR 정합 참조

| ADR | 관련 흐름 |
|-----|---------|
| ADR 0004 | 모듈 경계 결정 (domain·api·batch·consumer + pattern-engine) |
| ADR 0007 | Kafka 이벤트 backbone — 7 토픽 매트릭스 |
| ADR 0019 | 캔들 저장 정책 (UQ code+interval+ts, CHECK 11종 interval) |
| ADR 0028 | Watchlist 기반 Ingestion Worker (cold-start + WS/polling 분배) |
| ADR 0029 | 당일 진행 중 캔들 Redis 캐시 (Redis 키 매트릭스) |
| ADR 0037 | KIS Rate Limit (50ms 마진, prod credential) |
| ADR 0048 | KIS WS 41 slot 한도 (OrderbookSubscriptionRouter LRU) |
| ADR 0051 | Spring Data Repository default fun 함정 금지 |
| ADR 0057 | KIS-only 데이터 출처 (Yahoo Finance 폐기 2026-05-11) |
| ADR 0062 | 5m·15m·30m·90m·1h 합산 가공 (백엔드 precomputed, 30 거래일) |
| ADR 0063 | NXT 통합 거래시간 cover (UN 코드, 08:00~20:00 KST, threshold 700) |
