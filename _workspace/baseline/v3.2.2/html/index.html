> **태그 컷**: 2026-05-11 v3.2.2 (main `a964604` 시점 baseline init, release commit `703605b`, `release/v3.2.2` 이미지 immutable)

> **상태**: PR-48 architect 영역(README + 01 + 06 + 07) 본격 작성. backend-core(02·04) · market-data(03) · frontend(05) 영역은 sub-agent 별도 디스패치.
> **권위**: 본 baseline 폴더는 v3.2.2 시점 **종합 기능 정의서**. SoT는 `docs/architecture/master-architecture.md` v2 (ADR 0030).

## 한 장 요약

magicJar v3.2.2는 **데이터 출처를 KIS OpenAPI 단일 채널로 통일**(ADR 0057) + **NXT 통합 거래 시간대(08:00~20:00 KST) cover**(ADR 0063) + **1m 합산 가공 트랙(5m·15m·30m·90m·1h 5종 precomputed)** 본격 가동(ADR 0062) — 세 정책 결정의 묶음 minor 릴리즈다. v3.2.0 W2 마감(2026-05-10) → v3.2.1 → v3.2.2 사이 ~16 PR + ADR 3건 신규(0056·0057·0062·0063 — 0056은 W3 T-BT 코드 PR-47 사이클) + Flyway 영향 0 + JVM 모듈 5 보존(`pattern-engine` v3.2.0 base 그대로) + 사용자 dogfooding 결함 root cause 정정 6건.

**v3.2.2 시점 동작하는 핵심 흐름** (v3.2.0 W1·W2 풀세트 + v3.2.2 데이터 정책 정합 갱신):

1. **W1 풀세트 + W2 4 트랙 (v3.2.0 baseline 그대로 보존)** — T-ONBOARD·T-W1·T-W2·T-S1·T-MS1·T-CA1·T-IM1·T-IND·T-DSL·T-PAT·T-SB 11 트랙. v3.2.2에서 본격 변경 0 (데이터 정책 정합만 갱신 — UI·도메인 추가는 5종 합산 활성화로 자연 흡수).
2. **W3 T-BT 코드 진입 (PR-47 #282 spec + #284 본격)** — `domain/backtest/*` 5 sealed class + 룩어헤드 가드 + 세금·수수료·슬리피지 보정 + sandbox 통합(JvmStrategyEvaluator 재사용, ADR 0047 정합) + Flyway 영향 0(W3 backtest_run 테이블은 후속 사이클). ADR 0056 신규.
3. **ADR 0057 — KIS OpenAPI 단일 데이터 출처 (PR #294)** — 사용자 dogfooding "일봉 위치에 월봉 노출" root cause(Yahoo `interval=1d&range=max` monthly downsample) → Yahoo Finance 전면 폐기 + KIS OpenAPI 단일 출처 정책 확립. ADR 0019(캔들 저장 정책) 부분 revoke(5m~1h "합성 폐기" 결정 → "1m 합산 가공으로 처리 보류"). 정보 수집 API = **prod credential 단일 채널**(`AccountType.REAL` only) — 모의/실전 분기는 주문 라우터에만 적용(사용자 메모리 `feedback_kis_key_realonly_for_data.md` 정합).
4. **ADR 0063 — NXT/통합거래 매트릭스 cover (PR #299 plan / #301 본격)** — 사용자 dogfooding "삼성전자·SK하이닉스 08:00 시작 20:00 마감" 의제 → A UN 통합 + 시간 1 08:00~20:00 명시 + threshold 350 → 700 채택. `KisRestCandleAdapter` 4 line revert(`fid_cond_mrkt_div_code="UN"` + 시작 hour `200000` + 종료 조건 `< 08:00 KST`) + `CandleBootstrapRunner` threshold 700 + 1m 720 bar/일 cover(KRX 정규장 390 → KRX+NXT 통합 720).
5. **ADR 0062 — 5m·15m·30m·90m·1h 합산 가공 plan (PR #298 plan / #300·#302·#303 본격 묶음)** — A-1 백엔드 precomputed + 옵션 2 과거 30 거래일 + 5종 활성화 채택. `domain/.../market/CandleAggregator.kt` 도메인 본체(Pure Kotlin, Spring·JPA 의존 0) + `consumer/.../market/AggregateBackfillRunner.kt` cold-start 시 1m 적재 직후 5m~1h 일괄 합산 + `ColdStartExecutor` 확장 + `DailyCloseFinalizer` 트리거 시각 16:00 → 20:00 KST 확장(NXT after-hour 마감) + frontend `IntervalToggle` 5종 활성화. DB candle 테이블 v3.2.2 적재 결과: **1m ~147k / 5m·15m·30m·90m·1h 합산 ~56k rows / 1d·1wk·1mo·1y ~4k rows**.
6. **6 hotfix 묶음 (사용자 dogfooding root cause 정정)**:
   - **PR #289·#290 (KIS WS 체결가 tick 등락 필드 forward)** — STOMP `/topic/symbol/{code}/tick` 단일 source 동기 표시 결함 정정(domain + consumer 1건)
   - **PR #292 (frontend 차트 캔들 페이지 합산 정렬 결함)** — `useInfiniteQuery` page 경계 ts 역행 hotfix
   - **PR #296·#297 (KIS 1m 분봉 결함 2건)** — (1) 페이지네이션 미흡 — 당일 전수 수집 보강 (2) `fid_fake_tick_incu_yn` 누락 fix + 500 backoff 보강
   - **PR #304 (FAILED 3 종목 정정)** — KOSDAQ market_div J 분기 + 거래정지/상장폐지 종목 skip 로직 추가
   - **PR #305 (KIS WS PINGPONG JSON false-positive)** — 구독 응답 success=false 로그 노이즈 정정

**v3.2.2 누적 ADR 60건** (v3.2.0 베이스 55건 + W3 T-BT 1건 0056 + 데이터 정책 3건 0057·0062·0063 + 1건 (자세한 인덱스는 `_workspace/arch/adr/README.md`). ADR 0019 supersede revoke(부분 — Yahoo 의존 부분만 보류·1m 합산 가공 트랙 완료 시 §2 재통합).

**MD 룰 정책 진화 추가 2건**: 사용자 메모리 보강 2건(`feedback_kis_first_policy.md`·`feedback_kis_key_realonly_for_data.md`) + KIS-first 정책 raw fetch 의무 강화 (모든 `fid_cond_mrkt_div_code`·threshold·시각 상수 결정 시 KIS open-trading-api raw URL 인용 의무).

**다음 Wave**: W3 본격 진입 — Backtest(T-BT 본격 데이터 적재 + 백테스트 실행 + 결과 영속) · Screener(T-SC) · Signal Engine(T-SIG) · Risk Guard(T-RISK) · Order Executor(T-O) · Reconciliation · Performance · Notification.

      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'");
    return '<pre class="mermaid">' + decoded + '</pre>';
  });

  document.getElementById('content').innerHTML = html;

  try {
    await mermaid.run({ querySelector: '.mermaid' });
