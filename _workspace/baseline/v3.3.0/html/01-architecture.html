<script id="md-source" type="text/markdown"># 01 — magicJar v3.3.0 아키텍처 (시각화)

> **작성자**: architect (PR-49)
> **시점**: 2026-05-12 v3.3.0 태그 컷 직후
> **권위**: `docs/architecture/master-architecture.md` v2 §5·§6 + ADR 0002·0004(5 모듈 보존)·0005·0006·0007·0008·0009·0019(부분 revoke 유지)·0028·0029·0048·0054·0055·0056·0057·0062·0063·**0064** 정합 + v3.3.0 시점 코드 inspection 결과

본 문서는 v3.3.0 시점 magicJar 시스템의 **시각화 가능 수준 그림**이다. SoT는 `docs/architecture/master-architecture.md`이며, 본 문서는 그 하위 구체화 — v3.3.0 시점 실체(현재 발행된 컨테이너·테이블·KIS endpoint·Kafka topic·Anthropic helper·v3.3.0 신규 컴포넌트 5건)만 인용한다. v1/v2 잔재 0건. 미발행 트랙(W3 일부·W4·W5)은 명시적으로 제외.

**v3.2.2 → v3.3.0 핵심 변경**:
- **Kafka 토픽 +5종**: `market.candle.{5m·15m·30m·90m·1h}.closed.v1` 신규 — boundary 마감 fanout 토픽 (ADR 0064 채택)
- **Redis 키 +5종**: `candle:current:{code}:{5m·15m·30m·90m·1h}` 5종 별도 hash 키 (A-1 채택 — ADR 0064 §4-4)
- **STOMP 토픽 +5종**: `/topic/market.candle.{interval}.{code}` 5종 fanout (C-1 채택 — ADR 0064 §4-5)
- **v3.3.0 신규 컴포넌트 5건**:
  - `BoundaryDetector` (domain, Pure Kotlin object — 44 unit test GREEN, Spring·JPA 의존 0)
  - `BoundaryAggregator` (consumer @Component — 1m closing → 5종 순차 처리 + 멱등 가드)
  - `RedisCandleCache` (consumer — 5종 별도 hash 키 + TTL 25h)
  - `KisWebSocketBridge` 확장 (H0STCNT0 tick 핸들러 boundary trigger 진입점은 1m closing 시점 — `TickToMinuteAggregator.onTickClosed` 호출이 진입점)
  - `CandleClosedStompListener` (api @Component — 5 KafkaListener → STOMP fanout)
- **v3.2.3 doc cut 정합 갱신**: ADR 0019·0028·0029 §2 매트릭스 NXT/합산 5종 row 보강 (PR #316)
- JVM 모듈 5 보존 (v3.2.0 base — domain·api·batch·consumer·pattern-engine)
- Flyway V11 보존 (마이그레이션 추가 0건 — boundary 합산 결과는 기존 candle 테이블의 5m~1h interval row 활용 — `ON CONFLICT (code, interval, ts) DO NOTHING` 멱등)

**범례**:
- 실선 화살표 — DB·Redis·Kafka inbound/outbound
- 점선 화살표 — 외부 HTTP/WS 호출 + pattern-engine library 의존(implementation) + domain port implements + 폐기된 Yahoo 더미 박스
- `domain`은 모든 JVM 모듈의 의존이지만 시각화 단순화를 위해 별도 박스 + port implements 점선만 표시
- `pattern-engine`은 라이브러리 jar(컨테이너 추가 0) — v3.3.0에서 변경 0
- **v3.3.0 boundary fanout 흐름 (Hot path)**: KIS WS H0STCNT0 → `KisWebSocketBridge` → `TickToMinuteAggregator` 1m closing → `BoundaryAggregator.onTickClosed` → (5종 순차) → DB 1m fetch + `CandleAggregator.aggregate` → `RedisCandleCache.putBoundary` + DB INSERT + Kafka `market.candle.{interval}.closed.v1` publish → api `CandleClosedStompListener` → STOMP `/topic/market.candle.{interval}.{code}` fanout → frontend `useSymbolCandles` STOMP 수신 → LWC `series.update()` 마지막 bar 갱신

**원칙**: 외부 4개(KIS REST·KIS WS·KIS 종목마스터 ZIP·DART·Anthropic) 중 어느 하나가 끊겨도 본체는 동작 — 영속 candle·Redis 캐시·정적 시드·last-day-close fallback (`master-architecture.md` §3-2). **Yahoo는 v3.2.2부터 의존 0** — `@Deprecated` 마킹만 잔존, v3.4.x minor 일괄 삭제(ADR 0057 §2-4 정합). Anthropic은 사용자 트리거 helper만이라 부재 시 MockDslHeuristic 9 패턴 fallback 또는 503 AI_DISABLED 응답(ADR 0023·0026·룰 5).

## §4. 영속 계층 (Flyway V1~V11 누적 — v3.2.2 보존 · v3.3.0 마이그레이션 0건)

`api/src/main/resources/db/migration/` 디렉토리. `api` 모듈 단독 적용 (`batch`·`consumer`·`pattern-engine`은 `flyway.enabled=false` — ADR 0006 정합).

### 4-1. 마이그레이션 시계열 (v3.2.2 보존 — v3.3.0 변경 0)

v3.2.2 baseline 01-architecture.md §4-1 그대로. V1~V11 11 마이그레이션 (v3.1.0 → v3.2.0 → v3.2.2 누적). v3.3.0에서 신규 마이그레이션 0건 발행.

**v3.3.0 마이그레이션 0건 사유** (ADR 0064 §4-5·§4-6 정합):
- boundary 합산 결과는 기존 `candle` 테이블의 5m~1h interval row 활용 (ADR 0062 §4-7 정합 — `interval` 컬럼이 `'5m','15m','30m','90m','1h'` 5종 모두 이미 허용)
- 멱등 보장 — `ON CONFLICT (code, interval, ts) DO NOTHING` (Flyway V11 UNIQUE constraint 정합)
- WS + polling 동시 trigger 시 race 가드 — DB UNIQUE + Redis SETNX 100ms lock 또는 Kafka partition by code (단일 thread 보장)

### 4-2. 모듈별 Flyway 운영 (v3.2.0 보존)

- `api` 모듈 — `flyway.enabled=true` (단독 책임, V1~V11 적용)
- `batch`·`consumer`·`pattern-engine` — `flyway.enabled=false`
- 부팅 순서 — `docker-compose.yml` `depends_on: api-app: { condition: service_healthy }` (batch·consumer는 api 모듈의 Flyway 적용 완료 후 시작)

-------------+-------------+-------------------
1m           | ~147,000    | 보존
5m           | ~21,500     | boundary fanout 시점 ON CONFLICT DO NOTHING (cold-start 결과와 중복 멱등) → 신규 INSERT는 장중 boundary 마감 시점만
15m          | ~9,000      | 동일

본 §7은 v3.3.0에서 신규 발행된 5 컴포넌트 상세. v3.2.2 baseline에는 부재.

### 7-1. `BoundaryDetector` (domain — Pure Kotlin object · ADR 0064 §4-1)

| 항목 | 값 | 출처 |
|------|----|----|
| 위치 | `domain/src/main/kotlin/kr/spdaewoon/magicjar/domain/candle/BoundaryDetector.kt` | PR #320 |

| 부가 API | `boundaryStartTs(ts: Instant, target: CandleInterval): Instant` — boundary 시작 ts 계산 | ADR 0064 §4-1 |
| 부가 API | `parseHhmmssToInstant(hhmmss: String, midnight: Instant): Instant` — KIS `STCK_CNTG_HOUR` (HHMMSS) 파싱 | KIS-first raw 출처 (H0STCNT0 ccnl_krx cols[1]) |
| boundary 시각 매트릭스 (NXT cover) | 5m=144 bar/일 · 15m=48 · 30m=24 · 90m=8 anchor (hardcoded set) · 1h=12 (08:00~20:00 KST) | ADR 0064 §4-2 |
| 단위 테스트 | **44 GREEN** (5m 마감/비마감 · 15m · 30m · 90m 8 anchor 전부 · 1h · NXT 범위 밖 · parseHhmmssToInstant · boundaryStartTs cover) | PR #320 |
| raw URL 주석 의무 | H0STCNT0 ccnl_krx cols[1]=STCK_CNTG_HOUR raw URL + `_workspace/baseline/v3.2.2/03-use-sequences.md §시나리오 3 R5` inline 주석 | 헌법 §3 KIS-first raw fetch |
| 경계 케이스 | NXT 범위 밖(08:00 이전·20:00 이후) skip · 같은 boundary 분 multiple tick 시 first-only 처리(in-process map) · DST 미해당(한국 표준시 단일) | ADR 0064 §4-2·§4-6 |

### 7-2. `BoundaryAggregator` (consumer — @Component · ADR 0064 §4-3 B-1)

| 항목 | 값 | 출처 |
|------|----|----|
| 위치 | `consumer/src/main/kotlin/kr/spdaewoon/magicjar/consumer/application/aggregation/BoundaryAggregator.kt` | PR #320 |
| 종류 | `@Component` (Spring) | ADR 0064 §4-1 |
| 트리거 진입점 | `onTickClosed(code: String, closingTs: Instant)` — `TickToMinuteAggregator` 1m closing 완료 직후 호출 (B-1 trigger) | ADR 0064 §4-3 |
| 처리 흐름 | (1) `BoundaryDetector.isBoundaryClosed(closingTs, target)` 5 interval 순차 검사 → (2) DB 1m fetch (boundary 내 N건) → (3) `CandleAggregator.aggregate(rows, target)` (Pure Kotlin) → (4) `RedisCandleCache.putBoundaryCandle(code, target, candle)` → (5) DB `insertIgnore` (ON CONFLICT DO NOTHING) → (6) Kafka publish `market.candle.{interval}.closed.v1` | ADR 0064 §4-3 |
| 멱등 가드 | (a) in-process `ConcurrentHashMap<Pair<code, interval>, LocalDate>` `lastProcessedBoundaryMin` — 같은 (code, interval, date)는 1회만 처리 (b) DB `ON CONFLICT (code, interval, ts) DO NOTHING` — race 안전 | ADR 0064 §4-6 |
| 5 interval 순차 처리 사유 | race 회피 + 동일 boundary ts 도달 시 (예: 09:30 → 5m·15m·30m 동시 trigger) 1m fetch 1회로 압축 | ADR 0064 §4-3 |
