## 1. 모듈 의존성 매트릭스

### 1-1. JVM 5 모듈 구성

```
settings.gradle.kts include:
  domain
  pattern-engine
  api
  batch
  consumer
```

| 모듈 | Spring 의존 | JPA 의존 | 역할 |
|------|------------|---------|------|
| `domain` | 0 | 0 | 순수 도메인 + 포트 인터페이스 (Spring·JPA 0 — 헥사고날 내부 링) |
| `pattern-engine` | 0 | 0 | 캔들스틱 패턴 57종 인식 (Pure Kotlin — ADR 0054) |
| `api` | Spring Boot 3.3 | JPA (Hibernate 6) | REST/STOMP + KIS REST 어댑터 + Kafka producer |
| `batch` | Spring Boot 3.3 + Spring Batch | JPA | 종목 마스터 sync + 기업 행위 처리 잡 |
| `consumer` | Spring Boot 3.3 | JPA | Kafka 소비 + KIS WS 브릿지 + 시그널·주문 dispatch |

### 1-2. 모듈 간 의존 방향

```
domain ←── api
domain ←── consumer
domain ←── batch
pattern-engine ←── api
(domain ← pattern-engine : PatternRecognizer port 참조)
```

- `domain`은 어떤 모듈에도 의존하지 않음 (Spring·JPA import 0건 강제)
- `api`/`consumer`/`batch`는 `domain` 포트 인터페이스를 구현하는 어댑터 배치
- `pattern-engine`은 `domain`의 `PatternRecognizer` 포트 구현체 (`JvmPatternRecognizer`)

### 1-3. v3.3.0 신규 컴포넌트 위치

| 컴포넌트 | 모듈 | 패키지 경로 | ADR 근거 |
|---------|------|-----------|---------|
| `BoundaryDetector` | `domain` | `domain/.../market/BoundaryDetector.kt` | ADR 0064 §4-1 — Pure Kotlin object, Spring 의존 0 |
| `BoundaryAggregator` | `consumer` | `consumer/.../aggregation/BoundaryAggregator.kt` | ADR 0064 §4-1 — @Component, B-1 in-process trigger |
| `RedisCandleCache` | `consumer` | `consumer/.../cache/RedisCandleCache.kt` | ADR 0064 A-1 — 5종 별도 Redis hash 키 |
| `StompCandleForwarder` / `CandleClosedStompListener` | `api` | `api/.../messaging/CandleClosedStompListener.kt` | ADR 0064 C-1 — 5종 별도 STOMP 토픽 fanout |

## 3. consumer 모듈 데이터 흐름

### 3-1. Kafka 토픽 소비 매트릭스

| 토픽 | 리스너 클래스 | groupId | 처리 내용 |
|------|------------|---------|----------|
| `watchlist.changed.v1` | `WatchlistChangedKafkaListener` | `magicjar-consumer-watchlist-ingestion` | ADDED: cold-start 트리거 + WS/polling 구독 / REMOVED: 구독 해제 + Redis evict |
| `symbol.detail.command.v1` | `SymbolDetailCommandKafkaListener` | `magicjar-consumer-orderbook-cmd` | ENTER: H0STASP0 구독 slot 할당 / EXIT: slot 회수 |

### 3-2. KIS WS 브릿지 흐름

```
KIS WebSocket (wss://ops.koreainvestment.com:21000)
    ↓  H0STCNT0 (체결가 tick)
KisWebSocketBridge
    ├── writeToRedis(quote:last:{code}, 등락 필드 포함)   ← ADR 0029
    ├── publishTickEvent → Kafka market.tick.v1
    └── [v3.3.0 신규] STCK_CNTG_HOUR 추출 → BoundaryAggregator.onTick(code, hhmmss)
           ↓  (ADR 0064 B-1 in-process 검사 — §4-3)
    BoundaryDetector.detectBoundary(hhmmss) → List<CandleInterval>

    KIS WebSocket
    ↓  H0STASP0 (호가 스냅샷)
KisWebSocketBridge
    └── publishOrderbook → Kafka market.orderbook.v1

    KIS WebSocket
    ↓  PINGPONG JSON {"header":{"tr_id":"PINGPONG",...}}
KisWebSocketBridge
    └── echo (원본 raw 그대로 — KIS raw 정합)
```

KIS-first raw 출처 (ADR 0064 §1-4 의무 인용):
- H0STCNT0 `ccnl_krx()` 44 cols — `[1]` STCK_CNTG_HOUR (체결시각 HHMMSS): `examples_user/domestic_stock/domestic_stock_functions_ws.py`
- v3.2.2 baseline `_workspace/baseline/v3.2.2/03-use-sequences.md` §시나리오 3 R5 인용

### 3-3. TickToMinuteAggregator 흐름

```
Kafka market.tick.v1
    ↓
TickToMinuteAggregator
    ├── 1분 boundary 마감 시 → CandleRepository.saveAll (interval=1m)
    ├── Kafka market.candle.minute.closed.v1 발행
    └── [v3.3.0 신규] 1m closing 완료 직후 → BoundaryAggregator.onTickClosed(code, closingTs)
              ↓  (ADR 0064 B-1 trigger — TickToMinuteAggregator 확장)
         BoundaryAggregator → 5m·15m·30m·90m·1h 경계 검사 → 합산 갱신
```

### 3-4. BoundaryAggregator 흐름 (v3.3.0 신규 — ADR 0064 §4-3)

```
BoundaryAggregator.onTickClosed(code, tickTs)
    ↓
BoundaryDetector.detectBoundary(hhmmss) → List<CandleInterval>
    ↓
boundary 도달 시 (예: 09:05:00 → [5m]) interval별 순차 처리:
    FOR target IN detected:
        1. in-process 중복 가드 (lastProcessedBoundaryMin ConcurrentHashMap)
           → 같은 (code, interval, date) 1회만 처리
        2. DB에서 직전 N건 1m 캔들 fetch
           - 5m  → 직전 5건 1m
           - 15m → 직전 15건 1m
           - 30m → 직전 30건 1m
           - 90m → 직전 90건 1m
           - 1h  → 직전 60건 1m
        3. CandleAggregator.aggregate(rows, target) → Candle (Pure Kotlin, domain)
        4. RedisCandleCache.putBoundaryCandle(code, target, candle)
           → Redis candle:current:{code}:{target} (hash, TTL 25h)
        5. DB candle table INSERT (ON CONFLICT DO NOTHING — 멱등)
        6. Kafka publish market.candle.{target}.closed.v1
           → CandleClosedStompListener (api) → /topic/market.candle.{target}.{code}
```

멱등 가드 이중 보장:
- in-process: `lastProcessedBoundaryMin: ConcurrentHashMap<Pair<String, CandleInterval>, LocalDate>` — 같은 분 boundary 재진입 차단
- DB: `ON CONFLICT DO NOTHING` (Flyway UNIQUE constraint code+interval+ts — ADR 0019 정합)

### 3-5. cold-start 흐름 (ColdStartExecutor)

```
WatchlistChangedKafkaListener (ADDED)
    ↓  DB count 0이면 cold-start submit
ColdStartExecutor (thread pool=2, cold-start-N)
    ├── KIS REST FHKST03010230 → 1m (30 거래일, prod credential)
    ├── KIS REST FHKST03010100 → 1d (200건)
    ├── KIS REST FHKST03010100 → 1wk (200건)
    ├── KIS REST FHKST03010100 → 1mo (120건)
    └── KIS REST FHKST03010100 → 1y (10건)
         ↓  1m 적재 완료 직후
    AggregateBackfillRunner.backfill(code)
         ├── CandleRepository.findByCodeAndInterval(1m) → 전체 1m 조회
         ├── CandleAggregator.aggregate(5m·15m·30m·90m·1h)
         └── CandleRepository.saveAll (ON CONFLICT DO NOTHING)
    audit: KIS_COLD_START_DONE / KIS_COLD_START_PARTIAL_FAIL / KIS_COLD_START_FAILED
```

### 3-6. consumer 부팅 시 bootstrap 흐름

```
CandleBootstrapRunner (@ApplicationReadyEvent)
    ↓  watchlist 전 종목 순회
    ├── count(1m) < 700 (MIN_1M_CANDLE_THRESHOLD — ADR 0063 NXT 720건/일 기준)
    │       → ColdStartExecutor.submit(code) (1m + 합산 backfill)
    └── count(5m) == 0 && count(1m) >= 700
            → AggregateBackfillRunner.backfill(code) (합산만)

PositionBootstrapRunner (@ApplicationReadyEvent)
    └── KIS REST balance → Position DB 동기화
```

### 3-7. DailyCloseFinalizer (스케줄)

```
20:00 KST (NXT after-hour 마감 — ADR 0063 정합, 구 16:00 KST에서 변경)
    ↓
DailyCloseFinalizer
    ├── watchlist 전 종목 순회
    ├── AggregateBackfillRunner.backfill(code) — 당일 합산 갱신 (safety net)
    └── Redis candle:current:{code}:5m·15m·30m·90m·1h evict
        (BoundaryAggregator가 boundary마다 갱신 → 20:00 flush는 fallback 역할)
```

## 5. Redis 키 매트릭스 (ADR 0029 + ADR 0064 A-1 정합)

### 5-1. 기존 키 (v3.2.2 이월)

| Redis 키 패턴 | 데이터 | 갱신 | TTL |

| `candle:current:{code}:1m` | 당일 진행 중 1분봉 | KIS WS tick / 1분 closing 시 evict | 1분 closing 시 evict |
| `candle:today:{code}:1d` | 당일 일봉 진행 중 | DailyCloseFinalizer | 당일 마감 evict |
| `indicator:cache:{code}:{interval}:{name}:{paramsHash}` | 기술적 지표 결과 JSON | IndicatorService 계산 후 | 분봉: 300s / 일봉+: 86400s |
| `pattern:cache:{code}:{interval}:{...}` | 패턴 인식 결과 JSON | PatternController 조회 후 | 분봉: 300s / 일봉+: 86400s |
| `watchlist:source:{userId}` | 종목별 data source (WS·polling) 매트릭스 | SubscriptionRouter | — |
| `instrument:search:idx` | 종목 검색 인덱스 (Sorted Set) | InstrumentSyncJob | — |

### 5-2. v3.3.0 신규 키 (ADR 0064 A-1 채택 — 5종 별도 Redis hash 키)

| Redis 키 패턴 | 데이터 | 갱신 주기 | TTL/evict |
|--------------|-------|---------|---------|
| `candle:current:{code}:5m` | 당일 진행 중 5m bar (NXT 144 bar/일) | 5m boundary 마감 시 1m 5건 합산 | 5분 closing 시 evict + 20:00 flush (TTL 25h) |
| `candle:current:{code}:15m` | 당일 진행 중 15m bar (NXT 48 bar/일) | 15m boundary 마감 시 1m 15건 합산 | 15분 closing 시 evict + 20:00 flush (TTL 25h) |
| `candle:current:{code}:30m` | 당일 진행 중 30m bar (NXT 24 bar/일) | 30m boundary 마감 시 1m 30건 합산 | 30분 closing 시 evict + 20:00 flush (TTL 25h) |
| `candle:current:{code}:90m` | 당일 진행 중 90m bar (NXT 8 bar/일) | 90m boundary 마감 시 1m 90건 합산 | 90분 closing 시 evict + 20:00 flush (TTL 25h) |
| `candle:current:{code}:1h` | 당일 진행 중 1h bar (NXT 12 bar/일) | 60m boundary 마감 시 1m 60건 합산 | 1시간 closing 시 evict + 20:00 flush (TTL 25h) |
