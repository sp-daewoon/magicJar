<script id="md-source" type="text/markdown"># magicJar v3.3.0 Baseline — 05. UI 화면 인벤토리

> **작성 시점**: 2026-05-12 v3.3.0 태그 컷
> **작성 에이전트**: frontend
> **커버 PR 범위**: PR-5b ~ PR-49 (v3.2.2 전체 + v3.3.0 ADR 0064 §2-C STOMP 5종 boundary subscribe + LWC series.update 실시간 갱신 — PR #321)

## 1. 라우팅 매트릭스

| URL 패턴 | 페이지 컴포넌트 | 진입 가드 | 트랙 ID | ADR |
|---------|--------------|---------|--------|-----|
| `/` | `DashboardPlaceholder` | OnboardingGuard | T-W1 | ADR 0040 |
| `/watchlist` | `WatchlistPage` | OnboardingGuard | T-W1 | ADR 0040 |
| `/symbol/:code` | `SymbolDetailPage` | OnboardingGuard | T-S1 | ADR 0040 §2-2 |
| `/strategy/builder` | `StrategyBuilderPage` | OnboardingGuard | T-SB | ADR 0040 §1, ADR 0055 |
| `/setup` | `SetupWizard` | OnboardingGuard (역방향) | T-ONBOARD | ADR 0040 |
| `*` | `Navigate to="/"` | — | — | — |

### 4-4. SymbolDetailPage (`/symbol/:code`)

**파일**: `frontend/src/pages/Symbol/SymbolDetailPage.tsx`

#### 하위 컴포넌트 매트릭스

| 컴포넌트 | 파일 | 역할 |
|---------|------|------|
| `SymbolHeader` | `SymbolHeader.tsx` | 종목명·코드·시장·산업 + 뒤로 이동 버튼 |
| `SymbolPriceCard` | `SymbolPriceCard.tsx` | 현재가·등락·등락률 + 고·저·시·전일종가·거래량 + stale 배지 |
| `SymbolMetaCard` | `SymbolMetaCard.tsx` | PER·PBR·EPS·BPS·시가총액 |
| `SymbolChart` | `SymbolChart.tsx` | IntervalToggle + LWC 차트 + 지표·패턴 패널 |
| `SymbolOrderbook` | `SymbolOrderbook.tsx` | 매수·매도 10단계 호가표 |
| `SymbolError` | `SymbolError.tsx` | 에러 분기 표시 (404·503·상장폐지) |

#### 레이아웃 구조 (desktop lg)

```
┌─ AppHeader ──────────────────────────────────────────────────┐
├─ SymbolHeader (종목명·코드·뒤로) ──────────────────────────────┤
├─ STOMP 연결 상태 배지 (끊김 시만 표시) ──────────────────────────┤
├── 3 열 그리드 (lg:grid-cols-3) ─────────────────────────────── ┤
│   좌 (1열): SymbolPriceCard + SymbolMetaCard                  │
│   우 (2열): SymbolChart                                       │
├── SymbolOrderbook (전폭) ────────────────────────────────────┤
└──────────────────────────────────────────────────────────────┘
```

#### SymbolPriceCard 상태 배지

| 배지 | 조건 | 색상 |
|-----|------|------|
| 실시간 | `asOf` 30초 이내 | 녹색(green-400) pulse |
| 지연 데이터 | polling + 장 중 | 노랑(yellow-400) |
| 장 마감 | polling/closed + 장외 | 회색(gray-500) |

**등락 색상 정책** (한국 주식 관례):
- `changeSign` 1·2 (상한·상승) → `text-red-400`
- `changeSign` 3 (보합) → `text-gray-300`
- `changeSign` 4·5 (하한·하락) → `text-blue-400`
- null fallback: `change` 숫자값 기반 분기

**STOMP 토픽 구독** (stompEnabled = `Boolean(code) && !isDelisted`):

| 토픽 | 용도 |
|-----|------|
| `/topic/market.tick.{code}` | 현재가·등락·등락률 실시간 갱신 |
| `/topic/market.candle.minute.{code}` | 1m 차트 실시간 append |
| `/topic/market.orderbook.{code}` | 호가 10단계 실시간 갱신 |

**호가 slot 라이프사이클** (ADR 0048 LRU 10):
- mount `+200ms` → `POST /api/symbols/{code}/orderbook/subscribe`
- unmount → `navigator.sendBeacon('/api/symbols/{code}/orderbook/unsubscribe')` + REST fallback

**graceful 처리 매트릭스**:

| 상황 | 처리 |
|------|------|
| HTTP 503/404 | SymbolError 표시 |
| candle 0건 cold-start | "데이터 수집 중" skeleton + 안내 |
| 합산 인터벌 0건 (ADR 0062) | "X봉 합산 데이터 준비 중" 전용 안내 |
| STOMP 끊김 | 노랑 배지 + 5s polling fallback |
| instrument 테이블 부재 | code 그대로 표시 (SymbolHeader graceful) |
| 상장폐지 종목 | SymbolError variant="delisted" — 가격·차트·호가 진입 차단 |
| 호가 slot queued | "polling fallback 중" 배지 |

#### SymbolChart realtime 우선 로직 (v3.3.0 신규)

**파일**: `frontend/src/pages/Symbol/SymbolChart.tsx`

`realtimeCandleDto` useMemo 우선 순위:

1. **boundary closed candle (최우선)** — `latestBoundaryCandle` non-null → `CandleClosedPayload`를 `CandleDto`로 변환 (ADR 0064 §2-C)
2. **1m minute candle** — `realtimeCandle` non-null + `interval === '1m'` → `CandleMinutePayload`를 `CandleDto`로 변환 (ADR 0029 §2-3)

```
latestBoundaryCandle  →  CandleDto  →  LightweightChart.realtimeCandle prop  →  candleSeries.update()
realtimeCandle(1m)    →  CandleDto  →  (동일 경로)
```

AGGREGATED_INTERVALS 상수: `Set<CandleInterval>(['5m', '15m', '30m', '90m', '1h'])`

"실시간 갱신 중" 배지: `AGGREGATED_INTERVALS.has(interval) && allCandles.length > 0` 조건 — 우측 상단 emerald-400 pulse dot

## 9. 실시간 boundary fanout 흐름 (v3.3.0 신규)

```mermaid
sequenceDiagram
    participant KisWS as KIS WS (H0STCNT0)
    participant Bridge as KisWebSocketBridge
    participant Agg as BoundaryAggregator
    participant Kafka as Kafka market.candle.{interval}.closed.v1
    participant Listener as CandleClosedStompListener
    participant STOMP as STOMP /topic/market.candle.{interval}.{code}
    participant Hook as useSymbolCandles
    participant Chart as LightweightChart

    KisWS->>Bridge: 체결 tick H0STCNT0
    Bridge->>Agg: onTickClosed(code, closingTs)
    Note over Agg: BoundaryDetector.isBoundaryClosed(ts, 5m/15m/30m/90m/1h) 검사
    Agg->>Agg: DB 1m fetch (boundary 내) → CandleAggregator.aggregate
    Agg->>Agg: Redis candle:current:{code}:{interval} put
    Agg->>Kafka: publish CandleClosedEvent
    Kafka->>Listener: @KafkaListener (5종 토픽)
    Listener->>STOMP: StompMessagingTemplate.convertAndSend
    STOMP->>Hook: useStompTopic 수신 → setLatestBoundaryCandle
    Hook->>Chart: realtimeCandle prop 전달
    Chart->>Chart: candleSeries.update(cd) + volumeSeries.update(vd)
    Note over Chart: latency < 50ms (dogfooding 측정 — PR #321)
```

**ADR 0064 §2-C 정합**: 5종 별도 STOMP 토픽 (C-1 채택) — frontend network 절약 + 운영 visibility

**interval 전환 시 재구독 흐름**:

```mermaid
sequenceDiagram
    participant User as 사용자
    participant Toggle as IntervalToggle
    participant Chart as SymbolChart
    participant Hook as useSymbolCandles
    participant STOMP as STOMP Client

    User->>Toggle: [5분] 클릭
    Toggle->>Chart: setInterval('5m')
    Chart->>Hook: useSymbolCandles(code, '5m')
    Note over Hook: isBoundaryInterval('5m') = true
    Hook->>STOMP: SUBSCRIBE /topic/market.candle.5m.{code}
    Note over Hook: prevIntervalRef 갱신 + latestBoundaryCandle null 초기화

    User->>Toggle: [15분] 클릭
    Toggle->>Chart: setInterval('15m')
    Chart->>Hook: useSymbolCandles(code, '15m')
    Note over Hook: 기존 5m 구독 useStompTopic cleanup 자동 해제
    Hook->>STOMP: SUBSCRIBE /topic/market.candle.15m.{code}

    User->>Toggle: [일] 클릭
    Toggle->>Chart: setInterval('1d')
    Chart->>Hook: useSymbolCandles(code, '1d')
    Note over Hook: isBoundaryInterval('1d') = false → enabled=false → 구독 없음
```

      .replace(/&#39;/g, "'");
    return '<pre class="mermaid">' + decoded + '</pre>';
  });

  document.getElementById('content').innerHTML = html;

  // mermaid 렌더링
  try {
    await mermaid.run({ querySelector: '.mermaid' });
  } catch (e) {
    console.error('mermaid render error:', e);
  }
})();
</script>
</body>
</html>
