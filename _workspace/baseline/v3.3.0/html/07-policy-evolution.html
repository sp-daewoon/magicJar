## §1. ADR 0064 — Redis boundary fanout + STOMP 실시간 합산 갱신 (5m·15m·30m·90m·1h)

### 도입 전

v3.2.2 baseline 시점 5m·15m·30m·90m·1h 합산 가공(ADR 0062 채택)은 두 가지 트리거에서만 갱신:
- **cold-start 시점** — `AggregateBackfillRunner.backfill(code)` 호출 시 1m 전량 → 5m·15m·30m·90m·1h DB INSERT (ON CONFLICT DO NOTHING 멱등)
- **장 마감 20:00 KST** — `DailyCloseFinalizer.flushAggregations()` watchlist 전 종목 당일 누적분 합산 갱신

**장중 boundary 마감 시점(예: 09:05·09:10·09:15·09:30) 실시간 갱신 — 미구현 (현재 결함)**:
- KIS WS H0STCNT0 체결 수신 핸들러(`KisWebSocketBridge`)가 1m closing은 처리하지만 5m·15m·30m·90m·1h boundary 도달 시점 합산 갱신 0건
- 사용자가 SymbolDetail 페이지에서 5m 차트 진입 시 09:00~09:04:59에는 `candle:current:{code}:5m` 키 부재 → 5m 차트 마지막 bar는 어제 종가 마감 bar
- 09:05 boundary 도달 — KIS WS H0STCNT0 체결 수신 + 1m boundary closing은 처리되나 5m 합산 갱신 0건 → 5m 차트 stale
- 20:00 DailyCloseFinalizer 마감 후 첫 다음 영업일에야 5m bar 정합

자동매매 본체 정합 영향:
- **T-SIG (Signal Engine, ADR 0023)** — 5m·15m 인터벌 룰 평가 시 stale data → 시그널 latency 5분~수 시간 (boundary 마감 ~ 20:00 flush)
- **T-DSL (Strategy DSL, ADR 0022)** — 5m·30m 인터벌 조건식 평가 시 동일 결함
- **MCP 외부 client (ADR 0027)** — 외부 client가 장중 5m 데이터 요청 시 stale 응답

ADR 0029 §2-5 (v3.2.3 doc cut 갱신):
> "**v3.3.0 §34 작업 가이드 — boundary fanout 토픽 5종 추가 (별도 사이클)**: `/topic/market.candle.5m.{code}` 등 5종 토픽 신규."

ADR 0062 §4-3 (Accepted 본문):
> "5m·15m·30m·90m·1h boundary closing → 직전 1m N건 fetch → CandleAggregator.aggregate(1m, target) → Redis candle:current:{code}:{target} 갱신 → candle table INSERT → Redis publish market.candle.{target}.closed.v1 → STOMP fanout."

→ 두 ADR이 v3.3.0 §34 사이클에서 boundary 마감 코드 trigger + STOMP fanout 구현이 LOCK 필요한 baseline을 가리킨다.

### 도입 후

ADR 0064 (PR #318 plan + PR #319 Accepted + PR #320 본격 + PR #321 frontend) — A-1 5종 별도 Redis hash 키 + B-1 KIS WS in-process boundary 검사 + C-1 5종 별도 STOMP 토픽 채택:

**의제 A Redis 키 매트릭스**: A-1 5종 별도 hash 키 채택 — `candle:current:{code}:5m` · `:15m` · `:30m` · `:90m` · `:1h` 각각 hash. ADR 0029 §2-1 매트릭스 baseline 정합 + invalidation 단순 + DEBUG visibility(`redis-cli HGETALL candle:current:005930:5m` 직관) + 메모리 부담 미미(11 KB).

**의제 B boundary 마감 트리거**: B-1 KIS WS H0STCNT0 체결 핸들러 in-process 검사 채택 — `TickToMinuteAggregator` 1m closing 완료 직후 `boundaryAggregator.onTickClosed(code, closingTs)` 호출 (trigger 진입점). latency 최소(<50ms 측정) + 추가 컴포넌트 0 + 멱등 가드 이중(in-process `ConcurrentHashMap<Pair<code, interval>, LocalDate>` `lastProcessedBoundaryMin` + DB ON CONFLICT DO NOTHING).

**의제 C STOMP fanout 토픽**: C-1 5종 별도 토픽 채택 — `/topic/market.candle.5m.{code}` · `.15m.` · `.30m.` · `.90m.` · `.1h.`. frontend network 효율(사용자가 5m 차트 보면 5m 토픽만 subscribe) + ADR 0029 §2-5 baseline 정합 + 운영 visibility + 5종 boundary 시각 매트릭스 명확(5m=144/일 · 15m=48 · 30m=24 · 90m=8 · 1h=12).

**`BoundaryDetector` 도메인 본체** (`domain/.../candle/BoundaryDetector.kt`, PR #320):
- Pure Kotlin object · Spring·JPA 의존 0
- 핵심 API `isBoundaryClosed(ts: Instant, target: CandleInterval): Boolean`
- 부가 API `boundaryStartTs(ts, target)` + `parseHhmmssToInstant(hhmmss, midnight)` (KIS-first raw 출처 H0STCNT0 ccnl_krx cols[1])
- 단위 테스트 **44건 GREEN** (5m 마감/비마감 · 15m · 30m · 90m 8 anchor 전부 · 1h · NXT 범위 밖 · parseHhmmssToInstant · boundaryStartTs cover)

**`BoundaryAggregator`** (`consumer/.../aggregation/BoundaryAggregator.kt`, PR #320):
- `@Component` (Spring)
- 트리거 진입점 `onTickClosed(code, closingTs)` (B-1)
- 5 interval 순차 처리 (race 회피 + 동일 boundary ts 도달 시 1m fetch 1회 압축)
- 멱등 가드 이중 (in-process map + DB ON CONFLICT DO NOTHING)
- KIS REST 추가 호출 0건 (직전 1m N건은 Redis/DB local fetch)

**`RedisCandleCache`** (`consumer/.../cache/RedisCandleCache.kt`, PR #320):
- `@Component` (Spring + `StringRedisTemplate`)
- 5종 별도 hash 키 + TTL 25h
- `putBoundaryCandle/getBoundaryCandle/evictBoundaryCandle` API

**`CandleClosedStompListener`** (`api/.../messaging/CandleClosedStompListener.kt`, PR #320):
- `@Component` (Spring) — 5 `@KafkaListener`
- Kafka `market.candle.{interval}.closed.v1` 5종 → STOMP `/topic/market.candle.{interval}.{code}` fanout

**Kafka 5 토픽** (`consumer/.../config/KafkaTopicConfig.kt`, PR #320):
- `market.candle.{5m·15m·30m·90m·1h}.closed.v1` retention 1d

**frontend STOMP 5종 dynamic subscribe** (PR #321):
- `useSymbolCandles.ts` IntervalToggle 선택값 정합 dynamic subscribe/unsubscribe
- LWC v4 `series.update()` boundary 메시지 수신 시 마지막 bar 실시간 갱신
- dogfooding evidence E2E 검증(09:05 boundary 도달 → KIS WS tick → BoundaryAggregator → STOMP fanout → LWC update latency <50ms 측정)

**fitness gap 분석 (ADR 0064 §3)**:
- **자동매매에 필요한가? — 필요** — 5m·15m 실시간 시그널 엔진(T-SIG) 본질 입력 결정적
- **v1/v2 잔재 아닌가? — 잔재 아님** — ADR 0029 §2-5는 v3.x baseline · ADR 0062 §4-3는 2026-05-11 채택. 본 ADR이 그 신규 baseline의 boundary 마감 코드 trigger를 LOCK
- **회귀 risk 검증** — 1m closing 흐름 변경 0 · DailyCloseFinalizer flush와 orthogonal · cold-start AggregateBackfillRunner와 멱등 결합 (ON CONFLICT DO NOTHING)
- **사용자 비전 정합** — magicJar = 룰 기반 quant trading 본체 (5m·15m 실시간 시그널이 매매 결정 근거) · AI는 옵션 보조 (룰 5 정합 — 본 ADR LLM provider import 0건) · MCP 서버 노출 (외부 client 장중 fresh 응답)

### 효과

- **장중 5m·15m·30m·90m·1h boundary 마감 시 실시간 차트 갱신** — 사용자 dogfooding 결함 해소
- **T-SIG (Signal Engine) 실시간 시그널 본질 충족** — 5m·15m 룰 평가 latency <50ms
- **T-DSL 인터벌 조건식 정합** — 30m·90m DSL 평가 stale 0
- **MCP 외부 client 정합** — 장중 5m~1h interval 요청 fresh 응답 가능 baseline
- **KIS REST 추가 호출 0건** — Rate Limit 영향 0
- **Redis 메모리 +11 KB** — 미미
- **STOMP 메시지 부하 +33% (0.06 msg/s 추가)** — 매우 가벼움 (1m closing 7,920/일 대비)
- **DailyCloseFinalizer 20:00 flush는 safety net 역할 유지** — boundary 누락 시 fallback
- **end-to-end latency <50ms 측정** — 사용자 체감 1초 이내

- **PR #318** (architect plan) — ADR 0064 plan 발행 (Status `Proposed`, 사용자 결정 의제 3건 대기)
- **PR #319** (architect Accepted) — ADR 0064 Proposed → Accepted (사용자 A-1·B-1·C-1 채택)
- **PR #320** (market-data 본격) — domain BoundaryDetector + consumer BoundaryAggregator·RedisCandleCache·TickToMinuteAggregator 확장·KafkaTopicConfig 5 토픽 + api CandleClosedStompListener
- **PR #321** (frontend 본격) — useSymbolCandles STOMP 5종 dynamic subscribe + LWC series.update 실시간 갱신 + dogfooding evidence E2E 검증

## §2. v3.2.3 minor doc cut — ADR 0019·0028·0029 §2 매트릭스 NXT/합산 5종 보강 + KIS 500 retry 3회

### 도입 전

v3.2.2 baseline 시점 운영 자료 정합 두 가지 결함:

**(a) ADR 본문 매트릭스 갱신 보류**:
- ADR 0019 §2-1 매트릭스 — NXT 시각 행 + 5m~1h 합산 행 row 미반영 (v3.2.2 시점 ADR 0062·0063 채택 직후 architect 사이클 보류 — v3.2.2 baseline 06-history-traceability.md §3 정합)
- ADR 0028 §2-1·§2-3 cold-start 흐름 — `KOSPI=UN·KOSDAQ=J` 분기 + `AggregateBackfillRunner.backfill(code)` 호출 트리거 + halt/liquidation `KIS_COLD_START_SKIPPED` audit 명시 미반영
- ADR 0029 §2-1 Redis 키 매트릭스 — 5m·15m·30m·90m·1h boundary 캐시 키 5건 row 미추가 (v3.3.0 §34 미러스톤 baseline 부재)
- `external-api-policy.md` §2-5 — KIS 단일 출처 매트릭스 + NXT 매트릭스 부재
- `candle-data-policy-v2.md` — §1·§3 매트릭스 5m~1h 백엔드 precomputed + §6·§7 cold-start NXT 통합 + §8 신규 컴포넌트 6건 미반영

→ 운영 자료가 ADR 0057·0062·0063 채택 후 baseline 변경을 따라가지 못함. v3.3.0 §34 미러스톤 진입 전에 baseline 매트릭스 정합 갱신 의제 발생.
