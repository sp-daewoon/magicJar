<script id="md-source" type="text/markdown"># 01 — magicJar v3.4.0 아키텍처 (시각화)

> **작성자**: architect (PR-51)
> **시점**: 2026-05-12 v3.4.0 태그 컷 직후 (release commit `8b3b456`)
> **권위**: `docs/architecture/master-architecture.md` v2 §5·§6 + ADR 0002·0004(5 모듈 보존)·0005·0006·0007·0008·0009·0019(부분 revoke 유지)·0023(Signal Engine 룰 매칭 only)·0028·0029·0044·0045·0047·0048·0054·0055·0056·0057·0061·0062·0063·0064·**0066** 정합 + ~~0049(Superseded)~~ + v3.4.0 시점 코드 inspection 결과

본 문서는 v3.4.0 시점 magicJar 시스템의 **시각화 가능 수준 그림**이다. SoT는 `docs/architecture/master-architecture.md`이며, 본 문서는 그 하위 구체화 — v3.4.0 시점 실체(현재 발행된 컨테이너·테이블·KIS endpoint·Kafka topic·STOMP 토픽·v3.4.0 신규 컴포넌트 12건)만 인용한다. v1/v2 잔재 0건. 미발행 트랙(W3 잔여·W4·W5)은 명시적으로 제외.

**v3.3.0 → v3.4.0 핵심 변경**:
- **Flyway +4건**: V12·V13(T-BT 영속 3 테이블) + V14·V15(T-SIG strategy·signal)
- **Kafka 토픽 +1종**: `signal.generated.v1` 신규 — T-SIG 시그널 발행 audit 토픽 (T-O·T-RISK 후행 트랙 진입점, ADR 0066 §9-2)
- **STOMP 토픽 +1종**: `/topic/signal.user.{userId}` (D-1 채택, ADR 0066 §4-D)
- **Redis namespace +2종**: `strategy:active:by_code:{code}:{interval}` cache + `signal:dedupe:{strategyId}:{code}:{interval}:{ts}` SETNX 30s
- **REST endpoint +13건**: T-BT 5건(POST·GET list·GET detail·GET result·DELETE) + T-SIG Strategy 6건(POST·GET list·GET detail·PUT toggle·PUT reactivate·DELETE) + T-SIG Signal 2건(GET list·GET detail)
- **frontend 라우트 +2건**: `/strategy/list`·`/strategy/backtest`
- **v3.4.0 신규 컴포넌트 12건**:
  - **T-BT R2 영속 (ADR 0061)**: `BacktestPersister`·`BacktestQueryService`·`BacktestController` (api)
  - **T-SIG (ADR 0066)**: domain `Signal`+`SignalSide`+`SignalContext`+`SignalGenerator` port + `Strategy` 확장 + `RealtimeSignalGenerator`·`BoundaryClosingKafkaListener` 5건·`SignalDedupeGuard`·`SignalKafkaProducer` (consumer) + `RedisStrategyCache`·`StompSignalDispatcher`·`StrategyController`·`SignalController` (api)
- **GHA 폐기**: `.github/workflows/release.yml` 삭제 (PR #340) + ADR 0049 Superseded (PR #341, 사용자 메모리 `feedback_no_github_actions.md` 정합)
- JVM 모듈 5 보존 (v3.2.0 base — domain·api·batch·consumer·pattern-engine)

**범례**:
- 실선 화살표 — DB·Redis·Kafka inbound/outbound
- 점선 화살표 — 외부 HTTP/WS 호출 + pattern-engine library 의존(implementation) + domain port implements + 폐기된 Yahoo 더미 박스 + Redis cache lookup
- `domain`은 모든 JVM 모듈의 의존이지만 시각화 단순화를 위해 별도 박스 + port implements 점선만 표시
- `pattern-engine`은 라이브러리 jar(컨테이너 추가 0) — v3.4.0에서 변경 0
- **v3.4.0 T-SIG 실시간 시그널 흐름 (Hot path)**: KIS WS H0STCNT0 → TickToMinuteAggregator 1m closing → BoundaryAggregator → Kafka `market.candle.{interval}.closed.v1` publish → `BoundaryClosingKafkaListener` 5건(consumer) → `RealtimeSignalGenerator` → `RedisStrategyCache` lookup → `SignalDedupeGuard` SETNX → `JvmStrategyEvaluator` sandbox(strategy-eval-pool 4) → `SignalRepository.save` (DB UQ) → `SignalKafkaProducer.publish(signal.generated.v1)` → `StompSignalDispatcher` → STOMP `/topic/signal.user.{userId}` → frontend `useStompSignal` 토스트
- **end-to-end latency 예측 (ADR 0066 §7-3)**: boundary closing → 사용자 토스트 도달 <100ms (boundary publish 20ms + listener 5ms + cache·sandbox·persist·publish·fanout 합 ~75ms)

**원칙**: 외부 4개 중 어느 하나가 끊겨도 본체는 동작. **Yahoo는 v3.2.2부터 의존 0** — `@Deprecated` 마킹만 잔존, v3.5.x minor 일괄 삭제 예정. Anthropic은 사용자 트리거 helper만이라 부재 시 MockDslHeuristic 9 패턴 fallback. **T-SIG는 KIS REST/WS 직접 호출 0건** — Kafka 내부 토픽만 listen (ADR 0066 §1 정합).
