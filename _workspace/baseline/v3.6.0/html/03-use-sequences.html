## 시나리오 15: T-O 모의 주문 정상 흐름 (v3.6.0 신규 — ADR 0068 §16 케이스 1)

**목적**: `order.intent.v1` Kafka 수신 → 3중 게이트 통과(MOCK 모드) → KIS VPS(모의) REST 매수 → KIS_ORDER_NO 획득 → H0STCNI9 체결통보 수신 → order_execution INSERT → STOMP FILLED 녹색 토스트

**관련 PR/ADR**: ADR 0068 (A-1·B-1·D-1·F-1·G-1·H-1 채택) · ADR 0067 (order.intent.v1 publish — T-RISK ALLOWED 결과) · ADR 0046 (user_kis_credential REAL/MOCK 2종) · ADR 0044 (order.filled.v1 Notification 진입)

**ADR 0068 채택 의사결정 요약 (시나리오 15 관련)**:

| 의제 | 채택 | 설명 |
|---|---|---|
| A. 모의/실전 분기 | A-1 3중 게이트 | env MAGICJAR_MODE + MAGICJAR_ALLOW_REAL + 사용자 동의 토글 — MOCK 모드 시 MOCK 자동 fallback |
| B. KIS endpoint | B-1 단일 port + adapter 내부 mode 분기 | TradingModeGate.resolveMode → tr_id 선택 |
| D. 체결 추적 | D-1 KIS WS H0STCNI9 (모의) | 실시간 체결통보 26 컬럼 listen |
| F. 영속 | F-1 3 테이블 분리 | order_request + order_execution + order_audit_event |
| G. 알림 | G-1 단일 STOMP + 4 event | /topic/order.user.{userId} |
| H. 멱등성 | H-1 Redis SETNX 60s + DB UQ | 자본 보호 — 중복 주문 0 |

**KIS-first raw 출처 (헌법 §3 의무 — 시나리오 15 LOCK)**:

| tr_id | 환경 | endpoint | raw 출처 |

| `VTTC0011U` | MOCK 매도 | `POST /uapi/domestic-stock/v1/trading/order-cash` | R12 동일 |

| 상태 | 진입 조건 | 다음 상태 |

## 시나리오 16: T-O 3중 게이트 BLOCKED — 자본 보호 (v3.6.0 신규 — ADR 0068 §16 케이스 2)

**목적**: `order.intent.v1` Kafka 수신 → TradingModeGateImpl 3중 게이트 중 조건 미충족 → `DenyReason` BLOCKED → `order_request.status=REJECTED` + `order_audit_event(REAL_GATE_DENIED)` + STOMP REJECTED 빨강 토스트 — **KIS prod endpoint 호출 0건 (자본 보호 LOCK)**

**관련 PR/ADR**: ADR 0068 (A-1 3중 게이트 채택) · CLAUDE.md 함정 4번 (실계좌 이중 게이트) · ADR 0043 (KillSwitch 행동) · ADR 0046 (사용자 동의 토글 `user_account.real_trading_consent_at`)

**3중 게이트 조건 매트릭스 (ADR 0068 §14-3 LOCK)**:

| 게이트 | 조건 | 위반 시 DenyReason | 비고 |
|---|---|---|---|
| 게이트 1 | `MAGICJAR_MODE != "REAL"` | (MOCK fallback — BLOCKED 아님) | MOCK 안전 default |
| 게이트 2 | `MAGICJAR_ALLOW_REAL != "true"` | `DENIED("MAGICJAR_ALLOW_REAL=false")` | env 변수 미설정 |
| 게이트 3 | `user_account.real_trading_consent_at IS NULL` | `DENIED("CONSENT_NOT_GIVEN")` | 사용자 동의 토글 OFF |

**시나리오 16 환경**: `MAGICJAR_MODE=REAL` + (`MAGICJAR_ALLOW_REAL=false` 또는 사용자 동의 토글 OFF)

**KIS-first raw 출처 (헌법 §3 — 시나리오 16 선언)**:
- 시나리오 16은 KIS REST/WS **직접 호출 0건** (ADR 0068 A-1 — 3중 게이트 진입 전 차단)
- KIS prod endpoint(`openapi.koreainvestment.com:9443`) 호출 0건 — 자본 보호 LOCK
- raw 출처 인용: 시나리오 15 R12·R14 (주문 pipeline baseline) — 16은 게이트 차단으로 미진입
