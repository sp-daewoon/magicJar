<script id="md-source" type="text/markdown"># 01 — magicJar v3.7.0 아키텍처 (시각화)

> **작성자**: architect (PR-36 baseline v3.7.0)
> **시점**: 2026-05-19 v3.7.0 태그 컷 직후 (release commit `<TBD>`)
> **권위**: `docs/architecture/master-architecture.md` v2 §5·§6 + ADR 0002·0004(7 모듈 매트릭스 v3.7.0 갱신)·0005·0006·0007·0008·0009·0023·0024·0028·0029·0030·0041·0042·0043·0044·0046·0047·0048·0054·0066·0067·0068·0070·0071·0072·0080·0081·0083·0084·**0085·0086·0087·0088·0089·0090** + v3.7.0 시점 코드 inspection 결과

본 문서는 v3.7.0 시점 magicJar 시스템의 **시각화 가능 수준 그림**이다. SoT는 `docs/architecture/master-architecture.md`이며, 본 문서는 그 하위 구체화 — v3.7.0 시점 실체(현재 발행된 컨테이너·테이블·KIS endpoint·Kafka topic·STOMP 토픽·sub-agent 8 hierarchy·페르소나 매트릭스·운영 헌법 §1-A-extended)만 인용한다. v1/v2 잔재 0건. 미발행 트랙(W4 T-AI·T-MCP · W5 T-LWC·T-LEARN)은 명시적으로 제외.

**v3.6.0 → v3.7.0 핵심 변경 (시스템 점검 + Phase 보강 baseline)**:

- **JVM 모듈 매트릭스 5 → 7**: + `indicator-impl` (ADR 0083 v3.6.15) + **`persistence-shared` (ADR 0088 v3.7.0 신설)**. 양쪽 모두 라이브러리 jar(컨테이너 0) + Boot main 0 + ADR 0054 pattern-engine 패턴 1:1 재사용. 운영 인지 비용 0.
- **sub-agent 매트릭스 7 → 8**: + `chart-curator` (ADR 0085 v3.6.17 영입). TradingView LWC v4 차트 + 캔들 데이터 SLA·정합성 단일 owner.
- **페르소나 매트릭스 0 → 2**: chart-curator 보수("안정빌드" · 🔴/🟡/🔵) ↔ backend-core 진보("리팩토링맨" · 💡/🔄/✨). ADR 0085 §Persona amend + ADR 0087 짝 시스템.
- **Flyway 18+ 누적 추가**: V25·V26·V27(T-RECON·T-NOTIFY) · V28(T-SC) · V29·V30(T-J·T-PERF) · V32·V33(T-NEWS) · V37·V38(주문 path 안정성 outbox·STOMP 영속) · V39(candle.backfill_batch_id) · **V42(instrument_status_history ADR 0090)** + Phase 1 합류 V40·V41.
- **Kafka 토픽 +4+ 종**: `reconcile.drift.v1` + `reconcile.run.v1` + `killswitch.engaged.v1` + `news.disclosure.v1` + `news.article.v1`.
- **STOMP 토픽 +2 종**: `/topic/news.user.{userId}` + 기존 토픽 4 event discriminator 확장.
- **Redis namespace +5+ 종**: + `screener:result` + `journal:summary` + `performance:summary` + `news:dedup` + **`rate-limit:kis` (Bucket4j-Redis ADR 0037)** + **`stomp:lastSeenAt:{userId}` (P1-3 STOMP unread/resync)**.
- **REST endpoint +20+ 건**: + Screener 3 + Journal 3 + Performance 2 + News 4 + ManualOrder 1 + Account 3 + Admin/CandleBackfill 1 + **Runtime 1 (`GET /api/runtime/flags`)** + **StompBackfill 2 (`GET /api/stomp/events/unread` · `GET /api/stomp/events`)**.
- **frontend 라우트 +4+ 건**: + `/screener` + `/journal` + `/performance` + `/news` + `/orders/new` + `/admin`.
- **운영 헌법 §1-A-extended 신설**: extensions.worktreeConfig=true 의무 + worktree-local config 발행 의무 + `scripts/setup-worktree-config.sh` 헬퍼 Step 2. 8 sub-agent author 정합 영구 LOCK.
- **운영 헌법 §2 4단계 → 6단계**: §2-3 빈 wrapper rmdir + §2-4 worktree-agent-* force delete + §2-5 사이클 시작 자동 점검 4 항목.
- **AI 호출 0 LOCK 유지**: W4 진입 0 — 사용자 명시 정합.
