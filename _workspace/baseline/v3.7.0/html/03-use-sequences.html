## 3. 시나리오 18: KIS REAL 주문 hashkey + rate limit acquire (v3.7.0 신규 — ADR 0084 P0-1 + ADR 0037 amend)

**목적**: `order.intent.v1` Kafka 수신 → 3중 게이트 통과(REAL 모드) → `KisHashKeyAdapter.compute()` → `KisRateLimiterPort.acquire(USER_PATH)` → KIS prod REST 매수 POST + 헤더 `hashkey` 동봉 → `KIS_ORDER_NO` 획득 → H0STCNI0 체결통보 수신 (v3.6.0 시나리오 15 REAL variant).

**관련 PR/ADR**: ADR 0084 P0-1 (hashkey) · ADR 0037 amend (Bucket4j-Redis Rate Limit) · PR #568(KisRateLimiterPort port 발행) · PR #571(RedisKisRateLimiterAdapter 실 구현) · CLAUDE.md 함정 4번 (실계좌 이중 게이트 + REAL 진입 baseline)

**KIS-first raw 출처 (헌법 §3 LOCK)**:

| tr_id | 환경 | endpoint | raw 출처 | 비고 |
|---|---|---|---|---|
| `TTTC0012U` | REAL 매수 | `POST /uapi/domestic-stock/v1/trading/order-cash` | R12 `domestic_stock_functions.py` L10097~L10213 | hashkey 헤더 의무 |
| `TTTC0011U` | REAL 매도 | `POST /uapi/domestic-stock/v1/trading/order-cash` | R12 동일 | hashkey 헤더 의무 |
| `H0STCNI0` | REAL 체결통보 WS | WS subscribe | R14 L389~L446 `ccnl_notice()` | 26 컬럼 (시나리오 15와 동일) |
| `getHashKey()` | hashkey 발급 | `POST /uapi/hashkey` | **R15** `examples_user/auth/auth.py` | KIS 공식 절차 |

**hashkey 절차 (R15 raw 출처 LOCK — 자체 추론 0)**:

`getHashKey(body: Map<String, Any>)`:
1. `POST https://openapi.koreainvestment.com:9443/uapi/hashkey`
2. 헤더: `content-type: application/json; charset=utf-8`·`appkey: {KIS_APP_KEY}`·`appsecret: {KIS_APP_SECRET}`
3. body: 주문 JSON 본체 그대로 (`CANO`·`ACNT_PRDT_CD`·`PDNO`·`ORD_DVSN`·`ORD_QTY`·`ORD_UNPR` 등)
4. 응답: `{ "HASH": "<hashkey 32 char>" }` — KIS 측에서 body 무결성 검증 토큰 발행
5. 이후 주문 POST 헤더에 `hashkey: <hashkey 32 char>` 동봉 의무

**hashkey 무결성 검증 evidence (P0-1 dogfooding)**:

| 케이스 | 검증 |
|---|---|
| hashkey 누락 시 KIS 응답 | `rt_cd != "0"`, `msg1="해시키가 유효하지 않습니다"` (R15 raw 명세 정합) |
| hashkey 발급 후 body 변경 시 | 동일 — body hash mismatch 검출 |
| dogfooding 의무 | application 로그 `hashkey=` 마스킹 후 8자만 노출 + REAL 진입 시 grep 검증 |

**rate limit dogfooding (PR #571 KDoc raw 출처 정합)**:

| 케이스 | 결과 |
|---|---|
| capacity=10 burst → 동시 11건 acquire | 10건 즉시 granted + 1건 50ms polling 후 granted (refill 1 token/100ms) |
| deadline 2000ms 초과 시 | `KisRateLimitTimeoutException` throw → order_request REJECTED |
| KIS 측 EGW00201 race 응답 시 | `onTpsExceeded()` 카운터 + CircuitBreaker open 3회 threshold |

**latency 예측 (v3.6.0 시나리오 15 baseline + P0-1·Rate Limit 추가)**:

| 단계 | 예상 latency |
|---|---|
| order.intent.v1 publish | <5ms |
| OrderRouterKafkaListener 게이트 chain | <20ms |
| **RateLimiter acquire (capacity 잔여)** | **<5ms (Bucket4j-Redis tryConsume)** |

## 4. 시나리오 19: KIS WS H0STCNI 재연결 + inquire-ccnl backfill (v3.7.0 신규 — ADR 0084 P0-3 #4 WS race)

**목적**: KisExecutionWsListener WebSocket 연결 끊김 발생 → 재연결 성공 → 끊김 구간 동안 발생한 체결 통보 누락 검증 → KIS REST `inquire-ccnl` 폴백 호출 → 누락 체결 backfill → `order_execution` event_id UQ 가드 통과한 row만 INSERT → STOMP FILLED 알림 정합.

**관련 PR/ADR**: ADR 0084 P0-3 (#4 WS race + 재연결 backfill) · Flyway V35(`order_execution.event_id UUID UNIQUE`) · PR #483(KIS WS 체결 baseline)

**KIS-first raw 출처 (헌법 §3 LOCK)**:

| endpoint | raw 출처 | 비고 |
|---|---|---|
| KIS WS `H0STCNI0`/`H0STCNI9` 재연결 | R14 `ccnl_notice()` L389~L446 | PING/PONG · approval_key 재발급 |
| KIS REST `inquire-ccnl` (실시간 일별 체결) | **R16** `examples_llm/.../inquire_ccnl.py` | `FID_INPUT_ISCD`·`FID_INPUT_DATE_1`·`FID_INPUT_HOUR_1` 분기 |
| KIS REST `inquire-daily-ccld` (일별 주문체결 — ADR 0084 P0-2 cross-ref) | **R17** `examples_llm/.../inquire_daily_ccld.py` | TR_ID `TTTC8001R`(REAL)/`VTTC8001R`(MOCK) — 본 시나리오 보조 reconciliation |

**event_id 가드 매트릭스 (ADR 0084 P0-3 §2-4 Flyway V35 LOCK)**:

```sql
-- order_execution.event_id UUID UNIQUE (Flyway V35)
-- WS·REST 양쪽 backfill 시 동일 체결 중복 INSERT 차단
ALTER TABLE order_execution ADD COLUMN event_id UUID NOT NULL DEFAULT gen_random_uuid();
ALTER TABLE order_execution ADD CONSTRAINT uq_order_execution_event_id UNIQUE (event_id);

```

`event_id`는 KIS WS 응답 raw 컬럼 조합으로 deterministic 생성:
- `MD5(kis_order_no + cntg_qty_누적 + stck_cntg_hour)` — 동일 체결은 동일 UUID
- WS 통보·REST backfill 양쪽에서 동일 체결 row 시도 시 두 번째 INSERT는 `uq_order_execution_event_id` 위반 → silent skip

**race 시나리오 매트릭스 (P0-3 dogfooding 의무)**:

| 케이스 | WS 동작 | Backfill 동작 | 가드 결과 |
|---|---|---|---|
| 정상 운영 | WS 즉시 INSERT | (미발동) | UQ 통과 1건 |

| WS만 도착 + Backfill 미작동 | 정상 INSERT | (미발동) | UQ 통과 1건 |
| WS 늦어 Backfill 먼저 | (지연) | REST 응답 INSERT 먼저 | WS 두 번째 도착 시 UQ 위반 → silent skip |

**inquire-daily-ccld 보조 reconciliation (ADR 0084 P0-2 PENDING_RECONCILE cross-ref)**:

P0-2(#3) 마감 시 KIS REST `inquire-daily-ccld`(R17, TR_ID `TTTC8001R`/`VTTC8001R`)를 일일 cron으로 호출 — `order_request.status=PENDING_RECONCILE` 항목 reconciliation. 본 시나리오 19와 별도 path이나 동일 KIS endpoint 데이터 raw 사용.

// chart-curator/.../CandleGapDetectorAdapter (PR #574 정합)
fun passesActiveGapAxes(code: String, ts: Instant): Boolean {
    if (!businessDayCalendar.isBusinessDay(ts)) return false
    // ★ axis 2·3 — 시점별 history snapshot (ADR 0090 §2-3)
    val statusAt = instrumentStatusHistoryPort.findActiveStatus(code, ts)
    if (statusAt == InstrumentStatus.TRADING_HALT) return false
    if (statusAt == InstrumentStatus.LIQUIDATION) return false
    if (statusAt == InstrumentStatus.DELISTED) return false
    val listedAt = instrumentRepository.findListedAt(code) ?: return false
    if (listedAt > ts) return false
    return true
}

## 8. 시나리오 23: Outbox publish chain — api INSERT → consumer drain → Kafka (v3.7.0 신규 — ADR 0088)

**목적**: 사용자 주문 issue 시 api 컨테이너 `order_event_outbox` INSERT (Transactional Outbox) → consumer 컨테이너 `OrderOutboxPublisherWorker.drain()` schedule cycle → `order.intent.v1` Kafka publish → 시나리오 15·18 OrderRouterKafkaListener 진입 정합 → 주문 path 운영 흐름 작동률 0% 결함 영구 차단.

**관련 PR/ADR**: ADR 0088(persistence-shared 모듈 신설 — Outbox Repository wiring 결함 fix) · ADR 0004(MSA 모듈 재구성 6→7 모듈) · ADR 0084 P1-1(#2 order outbox 의제 cross-ref)

**근본 결함 (ADR 0088 §맥락 evidence)**:

- 어댑터 구현체는 `api/persistence/`에만 단독 발행 → consumer 컨테이너에서는 spring context bean 0 → `ObjectProvider.getIfAvailable()` 항상 null → drain·retry worker 매 cycle skip
- 자본 흐름 영향: 사용자 주문 issue 시 api INSERT는 됨 → consumer drain 0 → Kafka publish 0 → 주문 본체 path **운영 흐름 작동률 0%**
- ADR 0088 §결정: `persistence-shared` 라이브러리 모듈 신설 → api·consumer 양쪽 bean 공유 LOCK
