## 🔄 v3.7.0 → v3.8.0 진화 요약 (리팩토링맨 lens)

| 영역 | v3.7.0 | v3.8.0 | 진화 사유 |
|------|--------|--------|----------|
| JVM 모듈 | 7건 (`domain·pattern-engine·indicator-impl·persistence-shared·api·batch·consumer`) | **8건** (+ `strategy-engine`) | ADR 0092 — DSL parser + StrategyEvaluator api·consumer 공유 (HOLD stub P0 결함 차단) |
| 운영 단계 | 개발 단계 (W3 마감 + W4 진입 직전) | **운영 단계 진입 (v3.8.0~)** | ADR 0094 — 8→7 hierarchy reshuffle + qa Visual 격상 + chart-curator 해고 |

| SLO/SLA 정의 | 0건 (운영 헌법 §9 메모만) | **SLO 5건 LOCK (S-1~S-5) + alert routing P1·P2·P3** | ADR 0095 — Micrometer timer + SystemEvent counter + Prometheus query 5건 |
| DR/backup 절차 | 0건 (수동 dump만) | **pg_dump cron 매일 03:00 KST + Redis snapshot 03:30 + RPO 24h/RTO 4h** | ADR 0096 — 분기 DR drill (사용자 결재 + qa Visual 자동 재현) |
| Runbook | 0건 (`docs/operations/` 2 파일만 — initial-setup·kis-api) | **5 시나리오 R-1~R-5 (incident response + DR drill + KillSwitch + SLA 위반 + KIS rate limit 대응)** | ADR 0094 P0-OPS-5 — backend-core 단독 발행 |
| persistence-shared monitoring | wiring 회복(v3.7.0 ADR 0088)만 | **Outbox lag · stomp_event retention · SystemEvent counter 3 지표 Grafana 패널** | ADR 0094 P0-OPS-6 — SLO 측정 source wiring |

| NXT 시장 통합 | KOSPI=`UN`/KOSDAQ=`J` 단순 분기 | **종목 단위 allow-list (KOSPI200·KOSDAQ150) + `UN` 우선 + `J` fallback** | ADR 0091 — NXT 통합 시장코드 종목 단위 resolver |

### 3-2. ✨ KillSwitch race-safe guard (PR #648 — ADR 0043·0070 amend, v3.8.0)

```
Signal 또는 Risk 위반 발사
    ↓
KillSwitchRaceSafeGuard.evaluate(userId, trigger):
    Step A. pending list 조회 — 최근 10초 내 진행 중인 KillSwitch trigger 존재 여부 (Redis SETNX 10s TTL)
        └── exists → 기존 trigger와 묶음 처리 (중복 토픽 발사 차단)
    Step B. grace window 검증 — KillSwitch ON 후 3초 grace
        └── grace 내 추가 trigger → audit만 + 토픽 미발사 (race condition 가드)
    Step C. strike counter — 동일 userId 5분 내 trigger 3회 이상 시 강제 ON (단일 trigger drift 회피)
        └── strike >= 3 → killswitch.engaged.v1 forced=true 발사 + audit reason='STRIKE_THRESHOLD'
    Step Final. all-clear → killswitch.engaged.v1 발사 + audit reason=trigger
```
