## 3. 시나리오 S-1: 사용자 KIS 키 등록 + 토큰 발급 (v3.8.0 신규 — ADR 0038 + ADR 0046 정합)

**목적**: 사용자 ⚙️ SettingsModal 진입 → KIS appkey/appsecret + CANO + 계좌상품코드 입력 → `UserKisCredentialController` POST → AES 암호화 후 DB 저장 → 첫 KIS REST 호출 트리거 → `KisTokenAdapter.acquireToken()` → `oauth2/tokenP` 호출 → access_token 23h Redis cache + ReentrantLock(JVM 단일 머신 race 차단) + Redis SETNX(다중 머신 race 차단) → 후속 KIS 호출은 cache hit.

**관련 PR/ADR**: ADR 0038(KIS 토큰 24h cache + JVM ReentrantLock + Redis SETNX 이중 lock) · ADR 0046(KIS credential per-user 저장 정책) · ADR 0094 §9-3(사용자 단독 운영자 가정 + ⚙️ SettingsModal 입력 baseline) · `project_kis_key_management.md` 메모리(개발 중 ⚙️ SettingsModal 입력 + DB AES 암호화) · `project_kis_key_realonly_for_data.md` 메모리(정보 수집은 실전 키 단일)

**KIS-first raw 출처 (헌법 §3 LOCK)**:

| endpoint | 환경 | raw 출처 | 비고 |
|---|---|---|---|
| `POST /oauth2/tokenP` | prod·vps 공통 | **R21** `examples_user/auth/kis_auth.py` (`auth()` 본체) | grant_type=client_credentials |
| host (prod) | 조회·시세 | `https://openapi.koreainvestment.com:9443` | KIS 공식 |
| host (vps) | 주문(모의) | `https://openapivts.koreainvestment.com:29443` | KIS 공식 |
| 응답 LOCK | — | `{access_token, access_token_token_expired, expires_in=86400, token_type=Bearer}` | 24h LOCK |

```mermaid
sequenceDiagram
    participant FE as Frontend SettingsModal<br/>(KisCredentialForm)
    participant SettingsCtrl as UserKisCredentialController<br/>(api)
    participant CredService as UserKisCredentialService<br/>(backend-core)
    participant Crypto as AES256Encryptor<br/>(backend-core — ADR 0046 §2-3)
    participant CredRepo as UserKisCredentialRepository<br/>(persistence-shared — ADR 0088)
    participant TokenAdapter as KisTokenAdapter<br/>(market-data — ADR 0038)
    participant LocalLock as ReentrantLock<br/>(JVM 단일 머신 race 차단)
    participant RedisLock as Redis SETNX<br/>(다중 머신 race 차단)
    participant RedisCache as Redis<br/>(kis:token:{userId}:{accountType} TTL 23h)
    participant KisAuth as KIS<br/>(openapi.koreainvestment.com:9443)

    FE->>SettingsCtrl: POST /api/me/kis-credential<br/>{ appkey, appsecret, cano, acntPrdtCd, accountType=REAL }
    SettingsCtrl->>CredService: save(userId, dto)
    CredService->>Crypto: encrypt(appsecret)
    Crypto-->>CredService: ciphertext (AES-256-GCM)
    CredService->>CredRepo: save(UserKisCredential { user_id, appkey, appsecret_cipher, cano, acnt_prdt_cd, account_type=REAL, real_trading_consent_at=NULL })
    note over CredRepo: ADR 0046 §2-3 — appsecret 평문 보존 0 (`feedback_secret_handling`)
    CredRepo-->>CredService: UserKisCredential { id, created_at }
    CredService-->>SettingsCtrl: 200 { credentialId, masked }
    SettingsCtrl-->>FE: 200 (key 등록 완료)

    Note over FE: 사용자 첫 KIS 호출 트리거 (예: 종목상세 진입 — S-2 진입점)
    FE->>SettingsCtrl: (후속) GET /api/symbols/005930
    SettingsCtrl->>TokenAdapter: acquireToken(userId, accountType=REAL)

    TokenAdapter->>RedisCache: GET kis:token:{userId}:REAL
    alt cache hit
        RedisCache-->>TokenAdapter: { access_token, expires_at, cached_at }
        TokenAdapter-->>SettingsCtrl: token (cache hit)
    else cache miss
        TokenAdapter->>LocalLock: lock(userId+accountType)
        note over LocalLock: ADR 0038 §2-1 JVM ReentrantLock<br/>같은 user/account 다중 동시 호출 시 한 번만 발급
        LocalLock-->>TokenAdapter: acquired

        TokenAdapter->>RedisCache: GET kis:token:{userId}:REAL (재확인)
        alt 동시 호출 사이 cache 채워졌음 (다른 thread 우선)
            RedisCache-->>TokenAdapter: { access_token, expires_at }
            TokenAdapter-->>SettingsCtrl: token (race 회피 hit)
        else 여전히 miss
            TokenAdapter->>RedisLock: SETNX kis:token:lock:{userId}:REAL "<jvm-id>" EX 30
            note over RedisLock: ADR 0038 §2-2 Redis SETNX 이중 lock<br/>다중 머신/컨테이너 환경에서도 단일 발급 LOCK<br/>EX 30s — KIS API 자체 latency 대비 충분
            alt SETNX OK (lock 획득)
                RedisLock-->>TokenAdapter: true

                TokenAdapter->>CredRepo: findByUserAndType(userId, REAL)
                CredRepo-->>TokenAdapter: UserKisCredential { appkey, appsecret_cipher }
                TokenAdapter->>Crypto: decrypt(appsecret_cipher)
                Crypto-->>TokenAdapter: appsecret (in-memory only)

                TokenAdapter->>KisAuth: POST /oauth2/tokenP<br/>headers: content-type=application/json<br/>body: { grant_type="client_credentials", appkey, appsecret }<br/>raw 출처: examples_user/auth/kis_auth.py auth() (R21)
                alt 정상
                    KisAuth-->>TokenAdapter: 200<br/>{ access_token="eyJ...JWT 350자",<br/>access_token_token_expired="2026-05-23 14:38:00",<br/>expires_in=86400, token_type="Bearer" }
                    TokenAdapter->>RedisCache: SETEX kis:token:{userId}:REAL 82800 {access_token, expires_at, cached_at}
                    note over RedisCache: TTL 23h LOCK (24h - 1h 마진 — KIS 토큰 종료 직전 race 회피)
                    TokenAdapter->>RedisLock: DEL kis:token:lock:{userId}:REAL
                    TokenAdapter-->>SettingsCtrl: token (신규 발급 완료)
                else KIS EGW00123 (token expired race)
                    KisAuth-->>TokenAdapter: 200 { rt_cd="EGW00123", msg1="기간이 만료된 토큰입니다" }
                    note over TokenAdapter: ★ self-heal — `hotfix(api): KIS 토큰 EGW00123` (775c87fe) 정합<br/>cache evict + 1회 재발급
                    TokenAdapter->>RedisCache: DEL kis:token:{userId}:REAL
                    TokenAdapter->>KisAuth: POST /oauth2/tokenP (2회차 — 재발급)
                    KisAuth-->>TokenAdapter: 200 { access_token, ... }
                    TokenAdapter->>RedisCache: SETEX (재캐시)
                else KIS 인증 실패 (appkey/appsecret invalid)
                    KisAuth-->>TokenAdapter: 200 { rt_cd != "0", msg1="유효하지 않은 KEY 정보" }
                    note over TokenAdapter: 즉시 실패 — 재시도 0 (사용자 메모리 `feedback_secret_handling`)
                    TokenAdapter->>RedisLock: DEL kis:token:lock:{userId}:REAL
                    TokenAdapter-->>SettingsCtrl: throw KisCredentialInvalidException
                end
            else SETNX 실패 (다른 머신/컨테이너 발급 중)
                RedisLock-->>TokenAdapter: false
                TokenAdapter->>TokenAdapter: poll 100ms × N (deadline 5s)
                TokenAdapter->>RedisCache: GET kis:token:{userId}:REAL
                alt 다른 머신 발급 완료
                    RedisCache-->>TokenAdapter: token (race 회피 hit)
                else 다른 머신 발급 실패
                    TokenAdapter-->>SettingsCtrl: throw KisTokenAcquireTimeoutException
                end
            end
        end
        TokenAdapter->>LocalLock: unlock
    end
```

**dogfooding 검증 evidence (ADR 0038 정합 + EGW00123 self-heal hotfix 정합)**:
- DB: `user_kis_credential` row 1건 (사용자당 — account_type=REAL/MOCK)
- DB: `appsecret_cipher` 컬럼은 AES-256-GCM 암호문(평문 0건 — `feedback_secret_handling`)
- Redis: `kis:token:{userId}:REAL` TTL 82800s (23h) — `redis-cli TTL ...` 확인
- 회귀: 동일 user/account 24h 내 KIS `oauth2/tokenP` 호출 1회만 발생 (cache hit 확인 — KIS 측 rate limit 회피)
- 회귀: EGW00123 발생 시 cache evict + 1회 재발급 후 정상 흐름 (commit 775c87fe evidence)

**보안 매트릭스 (사용자 메모리 `feedback_secret_handling` 정합)**:

| 항목 | 정책 |
|---|---|
| appsecret 평문 보존 | 0 — DB는 AES-256-GCM cipher만 |
| 응답에 appsecret 노출 | 0 — 응답 DTO에 `appsecretMasked` (앞 4자 + `***`) |
| 로그에 appsecret 출력 | 0 — `MaskingLogger` 적용 |
| KIS HTTP 호출 시 appsecret | in-memory only — decrypt 직후 즉시 KIS 헤더 + GC 적격 |
| Redis cache 키 명명 | `kis:token:{userId}:{accountType}` — appsecret 노출 0 |

| 단계 | 예상 latency |

## 5. 시나리오 S-3: 실시간 캔들 갱신 (1d backfill — LiveDailyCandleScheduler 5분 cron)

**목적**: chart-curator 해고 (ADR 0094 — 캔들 SLA market-data 인수) 후 **시점 정밀 1d backfill** path. `LiveDailyCandleScheduler.refresh()` `@Scheduled(fixedDelayString = "PT5M")` 5분 cron → watchlist 종목 each(6개 예시) → 종목 간 `Thread.sleep(codeIntervalMs=200L)` 마진(PR #658) → `KisRateLimiterPort.acquire(BACKFILL, timeoutMs=5000)` → `CandleRefreshService.refreshDailyCandles(code, priority=BACKFILL)` → 페이지 each `Thread.sleep(PAGE_INTERVAL_MS=150L)` 마진(PR #659 §A) → KIS REST `FHKST03010100` 호출 → DESC → ASC 정규화(PR #540) → UPSERT(natural key) → 만약 EGW00201 발생 시 1초 backoff + 1회 재시도(PR #659 §B).

**관련 PR/ADR**: PR #658(LiveDailyCandleScheduler 종목 간 200ms sleep — burst 완화 옵션 B) · PR #659(KIS_TPS_EXCEEDED 종합 fix — H1 페이지 150ms + H4 EGW00201 1초 backoff + priority=BACKFILL 분리) · PR #540(KIS 일봉 DESC → ASC 정규화 — v3.7.0 시나리오 20 cross-ref) · ADR 0037 amend(Bucket4j-Redis baseline) · ADR 0094(chart-curator 해고 + 캔들 SLA market-data 인수) · `_workspace/reports/2026-05-22-kis-tps-exceeded-root-cause.md`

| EGW00201 1초 backoff 패턴 | — | `KisHashKeyAdapter:126` inline cross-ref (PR #659 §B) | KIS 측 rate limit race 응답 |

    GuardB-->>Listener: graceCompleted

    Listener->>StompBroker: publish /topic/killswitch.engaged.{userId}<br/>{ engagedAt, reason, pendingCancelled=N, activeCancelled=M }

**A+B+C race-safe 매트릭스 (PR #647·#648 evidence)**:

| Phase | 차단 대상 | 자본 path 영향 | 검증 SQL |
|---|---|---|---|
| A — pending | `order_request.status='REQUESTED'` | 신규 시그널 즉시 차단 (KIS submit 0건) | `SELECT count(*) FROM order_request WHERE status='REQUESTED' AND user_id=?` |
| B — grace | KIS submit 진행 중 (in-flight 5초 window) | ACK 도달 대기 + Phase C 진입 또는 PENDING_RECONCILE 마킹 | `SELECT count(*) FROM order_audit_event WHERE type='REQUESTED' AND created_at >= NOW() - INTERVAL '5 seconds'` |
| C — strike | `order_request.status IN ('ACK','PARTIALLY_FILLED')` | KIS 정정/취소 발사 (TTTC0013U) | `SELECT count(*) FROM order_request WHERE status IN ('ACK','PARTIALLY_FILLED') AND user_id=?` |

**race 시나리오 dogfooding (PR #647·#648)**:

| 케이스 | A | B | C | 결과 |
|---|---|---|---|---|
| 정상 ENGAGE (in-flight 0) | 0 cancel | grace 5s skip | 0 strike | 즉시 LOCK |
| ENGAGE + in-flight 1건 (KIS 진행 중) | 0 cancel | 5s wait → ACK | 1 strike (TTTC0013U) | grace 후 정정 발사 |
| ENGAGE + 신규 시그널 burst 5건 | 5 cancel | skip | skip | 신규 모두 차단 |
| ENGAGE + 이미 FILLED 3건 | 0 cancel | skip | 0 strike (FILLED 상태 정정 불가) | 자본 path 보호 — FILLED는 이미 종결 |
| 사용자 DISENGAGE 후 즉시 신규 발사 | normal | normal | normal | engaged=false → guard pass |

**자동 OFF 거부 LOCK (ADR 0043 §2-3 정합)**:
- 시스템·KIS 응답·시간 경과·DB rollback — 모두 자동 OFF 발동 0건
- 오직 **사용자 명시 수동 POST /api/killswitch/toggle action=DISENGAGE**만 허용
- 사유: 자동 OFF가 자본 path 보호 본질 위배 — 사용자 가시화 의무

**dogfooding 검증 evidence (PR #647·#648 + runbook R-3)**:
- DB: `kill_switch_state.engaged=true` row + `engaged_at` timestamp
- DB: `order_audit_event.type` chain: KILLSWITCH_ENGAGE_REQUESTED → KILLSWITCH_PENDING_CANCELLED(N) → KILLSWITCH_ACTIVE_STRIKE(M)
- DB: `order_request.status='CANCELLED_BY_KILLSWITCH'` row N+M개 (engage 사이클당)
- Kafka: `killswitch.engaged.v1` offset 증가
- STOMP: 사용자 화면 banner ENGAGED 즉시 표시
- 회귀: ENGAGED 상태에서 S-4 신규 주문 시도 시 KillSwitchEngagedException → 401 응답 + 화면 차단
