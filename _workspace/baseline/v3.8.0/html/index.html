## 한 장 요약

magicJar v3.8.0은 **운영 단계 진입 baseline (개발 단계 종착 + sub-agent 7 actor reshuffle + qa Visual 격상 + P0 OPS 6건 마감 + Stage 2 Cleanup LOCK)** 미러스톤이다. v3.7.0 (시스템 점검 + Phase 보강 + 8 sub-agent + 운영 헌법 §1-A-extended·§2 6단계) → v3.7.1 patch (persistence-shared JpaRepository scan 누락 hotfix) → v3.8.0 (ADR 0094 amend로 8 → 7 actor + qa Visual "품질 헌터" 격상 + chart-curator 해고 + sre 영입 거절 + 운영 헌법 §9·§10 신설 + P0 OPS 6건 마감 + ADR 0091·0092·0093 W3 보강 + Stage 2 Cleanup + v3.8.0 cut 차단 hotfix 3건). **운영 단계 진입** — fitness gap 기준이 "개발 단계" → "운영 단계"로 LOCK 전환. 사용자 명시 "이제 개발의 전반은 다 되어가기때문에 시스템 운영 단계 및 부분 고도화로 갈 준비를 해야해" + "큐에이도 지금 필요한데 그냥 단순 에이전트가 아닌 확실한 큐에이가 필요하거든. 스크린샷 등 하면서 테스트 시킬라했어".

**v3.8.0 시점 동작하는 핵심 흐름** (v3.7.0 baseline + v3.7.1 patch + v3.8.0 운영 baseline P0 6건):

1. **W3 자동매매 본체 종착 노드 가동 LOCK 유지** — boundary 마감 → 시그널 → risk verdict → order intent → KIS REST → ACK → H0STCNI0/H0STCNI9 체결 → STOMP 4 event 토스트 chain 보존 (ADR 0066·0067·0068 baseline). 3중 게이트(env × env × `user_account.real_trading_consent_at`) 자본 보호 LOCK 보존. T-MAN(수동 주문 — ADR 0082) + T-O(자동) 양쪽 모두 `OrderRouterKafkaListener` 12 step LOCK 단일 자본 path. T-ACCT(잔고·예수금 — ADR 0081 Phase 4 마감) + T-NEWS(뉴스·공시 — ADR 0075) + T-CC(차트·캔들 SLA — ADR 0086 데이터 햇징 룰 13건 + ADR 0090 instrument_status_history) 모두 운영 안정.

2. **v3.8.0 미러스톤 — 운영 단계 transition (ADR 0094 amend)**:
   - **8 → 7 sub-agent reshuffle** — chart-curator 해고 (캔들 SLA → market-data + LWC v4 → frontend 책임 이관) + qa Visual "품질 헌터" 격상 (Playwright + 5 시나리오 + 스크린샷 + 시각 회귀 + E2E + DR drill 자동 재현) + ai-engineer 유지 (W4 진입 시 가동) + sre 영입 거절 (P0 OPS 6건은 backend-core 인수)
   - **운영 헌법 §9·§10 신설** — §9 운영 단계 룰 6 항목 (9-1 SLO/SLA 5건 · 9-2 변경 관리 · 9-3 on-call rotation · 9-4 backup/DR · 9-5 신규 ADR 양식 3 슬롯 · 9-6 7 hierarchy LOCK) + §10 운영 메모 재배치
   - **P0 OPS 6건 마감** — P0-OPS-1·2 logback JSON + Actuator + Prometheus + Grafana / P0-OPS-3 SLO/SLA ADR 0095 / P0-OPS-4 DR/backup ADR 0096 + pg_dump cron / P0-OPS-5 runbook 5 시나리오 / P0-OPS-6 persistence monitoring + SLO 측정 source wiring + Grafana SLO dashboard

3. **ADR 발행 — v3.8.0 신규 6건 (0091~0096) + amend 3건 (0080·0085·0087)**:
   - **0091 NXT 통합 시장코드 종목 단위 resolver** (Accepted) — KOSPI=UN/KOSDAQ=J market-level 분기 폐기 + is_kospi200/is_kosdaq150 allow-list + J fallback
   - **0092 strategy-engine 라이브러리 모듈 분리** (Accepted) — DSL parser/evaluator 공유 + API 백테스트·스크리너 HOLD stub 제거 + consumer 실시간 평가와 단일 evaluator 사용 (ADR 0054·0083·0088 패턴 1:1)
   - **0093 차트 캔들 히스토리 limit + Lazy Backfill + 사용자 입력 봉수** (Proposed) — chart-curator (당시) spec 발행 + backend-core property/cap 5000 + frontend CandleCountSelector UI + Phase 5 LWC 가드 3단
   - **0094 운영 단계 transition + qa Visual 격상** (Accepted, 사용자 위임 결재) — 본 baseline 사이클의 결정적 turning point. ADR 0080·0087 amend + ADR 0085 supersede
   - **0095 P0-OPS-3 SLO/SLA + alert routing matrix** (Accepted) — 5 SLO LOCK · severity 4단 · Prometheus alert sketch · 운영 ADR 양식 첫 적용
   - **0096 P0-OPS-4 DR/backup 절차** (Accepted) — PostgreSQL pg_dump daily + Redis snapshot + RPO 24h + RTO 30분 + DR drill 분기 의무 + qa Visual E2E 자동 재현

4. **Stage 2 종합 정리** (v3.8.0 cut 전 LOCK):
   - **ADR README audit + 헌법 §1-A 정합** — chart-curator archived 마커 + §10 운영 메모 amend (architect/sub-agent/orchestrator/사용자 책임 매트릭스)
   - **qa.md 신규 발행** (`.claude/agents/qa.md`) — Visual QA "품질 헌터" 페르소나 본문 (Playwright + 5 시나리오 + DR drill 정기 + 사용자 dogfooding 변환)
   - **chart-curator.md archive** — `.claude/agents/_archive/chart-curator.md` 이동 + Superseded header amend + dispatch 0 명시 (`.husky/pre-commit` allowed-author regex는 historical evidence 보존 + 사용자 force commit risk 회피로 유지)
   - **CLAUDE.md amend** — 8→7 + chart-curator 제거 + qa Visual 격상 + JVM 7 모듈 매트릭스 + ADR 카운트 93+
   - **memory audit + orphan decision audit 보고서 2건 발행** (`_workspace/reports/`)

5. **W3 운영 보강 트랙 (v3.7.0 → v3.7.1 → v3.8.0)**:
   - **NXT 통합 — ADR 0091** — KIS 종합거래 매트릭스 NXT/UN 종목 단위 resolver + is_kospi200/is_kosdaq150 allow-list
   - **strategy-engine 모듈 — ADR 0092** — DSL parser·evaluator 공유 jar (api 백테스트·screener + consumer 실시간 단일 evaluator)
   - **chart limit + Lazy Backfill — ADR 0093** — 5000 cap + CandleCountSelector + Phase 5 LWC 가드 3단
   - **T-1·2·3·4 KIS 토큰 통합** — cache prefix 정합 + 동적 TTL + 분산락 + Account cache 5s 단축 + accountType 분리 (REAL/MOCK)
   - **system event log P1~P3** — Flyway V44 system_event 테이블 + SystemEventLogger port + SystemEventKafkaProducer + STOMP fanout + /system Dashboard + NotificationCenter bell
   - **account balance STOMP push** (polling → push 전환) + **WS health indicator + 끊김 toast 영구 표시**
   - **자본 path hardening** — KillSwitch race-safe guard (A+B+C — pending+grace+strike) + PositionBootstrapRunner 3중 게이트 + KIS WS H0STCNI9 라우팅 + AES-256-CBC 복호화 + balance reconcile drift detected + order reconciliation FIRED/RESOLVED

6. **v3.8.0 cut 차단 hotfix 3건** (PR #657·#659·#660·#661):
   - **PR #657** — KIS_TPS_EXCEEDED LIVE root cause hotfix (LiveDailyCandleScheduler 종목 간 200ms sleep 마진 + 페이지 burst 완화 + EGW00201 1초 backoff+재시도 + priority=BACKFILL 분리)
   - **PR #659** — KIS_TPS_EXCEEDED LIVE 종합 fix
   - **PR #660** — QA 첫 임무 P0 hotfix (NXT 30% 휴리스틱 + stale 30분 검증)
   - **PR #661** — consumer KIS inquire-daily-ccld `.block()` reactor-http-nio thread ERROR fix (`.publishOn(Schedulers.boundedElastic())` 합류)

**v3.8.0 누적 ADR 96건** (v3.7.0 baseline 90건 + v3.8.0 신규 6건 0091·0092·0093·0094·0095·0096 + amend 3건 0080·0085·0087 — 자세한 인덱스는 `_workspace/arch/adr/README.md`).

**v3.8.0 시점 자동매매 본체 정합 핵심 충족**:

1. **자동매매 본체 종착 노드 가동 LOCK 유지** — T-SIG → T-RISK → T-O chain 보존 + 3중 게이트 자본 보호 LOCK + persistence-shared 운영 흐름 작동률 100% 유지 + KillSwitch race-safe guard + KIS WS H0STCNI9 라우팅 + AES 복호화 + system event log P1·P2·P3
2. **운영 단계 진입 + 7 actor hierarchy LOCK** — chart-curator 해고 + qa Visual "품질 헌터" 격상 + 운영 헌법 §9·§10 신설 + P0 OPS 6건 마감 (logback·Actuator·Prometheus·Grafana·SLO/SLA·DR/backup·runbook·persistence monitoring)
3. **모듈 매트릭스 7 → 7 (재배치)** — domain · pattern-engine · indicator-impl · persistence-shared · **strategy-engine (신설 ADR 0092)** · api · batch · consumer (ADR 0004·0054·0083·0088·0092 정합)
4. **운영 헌법 §9·§10 LOCK** — SLO 5건 + severity 4단 routing + on-call rotation (사용자 1차 + backend-core 2차 + architect+영역 sub-agent 3차) + 분기 DR drill 의무 + qa Visual E2E 자동 재현
5. **회귀 0** — v3.7.0 baseline + v3.7.1 hotfix + v3.8.0 변경 모두 add-only 또는 1:1 정합 변환 (chart-curator archive는 dispatch 0 + 히스토리 evidence 보존 양립)
6. **AI 호출 0 LOCK 유지** — W4 진입 0 (사용자 명시 정합 — ai-engineer 유지하되 W4 진입 시점에 가동). prompt-catalog cleanup 누적
