## ✨ T-MARKET — 시장 추세 분석 (v3.9.0 신규 트랙 — ADR 0100 + 0101)

### 1. REST (v3.9.0 신규 6 endpoint)

|--------|------|------|
| `GET` | `/api/market/index/snapshot` | 4 지수 카드 (KOSPI·KOSDAQ·NASDAQ·S&P) + user pref MA 추세 라벨 |
| `GET` | `/api/market/index/{code}/trend?periods=5,20,60` | 지수 추세 상세 — periods 생략 시 user pref echo + `isUserCustom` |
| `GET` | `/api/market/sectors/snapshot` | KRX 21 섹터 snapshot (이름 + 등락률 + 거래대금) |

#### Swagger 4단 의무 (한국어 + example)

```kotlin
@Tag(name = "시장 추세 API", description = "지수·섹터 추세 분석 — 사용자 MA periods 기본 적용")
@RestController
class MarketIndexController(...) {
    @Operation(summary = "4 지수 카드", description = "KOSPI·KOSDAQ·NASDAQ·S&P 500 — user pref MA 적용 추세 라벨")
    @GetMapping("/snapshot")
    fun snapshot(): List<IndexCardResponse>

    @Operation(summary = "지수 추세 상세", description = "periods 생략 시 사용자 설정 기본 적용")

    fun trend(
        @PathVariable code: String,
        @Parameter(description = "MA 기간 list (1~5개·각 1~252일·sorted ASC)", example = "5,20,60")

#### TrendPreference 도메인 (1급 격상 · ADR 0101 §2-1 + W4 P1 amend)

```kotlin
// domain/trend/TrendPreference.kt
data class TrendPreference(
    val userId: String,              // W4 P1 amend — user_account.user_id VARCHAR(20) KIS 계좌번호 자연 키 정합 (ADR 0046)
    val maPeriods: List<Int>,        // default [5, 20, 60] · size 1~5 · 각 1~252 · sorted ASC 의무
    val rsPeriod: Int = 60,
    val crossPair: Pair<Int, Int>? = null,
    val updatedAt: Instant,
) {
    init {
        require(maPeriods.isNotEmpty()) { "MA periods 1개 이상 필수" }
        require(maPeriods.size <= 5) { "MA periods 5개 초과 금지" }
        require(maPeriods.all { it in 1..252 }) { "각 MA 기간은 1~252일 사이" }
        require(maPeriods == maPeriods.sorted().distinct()) { "MA periods는 중복 없이 오름차순" }
        require(rsPeriod in 1..252) { "RS period는 1~252일 사이" }
        crossPair?.let { (short, long) ->
            require(short in maPeriods && long in maPeriods) { "crossPair는 maPeriods 내 값 필수" }
            require(short < long) { "crossPair는 short < long" }
        }
    }
    fun shortMa(): Int = crossPair?.first ?: maPeriods.first()
    fun longMa(): Int = crossPair?.second ?: maPeriods.last()
}
```

### 3. 영속 (Flyway 3건 — V47·V48·V51)

| Flyway | 테이블 | 핵심 컬럼 | ADR |
|--------|-------|----------|-----|
| **V47** | `market_index_snapshot` | code(KOSPI=0001 · 해외=.IXIC) · market · ts · price · OHLC · change_rate · volume · raw_payload JSONB · UNIQUE(code,ts) | ADR 0100 §2-7 |
| **V48** | `sector_index_snapshot` | sector_code · sector_name · ts · price · change_rate · trade_value · UNIQUE(sector_code,ts) | ADR 0100 §2-7 |
| **V51** | `user_preference` | **user_id VARCHAR(20) PK** (FK user_account · W4 P1 amend) · trend_ma_periods JSONB DEFAULT '[5,20,60]' · trend_rs_period · trend_cross_pair JSONB · **extra JSONB forward-compat 확장 슬롯** + CHECK | ADR 0101 §2-2 |

✨ **V51 idempotent default 시드** (모든 사용자에 default `[5,20,60]` 자동 부여):
```sql
INSERT INTO user_preference (user_id, trend_ma_periods, trend_rs_period)
SELECT user_id, '[5,20,60]'::jsonb, 60
FROM user_account
ON CONFLICT (user_id) DO NOTHING;
```

### W4 P1 amend evidence (2026-05-24 — ADR 0102 §5 cross-ref)

ADR 0102 §2-2 영속 자원 audit 5단계 절차의 적용 범위가 **외부 영속 자원 6 영역**(Flyway·Kafka·Redis·STOMP·REST·ENV)에 한정되었던 lens를 **내부 도메인 모델 inventory**(기존 표 컬럼 타입·PK 자연/surrogate 구분 등)로 확장하는 사례 1건.
