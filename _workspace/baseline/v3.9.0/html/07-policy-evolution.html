## §2. ADR 0102 신설 — spec/plan 발행 시 main 영속 자원 audit 5단계 절차 LOCK (v3.9.0 핵심 진화)

### 2-1. 본 ADR 발생 trigger (헌법 §7 escalation 5단계 완주 evidence)

2026-05-24 R0 PR #674 (1411d392)는 W4 통합 사이클 (T-MARKET·T-AI·T-MCP 3 트랙) spec/ADR/dispatch 매트릭스 발행. Flyway V40~V45 6건 sub-agent별 LOCK 분배:

```
V40 = market_index_snapshot   (market-data)
V41 = sector_index_snapshot   (market-data)
V42 = ai_comment_log          (ai-engineer)
V43 = prompt_template         (ai-engineer)
V44 = user_preference         (backend-core T-MARKET)
V45 = mcp_audit               (backend-core T-MCP)
```

ai-engineer R1 dispatch가 main HEAD audit 결과 **V40~V46 모두 점유 사실** 발견:

```bash
$ git fetch origin main && ls api/src/main/resources/db/migration/ | grep "^V4" | sort
V40__order_event_outbox.sql
V41__stomp_event.sql
V42__instrument_status_history.sql
V43__order_request_add_strategy_id.sql
V44__system_event.sql
V45__order_request_backfill_manual_source.sql
V46__backtest_run_strategy_id.sql
```

→ R0 spec V40~V45 LOCK 전체 무효 → R1·R2 sub-agent 5명 동시 영향 → 헌법 §7 escalation 가동:

1. **sub-agent escalation** — ai-engineer 작업 0 발행 + orchestrator 보고
2. **orchestrator R1·R2 dispatched sub-agent 즉시 kill** — market-data + backend-core T-MARKET 즉시 kill
3. **architect R0 결함 fix amend PR dispatch** — R0 amend PR #675 (60449432) V47~V52 재분배 LOCK + ADR 0102 신설
4. **amend 머지 + 정합 LOCK 검증**
5. **R1·R2 sub-agent 재 dispatch (헌법 §2 정리 4단계 완료 후)**

### 2-2. ADR 0102 본문 LOCK — spec/plan 발행 직전 5단계 audit 절차

**대상 영속 자원 매트릭스 (6 영역 LOCK)**:

| # | 영속 자원 | 위치 | audit 명령 (예시) | 충돌 시 shift 방식 |
|---|---|---|---|---|
| 1 | **Flyway** | `api/src/main/resources/db/migration/` | `git ls-tree origin/main api/src/main/resources/db/migration/ \| grep "^.*V[0-9]"` | next-available version (V47, V48...) |
| 2 | **Kafka topic** | `KafkaTopicConfig.kt` + grep | `git grep "TOPIC_" origin/main -- '*.kt'` | 도메인 prefix 추가 |
| 3 | **Redis key** | 코드 grep | `git grep "redis" origin/main -- '*.kt' \| grep "key\|prefix"` | 차별 prefix |
| 4 | **STOMP topic** | `WebSocketConfig` + grep | `git grep "/topic/" origin/main -- '*.kt'` | namespace 분리 |
| 5 | **REST endpoint** | controller grep | `git grep "@RequestMapping\|@GetMapping\|..." origin/main -- '*.kt'` | path 충돌 시 별 path |
| 6 | **ENV 변수** | `.env.example` + grep | `git grep "MAGICJAR_" origin/main -- '*.kt' '*.yml' '.env*'` | 도메인 prefix |

**면제 조건 3건 (architect 자율 판단 슬롯)**:
- **md only PR** (운영 코드 0 touch · ADR 본문 정합·헌법 §amend·CHANGELOG row 추가)
- **hotfix PR** (시급한 결함 fix · 영속 자원 신설 0건 본질)
- **이미 LOCK된 자원의 amend 본문 수정** (새 자원 발행 0건 본질)

**위반 시 escalation 경로 5단계** (헌법 §7 정합):
- sub-agent escalation → orchestrator kill → architect amend → 정합 머지 → 재 dispatch

### 2-3. ADR 0102 W4 P1 amend — 내부 도메인 모델 inventory 영역 확장 후보

ADR 0101 §2-2 DDL `user_id BIGINT REFERENCES user_account(id)` 초안 vs 실 schema (`user_account.user_id VARCHAR(20)` KIS 계좌번호 자연 키 · ADR 0046 §2-1) 불일치 발견 (R1 backend-core PR #676 audit) → ADR 0101 W4 P1 amend (`VARCHAR(20)` 실 schema 정합 정정).

본 사례는 ADR 0102 영역 확장 후보 cross-ref 1건 등재 (§5-4):

| # | 사례 evidence | 결함 본질 | 누적 |
|---|---|---|---|
| 1 | ADR 0101 §2-2 DDL `user_id BIGINT` 초안 (W4 P1 amend) | 기존 표 컬럼 타입·PK 자연/surrogate 구분 미인지 | 1 |

**확장 후보 영역**: **내부 도메인 모델 inventory** (기존 표 컬럼 타입 + PK 자연/surrogate 구분 + JPA Entity field 타입 등). 누적 3건 시 ADR 0102 §2-2 7번째 영역 추가 amend 발행 의제.

## §3. ADR 0103 신설 — JpaScanConfiguration 신규 패키지 누락 차단 (장기 fix 옵션 매트릭스 + 채택안 LOCK)

### 3-1. 본 ADR 발생 trigger (W4 P1 R3 qa 부팅 차단 1줄 hotfix evidence)

2026-05-24 W4 R3 qa Visual 회귀 dispatch가 docker logs 검증 단계에서:

```
APPLICATION FAILED TO START
Parameter 0 of constructor in McpAuditService required a bean of type
'kr.spdaewoon.magicjar.api.mcp.persistence.McpAuditJpaRepository' that could not be found.
```

→ exit code 1 → api·batch·consumer 3 컨테이너 RED.

**Root cause**: R2 backend-core T-MCP Phase 1 (PR #679) 신규 `api.mcp.persistence` 패키지 신설 시 `JpaScanConfiguration.kt` 화이트리스트 (ADR 0088 v3.7.1 hotfix #2 권위) 갱신 누락. Spring Boot `JpaRepositoriesAutoConfiguration` fallback 룰 (main class 패키지 = `kr.spdaewoon.magicjar` 자동 scan) 은 `@EnableJpaRepositories` 1회 등장 시 비활성화 → 화이트리스트 누락 패키지 자동 fallback 0 → bean 미발견 → 부팅 차단.

### 3-2. R3 qa 자율 hotfix (1줄 add-only · `feedback_conflict_resolution_autonomy` 정합)

R3 qa PR #681 commit 062abecd 머지 완료 — 1줄 add-only + KDoc 7줄 사유:

```kotlin
@EnableJpaRepositories(
    basePackages = [
        "kr.spdaewoon.magicjar.api.persistence",
        "kr.spdaewoon.magicjar.api.mcp.persistence",   // ← R3 qa hotfix (W4 P1)
        "kr.spdaewoon.magicjar.persistence.shared",
    ],
)
```

본 hotfix 머지 후 docker 재기동 → 3 컨테이너 GREEN 복귀.

## §4. 운영 ADR 양식 3 슬롯 — v3.9.0 첫 4회 적용 사례 (헌법 §9-5 정합)

운영 단계 진입 후 모든 신규 ADR §결과 직전에 다음 3 슬롯 의무 추가 (헌법 §9-5):

1. **SLO 영향** — 본 결정이 §9-1 SLO에 미치는 영향
2. **rollback plan** — 본 결정이 운영에 부적합 발견 시 즉시 되돌리는 절차
3. **관측 매트릭스** — 본 결정 결과를 운영 단계에서 측정하는 metric/alert + Visual 회귀 시나리오 (frontend 영향 시)

**v3.9.0 사이클은 운영 ADR 양식 3 슬롯 첫 4회 적용 사례**:

| ADR | SLO 영향 (§6-1/§5-1/§4-1) | rollback plan (§6-2/§5-2/§4-2) | 관측 매트릭스 (§6-3/§5-3/§4-3) |
