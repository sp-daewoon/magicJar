magicjar:
  ai:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0.3
    max-tokens: 4096
    timeout: 30s
    long-timeout: 60s
    fallback:
      enabled: false
      provider: ollama
      model: llama3.1:8b
    prompt-cache:
      enabled: true

spring:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${MAGICJAR_AI_MODEL:claude-sonnet-4-6}
          temperature: 0.3
          max-tokens: 4096
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${MAGICJAR_AI_FALLBACK_MODEL:llama3.1:8b}
          temperature: 0.3

resilience4j:
  circuitbreaker:
    instances:
      ai-primary:
        failure-rate-threshold: 60
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 1m
        permitted-number-of-calls-in-half-open-state: 2
