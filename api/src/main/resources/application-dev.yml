# dev profile 오버라이드
# PR-6+ 활성화 예정: KIS endpoint, base URL, dev-specific 설정 등
#
# 주의: dev profile은 거래 모드가 아니다. 기본 profile이 dev,real-kis 이므로
# 자본/QA 기능 권한을 dev profile 기본값으로 열지 않는다.
# Scenario Replay 실행은 application.yml의 MAGICJAR_SCENARIO_REPLAY_ENABLED 명시값이 권위다.

# 예시 (PR-6에서 채움):
# magicjar:
#   kis:
#     base-url: https://openapi.koreainvestment.com:9443
#     ws-url: ws://ops.koreainvestment.com:21000
