magicjar:
  mode: MOCK
  allow-real: false
  ai:
    # mock profile은 AI 호출 0 — MockAnalysisAssistant 강제 (ADR 0046).
    enabled: true
    mock-mode: mock

# Anthropic autoconfig 강제 비활성 (mock 환경에서 LLM 호출 0).
spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.anthropic.AnthropicAutoConfiguration
