spring:
  application:
    name: magicjar-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magicjar}
    username: ${DB_USER:magicjar}
    password: ${DB_PASSWORD:magicjar}
  flyway:
    enabled: true
    # baseline-version=0으로 명시 → V0__init.sql부터 정상 적용.
    # batch/consumer가 spring.batch metadata 테이블을 먼저 만들어도 baseline에 영향 X.
    # (기본 baseline-version=1이라 V0·V1을 둘 다 skip하던 문제 해결)
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      group-id: ${KAFKA_GROUP_ID:magicjar-api}
      auto-offset-reset: earliest

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics

spring.ai:
  openai:
    # api는 OpenAI 호출 안 함. autoconfig를 명시적으로 disabled.
    api-key: ${OPENAI_API_KEY:placeholder-not-used}
    chat:
      enabled: ${OPENAI_API_KEY_PRESENT:false}
      options:
        model: ${OPENAI_MODEL:gpt-4o-mini}
    embedding:
      enabled: false
    image:
      enabled: false
    audio:
      transcription:
        enabled: false
      speech:
        enabled: false
    moderation:
      enabled: false
  anthropic:
    # ANTHROPIC_API_KEY 미설정 시 placeholder → AnthropicChatModel 빈 미등록 → mock fallback.
    # 사용자 트리거 분석 보조 (ADR 0046, T16).
    api-key: ${ANTHROPIC_API_KEY:placeholder-not-used}
    chat:
      options:
        model: ${MAGICJAR_AI_MODEL:claude-sonnet-4-5}
        max-tokens: 1024
        temperature: 0.4

magicjar:
  mode: ${MAGICJAR_MODE:MOCK}
  allow-real: ${MAGICJAR_ALLOW_REAL:false}
  pyworker:
    base-url: ${PYWORKER_URL:http://localhost:8000}
  batch:
    base-url: ${BATCH_URL:http://localhost:8081}
  devlog:
    # 개발일지 HTML 디렉토리. 컨테이너 내부에선 docker-compose volume mount path.
    # `/devlog` 슬래시 커멘드가 작성, DevlogController가 frontend로 노출.
    dir: ${MAGICJAR_DEVLOG_DIR:_workspace/devlog}
  mcp:
    api-key: ${MAGICJAR_MCP_API_KEY:}
    protocol-version: 2025-03-26
    server-name: magicjar-mcp
    server-version: 0.1.0
  ai:
    # AI 분석 보조 (사용자 트리거 한정, ADR 0046).
    # default false — mock 환경에서 비용 0.
    # 활성화: ANTHROPIC_API_KEY 설정 + MAGICJAR_AI_ENABLED=true.
    enabled: ${MAGICJAR_AI_ENABLED:false}
    provider: ${MAGICJAR_AI_PROVIDER:anthropic}
    model: ${MAGICJAR_AI_MODEL:claude-sonnet-4-5}
    # auto: 키 없으면 자동 mock · mock: 강제 mock · real: 키 필수 (없으면 부팅 실패 X, 503 응답)
    mock-mode: ${MAGICJAR_AI_MOCK_MODE:auto}
    timeout: 45s
    max-tokens: 1024
    temperature: 0.4
    price-per-input-token: 0.000003
    price-per-output-token: 0.000015

logging:
  level:
    root: INFO
    com.mj: DEBUG
