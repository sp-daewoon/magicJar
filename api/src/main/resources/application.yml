spring:
  application:
    name: magicjar-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magicjar}
    username: ${DB_USER:magicjar}
    password: ${DB_PASSWORD:magicjar}
  flyway:
    enabled: true
    # baseline-version=0으로 명시 → V0__init.sql부터 정상 적용.
    # batch/consumer가 spring.batch metadata 테이블을 먼저 만들어도 baseline에 영향 X.
    # (기본 baseline-version=1이라 V0·V1을 둘 다 skip하던 문제 해결)
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.mj"
      group-id: ${KAFKA_GROUP_ID:magicjar-api}
      auto-offset-reset: earliest

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics

spring.ai:
  openai:
    # api는 AI 호출 안 함. autoconfig를 명시적으로 disabled.
    api-key: ${OPENAI_API_KEY:placeholder-not-used}
    chat:
      enabled: ${OPENAI_API_KEY_PRESENT:false}
      options:
        model: ${OPENAI_MODEL:gpt-4o-mini}
    embedding:
      enabled: false
    image:
      enabled: false
    audio:
      transcription:
        enabled: false
      speech:
        enabled: false
    moderation:
      enabled: false

magicjar:
  mode: ${MAGICJAR_MODE:MOCK}
  allow-real: ${MAGICJAR_ALLOW_REAL:false}
  pyworker:
    base-url: ${PYWORKER_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.mj: DEBUG
