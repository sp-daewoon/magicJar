version: "1.0"
metadata:
  name: golden_cross_5_20
  description: 5일·20일 이동평균 골든크로스 진입 + 데드크로스 청산
  author: kis-strategy-builder
  tags: [trend_following, ma_cross]
strategy:
  id: golden_cross_5_20
  category: trend_following
  indicators:
    - id: ma
      alias: ma5
      params: { period: 5 }
    - id: ma
      alias: ma20
      params: { period: 20 }
  entry:
    logic: AND
    conditions:
      - lhs: { alias: ma5 }
        op: cross_above
        rhs: { alias: ma20 }
  exit:
    logic: AND
    conditions:
      - lhs: { alias: ma5 }
        op: cross_below
        rhs: { alias: ma20 }
risk:
  stop_loss:
    enabled: true
    percent: 0.05
