version: "1.0"
metadata:
  name: ema_trend_filter
  description: EMA 60 위에서만 매수 — 장기 추세 필터 (RSI 골든크로스 + EMA 위)
  author: kis-strategy-builder
  tags: [trend_following, filter]
strategy:
  id: ema_trend_filter
  category: trend_following
  indicators:
    - id: ema
      alias: ema60
      params: { period: 60 }
    - id: rsi
      alias: rsi14
      params: { period: 14 }
  entry:
    logic: AND
    conditions:
      - lhs: { price: close }
        op: greater_than
        rhs: { alias: ema60 }
      - lhs: { alias: rsi14 }
        op: cross_above
        rhs: { value: 50 }
  exit:
    logic: OR
    conditions:
      - lhs: { price: close }
        op: less_than
        rhs: { alias: ema60 }
      - lhs: { alias: rsi14 }
        op: less_than
        rhs: { value: 40 }
risk:
  stop_loss:
    enabled: true
    percent: 0.05
