version: "1.0"
metadata:
  name: week52_high_breakout
  description: 250일 이동평균 + 종가 250일 고가 근접 — 52주 신고가 모방
  author: kis-strategy-builder
  tags: [breakout, long_term]
strategy:
  id: week52_high_breakout
  category: breakout
  indicators:
    - id: ma
      alias: ma250
      params: { period: 250 }
  entry:
    logic: AND
    conditions:
      - lhs: { price: close }
        op: greater_than
        rhs: { alias: ma250 }
      - lhs: { price: close }
        op: cross_above
        rhs: { alias: ma250 }
  exit:
    logic: AND
    conditions:
      - lhs: { price: close }
        op: less_than
        rhs: { alias: ma250 }
risk:
  stop_loss:
    enabled: true
    percent: 0.07
