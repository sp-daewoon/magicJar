version: "1.0"
metadata:
  name: consecutive_three_white_soldiers
  description: 연속 양봉(Three White Soldiers) 패턴 진입 + RSI 70 이상 청산
  author: kis-strategy-builder
  tags: [pattern, candlestick]
strategy:
  id: consecutive_three_white_soldiers
  category: pattern
  indicators:
    - id: rsi
      alias: rsi14
      params: { period: 14 }
  patterns:
    - code: three_white_soldiers
  entry:
    logic: AND
    conditions:
      - pattern: three_white_soldiers
        expected: true
  exit:
    logic: OR
    conditions:
      - lhs: { alias: rsi14 }
        op: greater_than
        rhs: { value: 70 }
      - pattern: three_black_crows
        expected: true
risk:
  stop_loss:
    enabled: true
    percent: 0.05
