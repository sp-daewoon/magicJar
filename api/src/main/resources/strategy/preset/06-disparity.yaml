version: "1.0"
metadata:
  name: disparity_mean_reversion
  description: 이격도(disparity 20) 95 이하 진입 + 105 이상 청산
  author: kis-strategy-builder
  tags: [mean_reversion, disparity]
strategy:
  id: disparity_mean_reversion
  category: mean_reversion
  indicators:
    - id: disparity
      alias: disp20
      params: { period: 20 }
  entry:
    logic: AND
    conditions:
      - lhs: { alias: disp20 }
        op: less_equal
        rhs: { value: 95 }
  exit:
    logic: AND
    conditions:
      - lhs: { alias: disp20 }
        op: greater_equal
        rhs: { value: 105 }
risk:
  stop_loss:
    enabled: true
    percent: 0.04
