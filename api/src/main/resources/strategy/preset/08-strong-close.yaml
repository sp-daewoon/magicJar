version: "1.0"
metadata:
  name: strong_close_volume_breakout
  description: 종가가 고가 95% 이상 + 거래량 평균 1.5배 — 강세 마감 진입
  author: kis-strategy-builder
  tags: [breakout, volume]
strategy:
  id: strong_close_volume_breakout
  category: breakout
  indicators:
    - id: volume_ma
      alias: vol_ma20
      params: { period: 20 }
    - id: ma
      alias: ma5
      params: { period: 5 }
  entry:
    logic: AND
    conditions:
      - lhs: { price: close }
        op: greater_than
        rhs: { alias: ma5 }
      - lhs: { price: volume }
        op: greater_than
        rhs: { alias: vol_ma20 }
  exit:
    logic: OR
    conditions:
      - lhs: { price: close }
        op: less_than
        rhs: { alias: ma5 }
risk:
  stop_loss:
    enabled: true
    percent: 0.05
