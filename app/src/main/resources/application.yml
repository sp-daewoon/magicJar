spring:
  application:
    name: magicjar
  config:
    import:
      - optional:classpath:application-market-data.yml
  profiles:
    active: mock
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/magicjar}
    username: ${SPRING_DATASOURCE_USERNAME:magicjar}
    password: ${SPRING_DATASOURCE_PASSWORD:magicjar}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

magicjar:
  mode: ${MAGICJAR_MODE:MOCK}
  allow-real: ${MAGICJAR_ALLOW_REAL:false}
  harness:
    enabled: ${MAGICJAR_HARNESS_ENABLED:true}

logging:
  level:
    root: INFO
    kr.spdaewoon.magicjar: DEBUG
