spring:
  profiles:
    active: dev,real-kis
  application:
    name: magicjar-batch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magicjar}
    username: ${DB_USER:magicjar}
    password: ${DB_PASSWORD:magicjar}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false  # api 모듈만 Flyway 실행 (ADR 0006 §마이그레이션)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: magicjar-batch
      auto-offset-reset: earliest
  batch:
    job:
      enabled: false  # 자동 실행 차단 — PR-7+에서 트리거 명시

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

magicjar:
  mode: ${MAGICJAR_MODE:MOCK}
  allow-real: ${MAGICJAR_ALLOW_REAL:false}
  instrument:
    # 부팅 직후 즉시 sync (dev=true 권장, prd=false — cron만)
    sync-at-boot: ${MAGICJAR_INSTRUMENT_SYNC_AT_BOOT:false}
    # KIS 종목 마스터 zip URL (KIS-first — kis-api-reference.md §6)
    kospi-mst-url: ${MAGICJAR_KIS_KOSPI_MST_URL:https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip}
    kosdaq-mst-url: ${MAGICJAR_KIS_KOSDAQ_MST_URL:https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip}
    # KIS 비활성화 (test profile·CI 환경 — 시드 fallback 사용)
    kis-disabled: ${MAGICJAR_INSTRUMENT_KIS_DISABLED:false}
    # 시드 파일 경로 (classpath 기준)
    seed-path: ${MAGICJAR_INSTRUMENT_SEED_PATH:instrument-seed.json}
