spring:
  application:
    name: magicjar-batch
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:stub-kis}
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  main:
    # spring-ai-openai-starter가 webflux를 끌어와 기본 reactive로 잡히는 문제를 강제로
    # servlet으로 고정. actuator health 엔드포인트는 servlet 위에서 노출.
    web-application-type: servlet
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magicjar}
    username: ${DB_USER:magicjar}
    password: ${DB_PASSWORD:magicjar}
  flyway:
    enabled: false   # api가 DB owner
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false   # 명시 트리거만 실행
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      group-id: ${KAFKA_GROUP_ID:magicjar-batch}
      auto-offset-reset: earliest

spring.ai:
  openai:
    api-key: ${OPENAI_API_KEY:placeholder-not-used}
    chat:
      enabled: ${OPENAI_API_KEY_PRESENT:false}
      options:
        model: ${OPENAI_MODEL:gpt-4o-mini}
    embedding:
      enabled: false
    image:
      enabled: false
    audio:
      transcription:
        enabled: false
      speech:
        enabled: false
    moderation:
      enabled: false

server:
  port: 8081
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics

magicjar:
  mode: ${MAGICJAR_MODE:BACKTEST}
  allow-real: ${MAGICJAR_ALLOW_REAL:false}
  kis:
    mode: STUB
  kafka:
    topics:
      # D (2026-05-04): api → batch 일봉 backfill 명령 토픽
      marketCandleBackfillCommand: market.candle.backfill.command.v1

logging:
  level:
    root: INFO
    com.mj: DEBUG

---
spring:
  config:
    activate:
      on-profile: stub-kis
magicjar:
  kis:
    mode: STUB

---
spring:
  config:
    activate:
      on-profile: real-kis
magicjar:
  kis:
    # 데이터 조회 정책: 실전 키 + 실전 URL 사용 (사용자 정책 — 모의 키는 주문 전용).
    mode: REAL
    base-url: https://openapi.koreainvestment.com:9443
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    account: ${KIS_ACCOUNT_CANO:}-${KIS_ACCOUNT_PRDT:01}
