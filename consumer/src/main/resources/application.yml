spring:
  application:
    name: magicjar-consumer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    # P4 자율 hotfix — OPENAI_API_KEY 미설정 시 Spring AI autoconfig가 Moderation/Image 등
    # 빈 생성에서 실패해 컨텍스트 자체가 죽는 문제를 회피. 실제 ChatModel은 ai 모듈에서 생성.
    # OPENAI_API_KEY 채워지면 별도 @Configuration에서 명시 enable 처리 (Phase E).
    # ※ Anthropic autoconfig는 exclude하지 않음 — 키 미설정 시 빈 자체가 만들어지지 않으므로
    #   AnthropicAiConfig의 @ConditionalOnBean(AnthropicChatModel)으로 안전하게 차단됨.
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magicjar}
    username: ${DB_USER:magicjar}
    password: ${DB_PASSWORD:magicjar}
  flyway:
    enabled: false   # api가 DB owner
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      group-id: ${KAFKA_GROUP_ID:magicjar-consumer}
      auto-offset-reset: earliest

spring.ai:
  openai:
    # 키 비어있으면 hasText 검증으로 빈 생성 실패 → autoconfig 비활성으로 우회.
    # 실제 호출 필요 시 OPENAI_API_KEY 채우고 enabled=true로.
    api-key: ${OPENAI_API_KEY:placeholder-not-used}
    chat:
      enabled: ${OPENAI_API_KEY_PRESENT:false}
      options:
        model: ${OPENAI_MODEL:gpt-4o-mini}
    embedding:
      enabled: false
    image:
      enabled: false
    audio:
      transcription:
        enabled: false
      speech:
        enabled: false
    moderation:
      enabled: false
  anthropic:
    # ANTHROPIC_API_KEY 미설정 시 빈 문자열 → autoconfig가 ChatModel 빈 자체를 만들지 않음.
    # AnthropicAiConfig는 @ConditionalOnBean(AnthropicChatModel)이므로 안전하게 비활성.
    api-key: ${ANTHROPIC_API_KEY:}
    chat:
      options:
        # 감성 분석은 haiku 4.5로 충분 — 비용·지연 최소화. opus는 차후 복잡 task용.
        model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
        temperature: 0.2
        max-tokens: 1024

server:
  port: 8082
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics

kis:
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  account-no: ${KIS_ACCOUNT_NO:}
  base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
  ws-url: ${KIS_WS_URL:ws://ops.koreainvestment.com:21000}
  rate:
    capacity-per-second: ${KIS_RATE_CAPACITY:15}
    order-per-second: ${KIS_RATE_ORDER:5}

magicjar:
  mode: ${MAGICJAR_MODE:MOCK}
  allow-real: ${MAGICJAR_ALLOW_REAL:false}
  guard:
    market-session:
      # dev profile에서 장외 시간(주말·공휴일·오프아워)에도 주문 통과 허용.
      # prd profile에선 이 설정이 무시되고 항상 REJECT (ADR 0042).
      # mock profile에선 MarketSessionGuard Bean 자체가 미등록.
      offline-fallback: ${MAGICJAR_GUARD_SESSION_OFFLINE_FALLBACK:false}
    position-limit:
      # 종목당 포지션 비중 한도. 1차 매우 느슨한 값(10%) — 정상 매매 차단 0.
      # dev/prd 프로파일에서만 활성 (mock에선 Bean 미등록).
      # 운영 시 단계적 조정: _workspace/operations/order-policy.md 참조.
      limit-percent: ${MAGICJAR_GUARD_POSITION_LIMIT_PERCENT:0.10}
      # 전체 자본 추정액 (KRW). 계좌 잔고 조회 없이 1차 운영. 실거래 전환 시 실잔고로 교체.
      total-capital: ${MAGICJAR_GUARD_POSITION_TOTAL_CAPITAL:10000000}
    drawdown-stop:
      # 일일 손실 한도. 음수 값. 1차 매우 느슨한 값(-3%) — 정상 매매 차단 0.
      # dev/prd 프로파일에서만 활성 (mock에선 Bean 미등록).
      # 운영 시 단계적 조정: _workspace/operations/order-policy.md 참조.
      limit-percent: ${MAGICJAR_GUARD_DRAWDOWN_LIMIT_PERCENT:-0.03}
      # 전체 자본 추정액 (KRW). position-limit.total-capital과 같은 값 사용 권장.
      total-capital: ${MAGICJAR_GUARD_DRAWDOWN_TOTAL_CAPITAL:10000000}
  kis:
    # T2-T7 EGW00202 hotfix: POST 요청 hashkey 헤더 자동 첨부 (default true)
    hashkey-enabled: ${MAGICJAR_KIS_HASHKEY_ENABLED:true}
    # T2-T6 진단용 raw HTTP 로깅 (default false, dev에서만 활성화 권장)
    raw-http-logging: ${MAGICJAR_KIS_RAW_HTTP_LOGGING:false}
  ai:
    # 1차 통합: 기본 OFF. ANTHROPIC_API_KEY 채우고 enabled=true로 부팅 시 자동 활성.
    enabled: ${MAGICJAR_AI_ENABLED:false}
    provider: anthropic
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
    temperature: 0.2
    max-tokens: 1024
  kafka:
    topics:
      tick: market.tick.v1
      candle1m: market.candle.1m.v1
      # ADR 0048: TickToMinuteAggregator → api CandleMinuteEventListener 전용 토픽
      candleMinuteAggregated: candle.minute.aggregated.v1
      newsRaw: news.raw.v1
      newsAnalyzed: news.analyzed.v1
      dartDisclosure: dart.disclosure.v1
      screenshotCaptured: screenshot.captured.v1
      signal: signal.v1
      signalGenerated: signal.generated.v1
      orderIntent: order.intent.v1
      orderExecuted: order.executed.v1
      journalEntry: journal.entry.v1
    consumer-groups:
      signal-engine: magicjar-signal-engine
      tick-aggregator: magicjar-tick-aggregator

logging:
  level:
    root: INFO
    com.mj: DEBUG
