services:
  postgres:
    image: postgres:15
    container_name: magicjar-postgres
    environment:
      POSTGRES_DB: magicjar
      POSTGRES_USER: magicjar
      POSTGRES_PASSWORD: magicjar
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - magicjar-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: magicjar-redis
    ports:
      - "6379:6379"
    volumes:
      - magicjar-redis-data:/data

volumes:
  magicjar-postgres-data:
  magicjar-redis-data:
