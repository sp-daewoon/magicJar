# magicJar 개발 모드 override (volume mount + 핫 리로드)
# 사용:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d
#
# - JVM 앱: build/libs를 mount 해 ./gradlew bootJar 후 컨테이너 재시작 없이 갱신
#   (완전한 핫 리로드는 IDE bootRun + infra 모드를 권장)
# - pyworker: app/ 디렉토리 mount + uvicorn --reload
# - frontend: src/ mount는 vite dev server를 별도 컨테이너로 띄우는 형태가 권장이나,
#   compose 일관성을 위해 volume mount만 표기 (실제 핫 리로드는 host의 `pnpm dev`로 권장)

name: magicjar

services:
  api-app:
    volumes:
      - ../api/build/libs:/app/libs:ro
    environment:
      SPRING_PROFILES_ACTIVE: dev,real-kis
      LOGGING_LEVEL_COM_MJ: TRACE

  batch-app:
    volumes:
      - ../batch/build/libs:/app/libs:ro
    environment:
      SPRING_PROFILES_ACTIVE: dev,real-kis
      LOGGING_LEVEL_COM_MJ: TRACE

  consumer-app:
    volumes:
      - ../consumer/build/libs:/app/libs:ro
    environment:
      SPRING_PROFILES_ACTIVE: dev,real-kis
      LOGGING_LEVEL_COM_MJ: TRACE

  pyworker:
    volumes:
      - ../pyworker/app:/app/app:ro
    environment:
      UVICORN_RELOAD: "true"
    # uvicorn --reload는 ENTRYPOINT를 덮어써야 동작
    entrypoint:
      - /app/.venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  frontend:
    volumes:
      - ../frontend/src:/usr/share/nginx/html-src:ro
    # 실제 핫 리로드는 호스트의 `pnpm -C frontend dev`(포트 5173) 사용 권장
