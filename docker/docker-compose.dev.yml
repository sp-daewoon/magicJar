# magicJar 개발 모드 override (dev 프로파일·로그 레벨·브리지 좌표)
# 사용:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d
#
# - JVM 앱: jar volume mount는 2026-07-03 감사 §6-8로 제거 — ENTRYPOINT가 이미지 빌드 시
#   COPY된 /app/app.jar만 읽으므로 build/libs mount는 실효 0(핫 리로드 착시)이었다.
#   핫 리로드는 IDE bootRun + infra compose(docker-compose.infra.yml) 사용.
#   컨테이너 갱신은 scripts/build-and-deploy.sh (bootJar → build → up) 정석 경로.
# - frontend: 실제 핫 리로드는 호스트의 `pnpm -C frontend dev`(포트 5173) 사용 권장.

name: magicjar

services:
  api-app:
    environment:
      SPRING_PROFILES_ACTIVE: dev,real-kis
      # 감사 §6-8 — 舊 LOGGING_LEVEL_COM_MJ 는 com.mj 패키지 부재로 no-op. 실패키지로 정정.
      LOGGING_LEVEL_KR_SPDAEWOON_MAGICJAR: INFO
      MAGICJAR_STRATEGY_RESEARCH_AI_DISCOVERY_BRIDGE_URL: ${MAGICJAR_STRATEGY_RESEARCH_AI_DISCOVERY_BRIDGE_URL:-http://host.docker.internal:8787}
      MAGICJAR_STRATEGY_RESEARCH_AI_DISCOVERY_TIMEOUT_SECONDS: ${MAGICJAR_STRATEGY_RESEARCH_AI_DISCOVERY_TIMEOUT_SECONDS:-300}

  batch-app:
    environment:
      SPRING_PROFILES_ACTIVE: dev,real-kis
      LOGGING_LEVEL_KR_SPDAEWOON_MAGICJAR: INFO

  consumer-app:
    environment:
      SPRING_PROFILES_ACTIVE: dev,real-kis
      LOGGING_LEVEL_KR_SPDAEWOON_MAGICJAR: INFO
