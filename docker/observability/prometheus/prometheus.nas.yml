# NAS-only Prometheus config — remote runtime targets only.
# IDE bootRun targets are intentionally excluded.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: magicjar-nas
    environment: nas

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: magicjar-api-docker
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["api-app:8080"]
        labels:
          application: magicjar-api
          mode: docker

  - job_name: magicjar-batch-docker
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["batch-app:8081"]
        labels:
          application: magicjar-batch
          mode: docker

  - job_name: magicjar-consumer-docker
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["consumer-app:8082"]
        labels:
          application: magicjar-consumer
          mode: docker

  - job_name: magicjar-alertmanager
    metrics_path: /metrics
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: prometheus-self
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
