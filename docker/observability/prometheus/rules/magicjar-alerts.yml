# magicJar Prometheus alert rules — 2026-07-03 시스템 감사 §3-⑧ (ADR 0095 routing matrix 최소 이행)
#
# metric 이름 검증 기준 (2026-07-03 코드 실측):
#   - up                                        : Prometheus 내장 (scrape 성공 여부)
#   - kafka_consumer_records_consumed_total     : Spring Kafka client metric — SLO 대시보드
#       (magicjar-slo.json S-5 killswitch panel)와 동일 관례. 클라이언트 버전에 따라
#       kafka_consumer_fetch_manager_records_consumed_total 로 노출될 수 있어 __name__ regex 로 둘 다 수용.
#   - magicjar_system_events_total              : PersistenceMetrics.METRIC_SYSTEM_EVENTS
#       ("magicjar.system.events" Counter, tag event_type — WS_DISCONNECTED/WS_CONNECTED/WS_RECONNECTED emit 실측)
#   - magicjar_outbox_drain_lag_seconds         : PersistenceMetrics.METRIC_OUTBOX_DRAIN_LAG
#       ("magicjar.outbox.drain.lag.seconds" Gauge, tag outbox=order|notification)
#   - magicjar_signal_to_order_latency_seconds_bucket : PersistenceMetrics.METRIC_SIGNAL_TO_ORDER_LATENCY
#       (Timer publishPercentileHistogram — ADR 0095 S-1, SLO 대시보드 P95 panel과 동일 query)
#
# 시간 주의: Prometheus time 함수는 UTC. KST 장중 09:00~15:30 = UTC 00:00~06:30.
# severity 라벨(critical|warning)이 Alertmanager 라우팅 축 (alertmanager.yml route 정합).

groups:
  - name: magicjar-availability
    rules:
      # (a) 모듈 프로세스 down — docker/bootRun 두 매트릭스가 동시에 등록돼 있으므로
      #     job 단위(up==0)로 걸면 비활성 모드가 상시 발화한다. application 라벨 단위로
      #     "두 모드 전부 DOWN"일 때만 발화 (prometheus.yml 헤더 "비활성 타깃 DOWN 에러 0" 정합).
      - alert: MagicjarInstanceDown
        expr: max by (application) (up{application=~"magicjar-.*"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }} 프로세스 down (docker·bootRun 양쪽 모두 scrape 실패 2분 지속)"
          description: "시세 수집·전략·주문 경로 정지 가능. R-1 runbook 진입 → docker compose ps / docker logs 확인."

  - name: magicjar-trading-path
    rules:
      # (b) 장중 시그널 부재 — 전용 시그널 Counter 미존재(2026-07-03 실측)로
      #     signal.generated 토픽(kafka.consumer.evt.strategy.signal-generated.v1) 소비 카운터를 proxy 사용.
      #     평가창: UTC 02:00~06:30 (= KST 11:00~15:30 — 2h lookback이 장중에 머물도록 개장 후 2h 제외), 평일만.
      #     한계: KRX 공휴일 미반영(공휴일 오발화 가능) + ACTIVE 전략 0개면 정상적으로도 0건.
      - alert: MagicjarNoSignalDuringMarketHours
        expr: |
          (
            sum(increase({__name__=~"kafka_consumer_records_consumed_total|kafka_consumer_fetch_manager_records_consumed_total",topic="kafka.consumer.evt.strategy.signal-generated.v1"}[2h])) == 0
          )
          and on() ((hour() * 60 + minute()) >= 120)
          and on() ((hour() * 60 + minute()) <= 390)
          and on() (day_of_week() >= 1)
          and on() (day_of_week() <= 5)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "장중(KST 09:00~15:30) 시그널 발행 0건 2시간 지속"
          description: "silent rot 신호 — 전략 평가·캔들 파이프라인·WS tick 공급 점검. 공휴일/ACTIVE 전략 0개면 false positive 가능."

      # (c) KIS WS 단절 지속 — 연결 상태 Gauge 미존재(KisWebSocketBridge 실측)로
      #     SystemEvent Counter 근사: 최근 20분 내 WS_DISCONNECTED 발생 + 최근 10분 내 (재)연결 0건.
      #     정확한 상태 관측은 consumer에 connected Gauge 신설 필요 (본 파일 소관 밖 — deferral).
      - alert: MagicjarKisWsDisconnected
        expr: |
          sum(increase(magicjar_system_events_total{event_type="WS_DISCONNECTED"}[20m])) > 0
          unless
          sum(increase(magicjar_system_events_total{event_type=~"WS_CONNECTED|WS_RECONNECTED"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "KIS WS 단절 후 10분 이상 재연결 evidence 없음"
          description: "HOLDING·PENDING_BUY·STRATEGY tick 공급 정지 위험 (ADR 0114/0124). docker logs magicjar-consumer | grep -i 'WS' 확인 → R-1."

      # (d) outbox drain lag SLO 위반 — ADR 0095 S 관측 (30s 초과 5분 지속)
      - alert: MagicjarOutboxDrainLagHigh
        expr: max by (outbox) (magicjar_outbox_drain_lag_seconds) > 30
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "outbox({{ $labels.outbox }}) drain lag > 30s 5분 지속"
          description: "가장 오래된 PENDING row 체류 {{ $value }}s — 주문/알림 relay 정체. consumer 로그 + outbox 테이블 PENDING 확인."

      # (e) signal→order latency S-1 — P95 > 5s 5분 지속 (ADR 0095 §2-1 S-1)
      - alert: MagicjarSignalToOrderLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(magicjar_signal_to_order_latency_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "signal→order intent P95 latency > 5s (S-1 SLO 위반)"
          description: "P95 {{ $value }}s — Kafka lag·risk gateway 지연·DB 경합 점검. SLO 대시보드(magicjar-slo) 동일 panel 참조."
