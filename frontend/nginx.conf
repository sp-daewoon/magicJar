server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy — frontend nginx가 같은 origin(/api)으로 들어오는 호출을 api 컨테이너에 위임.
    # 이게 없으면 SPA fallback(location /)이 잡아 index.html을 응답해 클라이언트 JSON 파싱 실패.
    # docker compose 네트워크 alias `api-app:8080` 으로 라우팅. (vite dev proxy와 등가)
    location /api/ {
        proxy_pass http://api-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # actuator도 api로 위임 (health check / debug 용도)
    location /actuator/ {
        proxy_pass http://api-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket(STOMP) — Upgrade·Connection 헤더 필수.
    location /ws {
        proxy_pass http://api-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — React Router history mode 대응
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 no-cache (배포 후 새 hash 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # 정적 자산 캐시 (hash 기반 cache busting이라 immutable 안전)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
