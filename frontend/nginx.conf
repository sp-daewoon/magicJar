server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 압축 — JS/CSS/JSON 번들 전송 최적화
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;

    # /api/ → api-app:8080 backend 프록시 (PR-13 hotfix)
    # docker compose 네트워크 안에서 service 명 'api-app'으로 접근.
    # 사용자 첫 dogfooding에서 SetupWizard POST /api/onboarding/kis/validate 405 정정.
    location /api/ {
        proxy_pass http://api-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 긴 응답 (KIS validate 등) 대비 타임아웃
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # /ws/ → STOMP WebSocket 프록시 (PR-10 T-S1 정합)
    # Upgrade·Connection 헤더 필수.
    location /ws/ {
        proxy_pass http://api-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # SPA history mode fallback — 모든 경로를 index.html로 서빙
    # React Router가 클라이언트에서 라우팅 처리
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐시 — Vite hash content-addressed 파일
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 은 캐시 비활성 (항상 최신 버전 제공)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        add_header Expires 0;
    }

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
