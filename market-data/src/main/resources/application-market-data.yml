kis:
  app-key: ${KIS_MOCK_APP_KEY:}
  app-secret: ${KIS_MOCK_APP_SECRET:}
  base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
  ws-url: ${KIS_WS_URL:ws://ops.koreainvestment.com:31000}
  account-cano: ${KIS_ACCOUNT_CANO:}
  account-prdt: ${KIS_ACCOUNT_PRDT:01}
  mock-mode: ${KIS_MOCK_MODE:true}
  rate:
    capacity-per-second: 15
    order-per-second: 5

dart:
  api-key: ${DART_API_KEY:}
  base-url: https://opendart.fss.or.kr

magicjar:
  marketdata:
    kis:
      fallback-samples: true
    news:
      enabled: true
      user-agent: "magicjar/0.1 (+https://github.com/sp-daewoon/magicJar)"
      rss-urls:
        - https://finance.naver.com/news/news_list.naver?mode=RANK

resilience4j:
  circuitbreaker:
    instances:
      kisQuote:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      kisOrder:
        slidingWindowSize: 10
        failureRateThreshold: 40
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
  retry:
    instances:
      kisQuote:
        maxAttempts: 3
        waitDuration: 200ms
        exponentialBackoffMultiplier: 2
      kisOrder:
        maxAttempts: 2
        waitDuration: 200ms
  timelimiter:
    instances:
      kisOrder:
        timeoutDuration: 5s
        cancelRunningFuture: true
