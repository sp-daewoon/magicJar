[project]
name = "magicjar-pyworker"
version = "0.1.0"
description = "magicJar pyworker — FastAPI + Playwright + APScheduler + aiokafka. 한국 뉴스/공시 크롤링 + 차트 캡처."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "magicJar team", email = "bot+ai-engineer@magicjar.local" },
]
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.0,<0.32",
    "httpx>=0.27.0,<0.28",
    "beautifulsoup4>=4.12.3,<5",
    "lxml>=5.3.0,<6",
    "playwright>=1.47.0,<2",
    "aiokafka>=0.11.0,<0.12",
    "apscheduler>=3.10.4,<4",
    "minio>=7.2.7,<8",
    "pydantic>=2.8.0,<3",
    "pydantic-settings>=2.4.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-mock>=3.14.0,<4",
    "respx>=0.21.1,<0.22",
    "ruff>=0.6.0,<0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-mock>=3.14.0,<4",
    "respx>=0.21.1,<0.22",
    "ruff>=0.6.0,<0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
