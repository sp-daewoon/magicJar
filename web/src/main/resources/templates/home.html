<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title/text()}, ~{::section})}">
<head><title>홈</title></head>
<body>
<section>
    <h1 class="text-2xl font-bold mb-4">오늘의 magicJar</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- 시장 개요 -->
        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <h2 class="text-sm font-semibold text-slate-500 mb-2">시장 개요 (KST)</h2>
            <div class="text-xs text-slate-600 leading-relaxed">
                <div>KOSPI / KOSDAQ 실시간 지수는 market-data 어댑터 조립 후 연결 예정입니다.</div>
                <div class="mt-2 text-slate-400">현재 시각: <span th:text="${#temporals.format(serverTimeKst, 'yyyy-MM-dd HH:mm:ss')}">-</span></div>
            </div>
        </div>

        <!-- 관심 종목 티커 -->
        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <h2 class="text-sm font-semibold text-slate-500 mb-2">관심 종목</h2>
            <ul class="divide-y divide-slate-100 text-sm">
                <li th:each="inst : ${watchlist}" class="py-2 flex items-center justify-between">
                    <a th:href="@{'/instruments/' + ${inst.code}}" class="hover:text-teal-700">
                        <span class="font-medium" th:text="${inst.name}">삼성전자</span>
                        <span class="text-slate-400 text-xs" th:text="${inst.code}">005930</span>
                    </a>
                    <span class="text-slate-500 text-xs" th:text="${inst.market}">KOSPI</span>
                </li>
                <li th:if="${watchlist.isEmpty()}" class="py-2 text-slate-400 text-xs">등록된 종목이 없습니다.</li>
            </ul>
        </div>

        <!-- 최근 매매 3건 -->
        <div class="bg-white rounded-lg shadow-sm p-4 border border-slate-200">
            <h2 class="text-sm font-semibold text-slate-500 mb-2">최근 매매</h2>
            <ul class="divide-y divide-slate-100 text-sm">
                <li th:each="e : ${recentTrades}" class="py-2">
                    <div class="flex items-center justify-between">
                        <span class="font-medium" th:text="${e.name}">-</span>
                        <span th:classappend="${e.side.name() == 'BUY'} ? 'mj-up' : 'mj-down'"
                              th:text="${e.side}">BUY</span>
                    </div>
                    <div class="text-xs text-slate-500">
                        진입 <span th:text="${#numbers.formatInteger(e.entryPrice, 0, 'COMMA')}">0</span>
                        / 전략 <span th:text="${e.strategyId}">-</span>
                    </div>
                </li>
                <li th:if="${recentTrades.isEmpty()}" class="py-2 text-slate-400 text-xs">최근 매매가 없습니다.</li>
            </ul>
            <div class="mt-3 text-right">
                <a th:href="@{/journal}" class="text-xs text-teal-700 hover:underline">매매일지 전체 보기 →</a>
            </div>
        </div>
    </div>

    <div class="mt-8 text-xs text-slate-400">
        실시간 시세·주문 스트림은 market-data 모듈의 KIS 클라이언트가 core.event 로 발행되기 시작하면 자동 활성화됩니다.
    </div>
</section>
</body>
</html>
