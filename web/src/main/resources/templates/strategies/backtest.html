<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title/text()}, ~{::section})}">
<head><title>백테스트</title></head>
<body>
<section>
    <h1 class="text-2xl font-bold mb-4">백테스트 · <span th:text="${strategyId}">-</span></h1>

    <div class="bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded p-3 mb-4">
        백테스트 엔진(strategy 모듈)이 아직 조립되지 않았습니다. 아래 폼은 UI 프리뷰이며 제출 시 <code>501</code> 이 반환됩니다.
    </div>

    <form class="bg-white rounded-lg shadow-sm p-4 border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-4">
        <label class="text-sm">
            종목 리스트 (쉼표)
            <input type="text" name="universe" value="005930,000660" class="mt-1 w-full border border-slate-300 rounded px-2 py-1 text-sm"/>
        </label>
        <label class="text-sm">
            기간
            <input type="text" name="period" value="2024-01-01 ~ 2024-12-31" class="mt-1 w-full border border-slate-300 rounded px-2 py-1 text-sm"/>
        </label>
        <label class="text-sm md:col-span-2">
            조건식 DSL
            <textarea name="conditionExpr" rows="4" class="mt-1 w-full border border-slate-300 rounded px-2 py-1 text-sm font-mono">rsi14 &lt; 30</textarea>
        </label>
        <div class="md:col-span-2">
            <button type="button" disabled class="bg-slate-300 text-white px-4 py-2 rounded text-sm cursor-not-allowed">
                실행 (엔진 조립 전 비활성)
            </button>
        </div>
    </form>

    <div class="mt-6 bg-white rounded-lg shadow-sm p-4 border border-slate-200">
        <h2 class="text-sm font-semibold text-slate-500 mb-2">결과 지표</h2>
        <div class="text-xs text-slate-400">실행 후 총 수익률 · CAGR · MDD · Sharpe · 승률 · 거래 건수가 표시됩니다.</div>
    </div>
</section>
</body>
</html>
