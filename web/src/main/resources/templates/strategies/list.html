<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title/text()}, ~{::section})}">
<head><title>전략</title></head>
<body>
<section>
    <h1 class="text-2xl font-bold mb-4">전략 목록</h1>
    <div class="bg-white rounded-lg shadow-sm border border-slate-200 divide-y divide-slate-100">
        <div th:each="s : ${strategies}" class="p-4 flex items-center justify-between">
            <div>
                <div class="font-semibold" th:text="${s.name}">-</div>
                <div class="text-xs text-slate-500 font-mono" th:text="${s.description}">-</div>
            </div>
            <a th:href="@{'/strategies/' + ${s.id} + '/backtest'}"
               class="text-sm text-teal-700 hover:underline">백테스트 →</a>
        </div>
    </div>
    <div class="mt-4 text-xs text-slate-400">실제 전략 편집·등록 UI는 strategy 모듈 엔진 완료 후 확장됩니다.</div>
</section>
</body>
</html>
